  const items=[...document.querySelectorAll('#gs-results .gs-item')],cur=items.findIndex(x=>x.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;const n=(cur+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('sel',i===n));}
  else if(e.key==='Enter'){const sel=items[cur>=0?cur:0];if(sel)sel.click();}
  else if(e.key==='Escape'){inp.value='';renderSearchResults();inp.blur();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.cp'))document.querySelectorAll('.cp.open').forEach(x=>x.classList.remove('open'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.cp.open').forEach(x=>x.classList.remove('open'));});
document.addEventListener('click',e=>{const box=document.getElementById('gs-results');if(box&&!e.target.closest('.tb-search'))box.classList.remove('on');});
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='gsearch'&&e.target.value.trim().length>=2)renderSearchResults();});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.action==='ev-cat'){S._catFilter=t.value;saveUI();render();return;}
  if(t.dataset&&t.dataset.action==='ev-year'){S.tfY=t.value?parseInt(t.value):null;saveUI();render();return;}
  if(t.dataset&&t.dataset.action==='ev-apple'){setListUI({apple:t.checked});render();return;}
  if(t.dataset&&t.dataset.pref!==undefined){setPref(t.dataset.pref,t.value);return;}
  if(t.dataset&&t.dataset.prefWeekend!==undefined){setWeekend(parseInt(t.dataset.prefWeekend),t.checked);return;}
  if(t.id==='ph-ics-f'&&t.files.length){
    // Holiday calendar file (.ics) → My holidays: all-day events by date and title
    const r=new FileReader();r.onload=()=>{
      const p=S.prefs=JSON.parse(JSON.stringify(P()));const have=new Set((p.customHolidays||[]).map(h=>h.d+'|'+h.n));let added=0;
      String(r.result).replace(/\r?\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1).forEach(b=>{
        const dm=b.match(/DTSTART[^:\n]*:(\d{4})(\d{2})(\d{2})/),sm=b.match(/SUMMARY[^:\n]*:(.*)/);
        if(!dm)return;const d=`${dm[1]}-${dm[2]}-${dm[3]}`,n=(sm?sm[1]:'Holiday').replace(/\\([,;\\])/g,'$1').replace(/\\n/gi,' ').trim().slice(0,80);
        if(!have.has(d+'|'+n)){(p.customHolidays=p.customHolidays||[]).push({d,n});have.add(d+'|'+n);added++;}
      });
      saveS();render();toast(added?`Added ${added} holiday${added>1?'s':''}`:'No new holidays found in that file');
    };r.readAsText(t.files[0]);t.value='';return;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='imp-f'&&e.target.files.length){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.events||d.trips){if(d.trips&&!d.events){d.events=d.trips.map(t=>({...t,category:'trip',requiresLeave:true}));delete d.trips;}S=d;saveS();render();toast('Imported');}}catch(e2){toast('Error');}};r.readAsText(e.target.files[0]);}});
// Search input handler
document.addEventListener('input',e=>{
  if(e.target.matches('[data-action="search-events"]')){S._searchQ=e.target.value;render();
    // Re-focus after render
    setTimeout(()=>{const inp=document.querySelector('[data-action="search-events"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
  if(e.target.matches('[data-action="dash-search"]')){S._dashSearch=e.target.value;render();
    setTimeout(()=>{const inp=document.querySelector('[data-action="dash-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
  if(e.target.matches('[data-action="stat-year"]')){S._statY=e.target.value;render();return;}
  if(e.target.matches('[data-action="country-search"]')){S._countrySearch=e.target.value;render();
    setTimeout(()=>{const inp=document.querySelector('[data-action="country-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
});

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){xm();closeMobileMenu();}
  // Don't trigger shortcuts when typing in inputs
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='1')nav('dashboard');
  else if(e.key==='2')nav('events');
  else if(e.key==='3')nav('calendar');
  else if(e.key==='4')nav('leave');
  else if(e.key==='5')nav('budget');
  else if(e.key==='6')nav('settings');
  else if(e.key==='n'&&!e.ctrlKey&&!e.metaKey)fEvent();
  else if(e.key==='u'&&!e.ctrlKey&&!e.metaKey)showSmartUpload();
  else if(e.key==='/'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const si=document.getElementById('gsearch');if(si)si.focus();}
});

// Hamburger
document.getElementById('hamburger').onclick=toggleMobileMenu;
document.getElementById('sidebar-overlay').onclick=closeMobileMenu;
// Close mobile menu when navigating
const origNav=nav;
nav=function(v,x){closeMobileMenu();origNav(v,x);};

// FAB
document.getElementById('fab').onclick=()=>showSmartUpload();

// Tesseract lazy load
(function(){if(typeof Tesseract==='undefined'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.head.appendChild(s);}})();

// Build datalists for airline and location autocomplete
(function(){
  const alDl=document.createElement('datalist');alDl.id='airline-list';
  AIRLINE_NAMES.forEach(a=>{const o=document.createElement('option');o.value=a;alDl.appendChild(o);});
  document.body.appendChild(alDl);
  const locDl=document.createElement('datalist');locDl.id='location-list';
  const locSet=new Set();
  Object.entries(AIRPORTS).forEach(([code,city])=>{locSet.add(city);locSet.add(city+' ('+code+')');});
  CITIES.forEach(c=>locSet.add(c));
  [...locSet].sort().forEach(l=>{const o=document.createElement('option');o.value=l;locDl.appendChild(o);});
  document.body.appendChild(locDl);
})();

// Init
try{render();
  setTimeout(()=>{try{if(gateState()==='open')maybeAskRegion();}catch(e){}},1500);
  // Auto-sync on load
  const _initConf=getSyncConfig();
  if(acctEnabled()){acctInit().then(()=>{if(!_acct&&cloudMode()==='gist')fullSync();});}
  else if(_initConf.token){setTimeout(()=>fullSync(),800);}
  else if(_initConf.gistId){
    // Arrived via link — pull data anonymously (read-only, no token needed)
    setTimeout(()=>pullGistAnon(_initConf.gistId),500);
  }
}catch(e){console.error('Render error:',e);document.getElementById('app').innerHTML='<div style="padding:40px;color:#ff6b6b"><h2>Error loading app</h2><pre style="margin-top:12px;font-size:12px;white-space:pre-wrap;color:#e8e9ed">'+e.message+'\n\n'+e.stack+'</pre><button onclick="localStorage.removeItem(\'htV4\');localStorage.removeItem(\'htV3\');location.reload()" style="margin-top:16px;padding:8px 16px;background:#6c8cff;color:#fff;border:none;border-radius:8px;cursor:pointer">Reset &amp; Reload</button></div>';}

// Near-realtime sync: poll + visibility
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const vc=getSyncConfig();
    if(cloudMode())cloudFullSync();
    else if(vc.gistId&&!acctEnabled())pullGistAnon(vc.gistId);
  }
});
window.addEventListener('focus',()=>{
  const fc=getSyncConfig();
  if(cloudMode())cloudPull().then(pulled=>{if(pulled){render();toast('Synced from cloud');}});
  else if(fc.gistId&&!acctEnabled())pullGistAnon(fc.gistId);
});
window.addEventListener('beforeunload',()=>{
  if(_syncTimer){clearTimeout(_syncTimer);cloudPush();}
});
startSyncPolling();
setInterval(()=>{try{renderSidebar();}catch(e){}},60000);

// Offline detection
const _ob=document.createElement('div');_ob.className='offline-banner';_ob.textContent='You are offline — changes will sync when reconnected';document.body.appendChild(_ob);
window.addEventListener('online',async()=>{
  _ob.classList.remove('show');
  if(_acct&&sbClient()){try{await sbClient().auth.getSession();}catch(e){}}
  if(cloudMode())cloudPush();
  swCheck();
});

// Offline mode: sw.js keeps a copy of the app on this device. When a newer version has been downloaded,
// offer a reload (held back while a form is open, so nothing being typed is lost)
let _updLater=false;
function swCheck(){try{const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(c&&navigator.onLine)c.postMessage({type:'check-update',url:location.href});}catch(e){}}
function showUpdateBar(){
  if(_updLater||document.querySelector('.upd-bar'))return;
  const bg=document.getElementById('mbg');
  if(bg&&bg.classList.contains('open')){const o=new MutationObserver(()=>{if(!bg.classList.contains('open')){o.disconnect();showUpdateBar();}});o.observe(bg,{attributes:true,attributeFilter:['class']});return;}
  const b=document.createElement('div');b.className='upd-bar';b.setAttribute('role','status');
  b.innerHTML='<span class="upd-dot"></span><div class="upd-t"><b>New version available</b><span>Reload to get the latest features and fixes.</span></div><button class="upd-later" type="button">Later</button><button class="btn btn-p" type="button">Reload</button>';
  b.querySelector('.upd-later').onclick=()=>{_updLater=true;b.remove();toast('The update will load next time you open the app');};
  b.querySelector('.btn-p').onclick=async e=>{
    e.target.disabled=true;e.target.textContent='Saving…';
    try{if(_syncTimer){clearTimeout(_syncTimer);_syncTimer=null;await Promise.race([cloudPush(),new Promise(r=>setTimeout(r,4000))]);}}catch(err){}
    try{sessionStorage.setItem('htUpdated','1');}catch(err){}
    location.reload();
  };
  document.body.appendChild(b);
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Offline mode unavailable:',e)));
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='update-ready')showUpdateBar();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')swCheck();});
  setInterval(swCheck,30*60*1000);
}
try{if(sessionStorage.getItem('htUpdated')){sessionStorage.removeItem('htUpdated');setTimeout(()=>toast('Updated to the latest version'),800);}}catch(e){}
window.addEventListener('offline',()=>_ob.classList.add('show'));
if(!navigator.onLine)_ob.classList.add('show');
</script>
