  },{saveLabel:'Generate'});
}

function buildItineraryItems(t,opts){
  opts=opts||{};
  const secs=opts.sections||['flights','hotels','activities','transport'];
  const flds=opts.fields||['costs','booking','notes'];
  const incBooking=flds.includes('booking');
  const incNotes=flds.includes('notes');
  const incPayments=flds.includes('payments');
  const dateFrom=opts.dateFrom||'';
  const dateTo=opts.dateTo||'';
  const inRange=d=>{if(!d)return true;if(dateFrom&&d<dateFrom)return false;if(dateTo&&d>dateTo)return false;return true;};
  const items=[];
  const fmtD2=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  const fmtT2=dt=>{if(!dt)return '';try{const d2=new Date(dt.includes('T')?dt:dt.replace(' ','T'));if(isNaN(d2))return dt;return d2.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return dt;}};
  const payDet=(e)=>{const r=[];if(!incPayments)return r;if(e.fullPaymentAmount)r.push(['Full Payment',`${e.fullPaymentCurrency||e.currency||'SGD'} ${e.fullPaymentAmount}`]);if(e.depositAmount)r.push(['Deposit',`${e.depositCurrency||e.currency||'SGD'} ${e.depositAmount}${e.depositPaid==='yes'?' (Paid)':' (Unpaid)'}`]);if(e.depositDate)r.push(['Deposit Date',fmtD2(e.depositDate)]);if(e.paymentDueDate)r.push(['Payment Due',fmtD2(e.paymentDueDate)]);if(e.fullyPaid==='yes')r.push(['Status','Fully Paid']);return r;};
  if(secs.includes('flights'))(t.flights||[]).forEach(f=>{
    const d=f.departureTime?(f.departureTime.includes('T')?f.departureTime.split('T')[0]:f.departureTime.split(' ')[0]):'';
    if(!inRange(d||t.startDate))return;
    const det=[];
    if(f.from||f.to)det.push(['Route',`${f.from||'?'} to ${f.to||'?'}`]);
    if(f.departureTime)det.push(['Depart',fmtT2(f.departureTime)]);
    if(f.arrivalTime)det.push(['Arrive',fmtT2(f.arrivalTime)]);
    if(f.pnr)det.push(['PNR',f.pnr]);
    if(f.seat)det.push(['Seat',f.seat]);
    if(f.duration)det.push(['Duration',f.duration]);
    if(incBooking&&f.bookingDetails)det.push(['Booking',f.bookingDetails]);
    if(incNotes&&f.notes)det.push(['Notes',f.notes]);
    det.push(...payDet(f));
    items.push({type:'FLIGHT',date:d||t.startDate,sortKey:f.departureTime||d||t.startDate,
      title:`${f.airline||''} ${f.flightNumber||''}`.trim()||'Flight',
      details:det,cost:f.cost?parseFloat(f.cost):0,currency:f.currency||'SGD',color:[59,130,246],
      timeStr:f.departureTime?`${fmtT2(f.departureTime)} - ${fmtT2(f.arrivalTime)}`:'',
      detailStr:[f.from&&f.to?`${f.from} → ${f.to}`:'',f.pnr?`PNR: ${f.pnr}`:'',f.seat?`Seat: ${f.seat}`:'',f.duration?`Duration: ${f.duration}`:''].filter(Boolean).join(' | ')
    });
  });
  if(secs.includes('hotels'))(t.hotels||[]).forEach(h=>{
    if(!inRange(h.checkIn||t.startDate))return;
    const det=[];
    if(h.checkIn)det.push(['Check-in',fmtD2(h.checkIn)]);
    if(h.checkOut)det.push(['Check-out',fmtD2(h.checkOut)]);
    if(h.checkIn&&h.checkOut)det.push(['Nights',String(nights(h.checkIn,h.checkOut))]);
    if(incBooking&&h.bookingNumber)det.push(['Booking #',h.bookingNumber]);
    if(incNotes&&h.notes)det.push(['Notes',h.notes]);
    det.push(...payDet(h));
    items.push({type:'HOTEL',date:h.checkIn||t.startDate,sortKey:h.checkIn||t.startDate,
      title:h.name||'Hotel',
      details:det,cost:h.cost?parseFloat(h.cost):0,currency:h.currency||'SGD',color:[168,85,247],
      timeStr:h.checkIn&&h.checkOut?`${fmtD2(h.checkIn)} - ${fmtD2(h.checkOut)}`:'',
      detailStr:[incBooking&&h.bookingNumber?`Booking: ${h.bookingNumber}`:'',h.checkIn&&h.checkOut?`${nights(h.checkIn,h.checkOut)} nights`:''].filter(Boolean).join(' | ')
    });
  });
  if(secs.includes('activities'))(t.activities||[]).forEach(a=>{
    if(!inRange(a.date||t.startDate))return;
    const det=[];
    if(a.location)det.push(['Location',a.location]);
    if(a.time)det.push(['Time',a.time]);
    if(a.duration)det.push(['Duration',a.duration]);
    if(incBooking&&a.bookingDetails)det.push(['Booking',a.bookingDetails]);
    if(incNotes&&a.notes)det.push(['Notes',a.notes]);
    det.push(...payDet(a));
    items.push({type:'ACTIVITY',date:a.date||t.startDate,sortKey:(a.date||t.startDate)+' '+(a.time||'99'),
      title:a.name||'Activity',
      details:det,cost:a.cost?parseFloat(a.cost):0,currency:a.currency||'SGD',color:[245,158,11],
      timeStr:a.time||'',
      detailStr:[a.location||'',a.duration?`Duration: ${a.duration}`:'',incBooking&&a.bookingDetails?`Booking: ${a.bookingDetails}`:''].filter(Boolean).join(' | ')
    });
  });
  if(secs.includes('transport'))(t.transport||[]).forEach(x=>{
    if(!inRange(x.date||t.startDate))return;
    const det=[];
    if(x.location)det.push(['Location',x.location]);
    if(x.time)det.push(['Time',x.time]);
    if(x.duration)det.push(['Duration',x.duration]);
    if(incBooking&&x.bookingDetails)det.push(['Booking',x.bookingDetails]);
    if(incNotes&&x.notes)det.push(['Notes',x.notes]);
    det.push(...payDet(x));
    items.push({type:'TRANSPORT',date:x.date||t.startDate,sortKey:(x.date||t.startDate)+' '+(x.time||'99'),
      title:`${x.type||''} ${x.name||''}`.trim()||'Transport',
      details:det,cost:x.cost?parseFloat(x.cost):0,currency:x.currency||'SGD',color:[34,197,94],
      timeStr:x.time||'',
      detailStr:[x.location||'',x.duration?`Duration: ${x.duration}`:'',incBooking&&x.bookingDetails?`Booking: ${x.bookingDetails}`:''].filter(Boolean).join(' | ')
    });
  });
  items.sort((a,b)=>a.sortKey.localeCompare(b.sortKey));
  return items;
}

function genItineraryPDF(t,opts){
  if(typeof window.jspdf==='undefined'){toast('PDF library still loading — try again');return;}
  opts=opts||{};
  const incCost=(opts.fields||[]).includes('costs');
  const secs=opts.sections||['flights','hotels','activities','transport'];
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=15,CW=W-2*M;
  let y=0,pg=1;
  const fmtD2=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  const fmtDL=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
  const addFoot=()=>{doc.setFontSize(7);doc.setTextColor(160);doc.text('Generated by Holiday Tracker',M,290);doc.text('Page '+pg,W-M,290,{align:'right'});doc.setTextColor(0);};
  const np=()=>{addFoot();doc.addPage();y=15;pg++;};
  const ck=h=>{if(y+h>278)np();};

  // Header
  doc.setFillColor(30,41,59);doc.rect(0,0,W,48,'F');
  doc.setFillColor(59,130,246);doc.rect(0,48,W,1.5,'F');
  doc.setTextColor(148,163,184);doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('EVENT ITINERARY',M,14);
  doc.setTextColor(255);doc.setFontSize(20);doc.setFont('helvetica','bold');
  const tLines=doc.splitTextToSize(t.name,CW);doc.text(tLines,M,26);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(203,213,225);
  doc.text(`${fmtD2(t.startDate)} — ${fmtD2(t.endDate)}  |  ${days(t.startDate,t.endDate)} days, ${nights(t.startDate,t.endDate)} nights  |  ${t.locations.join(', ')}`,M,40);
  if(incCost){doc.setTextColor(134,239,172);doc.text(`Total: SGD ${eCost(t).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`,W-M,40,{align:'right'});}
  y=56;doc.setTextColor(0);

  // Build & group items
  const items=buildItineraryItems(t,opts);
  const byDate={};items.forEach(it=>{if(!byDate[it.date])byDate[it.date]=[];byDate[it.date].push(it);});
  const sortedDates=Object.keys(byDate).sort();
  const evStart=new Date(t.startDate+'T00:00:00');

  if(!items.length){
    doc.setFontSize(11);doc.setTextColor(100);doc.text('No bookings match the selected filters.',M,y);
    addFoot();doc.save(`${t.name.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'-').toLowerCase()}-itinerary.pdf`);
    toast('PDF exported');return;
  }

  sortedDates.forEach(date=>{
    const dayNum=Math.max(1,Math.ceil((new Date(date+'T00:00:00')-evStart)/864e5)+1);
    ck(20);
    // Day header
    doc.setFillColor(241,245,249);doc.roundedRect(M,y,CW,8,1.5,1.5,'F');
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
    doc.text(`Day ${dayNum} — ${fmtDL(date)}`,M+4,y+5.5);
    y+=12;

    byDate[date].forEach(item=>{
      const nDet=item.details.length+(incCost&&item.cost?1:0);
      const estH=14+nDet*4.2;
      ck(estH+4);

      // Accent border
      doc.setDrawColor(item.color[0],item.color[1],item.color[2]);doc.setLineWidth(1);
      doc.line(M+2,y,M+2,y+estH-3);

      // Type
      doc.setFontSize(7);doc.setFont('helvetica','bold');
      doc.setTextColor(item.color[0],item.color[1],item.color[2]);
      doc.text(item.type,M+6,y+3);

      // Title
      doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
      doc.text(doc.splitTextToSize(item.title,CW-12)[0],M+6,y+8.5);

      // Details
      let dy=y+14;doc.setFontSize(8);
      item.details.forEach(([k,v])=>{
        doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);
        doc.text(k+':',M+6,dy);
        doc.setTextColor(51,65,85);
        const vLines=doc.splitTextToSize(String(v||''),CW-38);
        doc.text(vLines[0]||'',M+28,dy);
        if(vLines.length>1){dy+=4;doc.text(vLines[1],M+28,dy);}
        dy+=4.2;
      });
      if(incCost&&item.cost){
        doc.setFont('helvetica','bold');doc.setTextColor(22,163,74);
        doc.text('Cost:',M+6,dy);
        doc.text(`${item.currency} ${item.cost.toLocaleString()}`,M+28,dy);
        dy+=4.2;
      }
      y=dy+3;doc.setDrawColor(0);doc.setLineWidth(0.2);
    });
    y+=4;
  });

  // Cost summary
  if(incCost){
    ck(50);y+=4;
    doc.setDrawColor(200);doc.line(M,y,W-M,y);y+=8;
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
    doc.text('Cost Summary',M,y);y+=8;
    const catMap={flights:'Flights',hotels:'Hotels',activities:'Activities',transport:'Transport'};
    const cats=secs.map(s=>({l:catMap[s]||s,a:t[s]||[]}));
    doc.setFontSize(9);
    cats.forEach(c=>{
      const sm=c.a.reduce((s,e)=>s+toSGD(e.cost,e.currency,e.rateToSGD),0);
      if(sm>0){
        doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.text(c.l,M+4,y);
        doc.setFont('helvetica','normal');doc.setTextColor(51,65,85);
        doc.text(`SGD ${sm.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`,M+45,y);y+=5;
      }
    });
    y+=1;doc.setDrawColor(200);doc.line(M+4,y,M+80,y);y+=6;
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
    doc.text('Total',M+4,y);
    doc.text(`SGD ${eCost(t).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`,M+45,y);
  }

  addFoot();
  const fn=t.name.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'-').toLowerCase();
  doc.save(`${fn}-itinerary.pdf`);toast('PDF exported');
}

function genItineraryXLSX(t,opts){
  if(typeof XLSX==='undefined'){toast('Excel library still loading — try again');return;}
  opts=opts||{};
  const incCost=(opts.fields||[]).includes('costs');
  const incPayments=(opts.fields||[]).includes('payments');
  const secs=opts.sections||['flights','hotels','activities','transport'];
  const fmtD2=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  const wb=XLSX.utils.book_new();

  // Overview sheet
  const catMap={flights:'Flights',hotels:'Hotels',activities:'Activities',transport:'Transport'};
  const ov=[['Event Itinerary'],[],['Event Name',t.name],['Dates',`${fmtD2(t.startDate)} — ${fmtD2(t.endDate)}`],
    ['Duration',`${days(t.startDate,t.endDate)} days, ${nights(t.startDate,t.endDate)} nights`],
    ['Locations',t.locations.join(', ')],[]];
  secs.forEach(s=>ov.push([catMap[s]||s,(t[s]||[]).length]));
  if(incCost){ov.push([],['Total Cost (SGD)',eCost(t).toFixed(2)]);}
  const ws1=XLSX.utils.aoa_to_sheet(ov);ws1['!cols']=[{wch:18},{wch:45}];
  XLSX.utils.book_append_sheet(wb,ws1,'Overview');

  // Itinerary sheet
  const hdr=['Day','Date','Type','Name','Details','Time'];
  const flds=opts.fields||['costs','booking','notes'];
  if(flds.includes('notes'))hdr.push('Notes');
  if(incCost)hdr.push('Cost','Currency');
  if(incPayments)hdr.push('Full Payment','Deposit','Deposit Date','Payment Due','Fully Paid');
  const rows=[hdr];
  const items=buildItineraryItems(t,opts);
  const evStart=new Date(t.startDate+'T00:00:00');
  items.forEach(it=>{
    const dn=Math.max(1,Math.ceil((new Date(it.date+'T00:00:00')-evStart)/864e5)+1);
    const r=[dn,fmtD2(it.date),it.type,it.title,it.detailStr,it.timeStr];
    if(flds.includes('notes'))r.push(it.details.find(d=>d[0]==='Notes')?it.details.find(d=>d[0]==='Notes')[1]:'');
    if(incCost)r.push(it.cost||'',it.currency);
    if(incPayments){
      const full=it.details.find(d=>d[0]==='Full Payment');
      const dep=it.details.find(d=>d[0]==='Deposit');
      const depDate=it.details.find(d=>d[0]==='Deposit Date');
      const pmtDue=it.details.find(d=>d[0]==='Payment Due');
      const status=it.details.find(d=>d[0]==='Status');
      r.push(full?full[1]:'',dep?dep[1]:'',depDate?depDate[1]:'',pmtDue?pmtDue[1]:'',status?status[1]:'');
    }
    rows.push(r);
  });
  if(incCost){rows.push([]);const totalRow=new Array(hdr.length).fill('');totalRow[hdr.indexOf('Cost')-1]='Total (SGD)';totalRow[hdr.indexOf('Cost')]=eCost(t).toFixed(2);rows.push(totalRow);}
  const ws2=XLSX.utils.aoa_to_sheet(rows);
  ws2['!cols']=[{wch:5},{wch:16},{wch:11},{wch:30},{wch:40},{wch:22}];
  if(flds.includes('notes'))ws2['!cols'].push({wch:25});
  if(incCost)ws2['!cols'].push({wch:10},{wch:8});
  if(incPayments)ws2['!cols'].push({wch:18},{wch:18},{wch:12},{wch:14},{wch:10});
  XLSX.utils.book_append_sheet(wb,ws2,'Itinerary');

  const fn=t.name.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'-').toLowerCase();
  XLSX.writeFile(wb,`${fn}-itinerary.xlsx`);toast('Excel exported');
}

function modal(title,body,onSave,opts){
  opts=opts||{};
  const saveLabel=opts.saveLabel||'Save';
  const saveCls=opts.danger?'btn btn-d':'btn btn-p';
  const o=document.getElementById('mbg');
  o.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="modal-x" data-action="xm">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-s" data-action="xm">Cancel</button><button class="${saveCls}" id="msave">${saveLabel}</button></div></div>`;
  o.classList.add('open');
  if(onSave)document.getElementById('msave').onclick=()=>{const r=onSave();if(r===false)return;xm();};
  o.onclick=e=>{if(e.target===o)xm();};
  o.querySelectorAll('.dz').forEach(setupDZ);
  setupDZTabs(o);
}
function xm(){document.getElementById('mbg').classList.remove('open');}

function eventCur(ev){
  if(!ev)return 'SGD';
  const all=[...(ev.flights||[]),...(ev.hotels||[]),...(ev.activities||[]),...(ev.transport||[])];
  for(let i=all.length-1;i>=0;i--){if(all[i].currency)return all[i].currency;}
  return 'SGD';
}
function curSel(sel='SGD',nm='currency'){return`<select class="fc" name="${nm}">${CUR.map(c=>`<option value="${c}"${c===sel?' selected':''}>${c}</option>`).join('')}</select>`;}
function dzHtml(id,showTextTab){
  const tabs=showTextTab?`<div class="dz-tabs"><button class="dz-tab active" data-dztab="file" data-dzid="${id}">Upload / Paste image</button><button class="dz-tab" data-dztab="text" data-dzid="${id}">Paste text</button></div>`:'';
  const textPane=showTextTab?`<div class="dz-text-pane" data-dzid="${id}" style="display:none"><textarea class="dz-paste-area" data-dztext="${id}" placeholder="Paste your booking confirmation email text here…\n\nSupports flight tickets, hotel reservations, activities, and transport bookings."></textarea><button class="btn btn-p dz-paste-btn" data-dzparse="${id}">Parse text</button></div>`:'';
  return`<div class="fi full"><label>Upload / Paste booking</label>${tabs}<div class="dz" data-dz="${id}"><div class="dz-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><p>Drop file or paste screenshot here</p><p class="sm">Ctrl+V / ⌘V to paste · Supports PDF, PNG, JPG</p><input type="file" accept=".pdf,.png,.jpg,.jpeg" style="display:none" data-fi="${id}"></div>${textPane}<div class="ocr-prog" id="op-${id}" style="display:none"></div><div class="ocr-out" id="or-${id}" style="display:none"></div></div>`;
}

function setupDZ(dz){
  const id=dz.dataset.dz,inp=dz.querySelector(`[data-fi="${id}"]`);
  dz.onclick=()=>inp.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files.length)runOCR(e.dataTransfer.files[0],id);};
  inp.onchange=e=>{if(e.target.files.length)runOCR(e.target.files[0],id);};
  // Clipboard paste (screenshots and text) is handled by one document-level listener, so it works
  // wherever focus is — a paste event goes to the focused element, which is often outside the modal
  if(!document._dzPasteSet){
    document._dzPasteSet=true;
    document.addEventListener('paste',e=>{
      // Route to the drop zone in the open modal
      const bg=document.getElementById('mbg');
      const activeDZ=bg&&bg.classList.contains('open')?bg.querySelector('.dz[data-dz]'):null;
      if(!activeDZ)return;
      const activeId=activeDZ.dataset.dz;
      const items=e.clipboardData&&e.clipboardData.items;
      if(!items)return;
      // Check for image data first (screenshot paste)
      for(let i=0;i<items.length;i++){
        if(items[i].type.startsWith('image/')){
          e.preventDefault();
          const blob=items[i].getAsFile();
          if(blob)runOCR(blob,activeId);
          return;
        }
      }
      // Check for text data (email confirmation paste)
      const txt=e.clipboardData.getData('text/plain');
      if(txt&&txt.trim().length>20){
        // Only intercept if the paste target isn't a textarea/input
        if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
        e.preventDefault();
        handleTextPaste(txt.trim(),activeId);
      }
    });
  }
}

async function runOCR(file,id){
  const p=document.getElementById('op-'+id),r=document.getElementById('or-'+id);
  p.style.display='flex';p.innerHTML='<div class="spinner"></div> Processing…';r.style.display='none';
  try{
    let txt='';
    if(file.type==='application/pdf'){
      // Try PDF.js text extraction first (much more accurate than OCR)
      p.innerHTML='<div class="spinner"></div> Extracting text from PDF…';
      if(typeof pdfjsLib==='undefined'){initPdfJs();await new Promise(r2=>setTimeout(r2,1000));}
      if(typeof pdfjsLib!=='undefined'){
        const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
        for(let i=1;i<=Math.min(pdf.numPages,10);i++){
          p.innerHTML=`<div class="spinner"></div> Reading page ${i}/${pdf.numPages}…`;
          const pg=await pdf.getPage(i);
          const tc=await pg.getTextContent();
          const pageTxt=tc.items.map(it=>it.str).join(' ');
          txt+=pageTxt+'\n\n';
        }
        // If text extraction got very little, fall back to OCR
        if(txt.replace(/\s/g,'').length<30){
          txt='';
          p.innerHTML='<div class="spinner"></div> Text extraction sparse, trying OCR…';
          for(let i=1;i<=Math.min(pdf.numPages,10);i++){
            p.innerHTML=`<div class="spinner"></div> OCR page ${i}/${pdf.numPages}…`;
            const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.5}),cv=document.createElement('canvas');
            cv.width=vp.width;cv.height=vp.height;
            await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
            if(typeof Tesseract!=='undefined'){const r2=await Tesseract.recognize(cv,'eng',{tessedit_pageseg_mode:'6'});txt+=r2.data.text+'\n\n';}
          }
        }
      }else{txt='PDF.js not loaded. Try again in a moment.';}
    }else if(file.type.startsWith('image/')){
      p.innerHTML='<div class="spinner"></div> Running OCR on image…';
      if(typeof Tesseract!=='undefined'){
        // Use higher quality settings for screenshots
        const r2=await Tesseract.recognize(file,'eng',{tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
        txt=r2.data.text;
      }else{txt='Tesseract not loaded yet. Try again in a moment.';}
    }else{txt='Unsupported file type: '+file.type;}
    r.textContent=txt.trim()||'No text detected.';r.style.display='block';
    p.innerHTML='✓ Done — '+file.name;
    // Store for debugging
    window._lastOCRText=txt.trim();
    // Auto-fill form fields if inside a modal
    if(txt.trim())autoFillForm(txt.trim(),id);
    if(txt.trim()&&window._suDocHook)window._suDocHook(id,txt.trim(),file.name||'Pasted screenshot');
  }catch(e){p.innerHTML='Error: '+e.message;console.error('OCR error:',e);r.style.display='none';}
}

function autoFillForm(txt,dzId){
  const m=document.querySelector('.modal');if(!m||m.querySelector('#su-result'))return;// Smart Upload has its own review
  const parsed=parseBookingText(txt);if(!parsed)return;
  window._lastParsed=parsed;console.log('OCR parsed:',JSON.stringify(parsed,null,2));
  const s=(n,v)=>{const el=m.querySelector(`[name="${n}"]`);if(el&&!el.value&&v)el.value=v;};
  // Detect form type by checking which fields exist
  if(m.querySelector('[name="airline"]')){
    // Flight form
    if(parsed.multiLeg&&parsed.legs&&parsed.legs.length>=2){
      // Multi-leg: fill form with first leg, store remaining legs for save callback
      const leg1=parsed.legs[0];
      s('airline',leg1.airline||parsed.airline);s('fn',leg1.flightNumber||'');s('pnr',leg1.pnr||parsed.pnr);
      s('seat',leg1.seat||'');s('from',leg1.from||'');s('to',leg1.to||'');
      if(leg1.date)s('dep',(leg1.date+'T'+(leg1.departureTime||'00:00')));
      if(leg1.arrivalDate||leg1.date)s('arr',((leg1.arrivalDate||leg1.date)+'T'+(leg1.arrivalTime||'00:00')));
      s('duration',leg1.duration||'');
      s('cost',leg1.cost||parsed.cost);
      if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
      // Store additional legs so fFlight save callback can add them
      window._pendingFlightLegs=parsed.legs.slice(1).map(leg=>({
        airline:leg.airline||parsed.airline||'',flightNumber:leg.flightNumber||'',
        pnr:leg.pnr||parsed.pnr||'',seat:leg.seat||'',from:leg.from||'',to:leg.to||'',
        departureTime:(leg.date?leg.date+'T':'')+(leg.departureTime||'00:00'),
        arrivalTime:((leg.arrivalDate||leg.date)?(leg.arrivalDate||leg.date)+'T':'')+(leg.arrivalTime||'00:00'),
        duration:leg.duration||'',cost:leg.cost||'',currency:parsed.currency||'SGD',
        notes:leg.duration?'Duration: '+leg.duration:'',ocrText:''
      }));
      toast(parsed.legs.length+' flights detected — Leg 1 shown, save to add all');
      return;
    }
    s('airline',parsed.airline);s('fn',parsed.flightNumber);s('pnr',parsed.pnr);
    s('seat',parsed.seat);s('from',parsed.from);s('to',parsed.to);
    if(parsed.date)s('dep',(parsed.date+'T'+(parsed.departureTime||'00:00')));
    if(parsed.dateTo||parsed.date)s('arr',((parsed.dateTo||parsed.date)+'T'+(parsed.arrivalTime||'00:00')));
    s('duration',parsed.duration||'');
    s('cost',parsed.cost);
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
    // Auto-calc duration if dep & arr filled
    setTimeout(()=>{const dep=m.querySelector('[name="dep"]'),arr=m.querySelector('[name="arr"]'),dur=m.querySelector('[name="duration"]');if(dep&&arr&&dur&&dep.value&&arr.value&&!dur.value){const ms=new Date(arr.value)-new Date(dep.value);if(ms>0){const h=Math.floor(ms/3600000),mn=Math.round((ms%3600000)/60000);dur.value=h+'h '+(mn<10?'0':'')+mn+'m';}}},100);
  }else if(m.querySelector('[name="ci"]')){
    // Hotel form
    s('name',parsed.hotelName||parsed.name);s('bn',parsed.bookingNumber||parsed.pnr);
    s('ci',parsed.date);s('co',parsed.dateTo);s('cost',parsed.cost);
    if(parsed.roomType||parsed.nights){const notesParts=[];if(parsed.roomType)notesParts.push(parsed.roomType);if(parsed.nights)notesParts.push(parsed.nights+' night'+(parsed.nights>1?'s':''));s('notes',notesParts.join(' · '));}
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
    // Auto-calc nights after fill
    setTimeout(()=>{const ci=m.querySelector('[name="ci"]'),co=m.querySelector('[name="co"]'),ni=m.querySelector('[name="nights"]');if(ci&&co&&ni&&ci.value&&co.value&&!ni.value){const n=calcNights(ci.value,co.value);if(n)ni.value=n;}},100);
  }else if(m.querySelector('[name="loc"]')&&!m.querySelector('[name="type"]')){
    // Activity form
    s('name',parsed.title||parsed.name);s('time',suTime24(parsed.departureTime));s('loc',parsed.locations?parsed.locations[0]:'');
    s('date',parsed.date);s('cost',parsed.cost);s('bd',parsed.pnr||parsed.bookingNumber);
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
  }else if(m.querySelector('[name="type"]')){
    // Transport form
    s('name',parsed.provider||parsed.name);s('time',suTime24(parsed.departureTime));
    if(parsed.transportType){const tEl=m.querySelector('[name="type"]');if(tEl)tEl.value=parsed.transportType;}
    if(parsed.title&&parsed.title!==parsed.provider)s('notes',parsed.title);s('loc',parsed.locations?parsed.locations[0]:'');
    s('date',parsed.date);s('cost',parsed.cost);s('bd',parsed.pnr||parsed.bookingNumber);
    if(parsed.currency){const cEl=m.querySelector('[name="currency"]');if(cEl)cEl.value=parsed.currency;}
  }
  toast('Auto-filled from scan');
}

// ===== SMART UPLOAD =====
const SU_LABELS={airline:'Airline',flightNumber:'Flight #',pnr:'PNR',seat:'Seat',from:'From',to:'To',date:'Date',dateTo:'End Date',departureTime:'Departure',arrivalTime:'Arrival',duration:'Duration',hotelName:'Hotel',name:'Name',bookingNumber:'Booking #',cost:'Cost',currency:'Currency',locations:'Locations'};
function suFieldHtml(k,v){
  const label=SU_LABELS[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase());
  const val=Array.isArray(v)?v.join(', '):String(v||'');
  const cls=val?'detected':'empty';
  return `<div class="su-field"><span class="k">${label}</span><span class="v ${cls}">${val?esc(val):'Not detected'}</span></div>`;
}
function suParsedHtml(parsed){
  let h='<h4><span style="color:var(--green)">✓</span> Extracted Data</h4>';
  if(parsed.multiLeg&&parsed.legs){
    h+=suFieldHtml('Type','Multi-segment flight ('+parsed.legs.length+' legs)');
    h+=suFieldHtml('pnr',parsed.pnr);h+=suFieldHtml('airline',parsed.airline);
    h+=suFieldHtml('date',(parsed.date||'')+' → '+(parsed.dateTo||parsed.date||''));
    parsed.legs.forEach((leg,i)=>{
      h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600;font-size:11px;color:var(--primary)">Leg ${i+1}: ${esc(leg.flightNumber||'')}</span></div>`;
      h+=suFieldHtml('Route',(leg.from||'?')+' → '+(leg.to||'?'));
      if(leg.date)h+=suFieldHtml('date',leg.date);
      if(leg.departureTime)h+=suFieldHtml('departureTime',leg.departureTime);
      if(leg.arrivalTime)h+=suFieldHtml('arrivalTime',leg.arrivalTime);
      if(leg.seat)h+=suFieldHtml('seat',leg.seat);
      if(leg.duration)h+=suFieldHtml('duration',leg.duration);
    });
  }else{
    const order=['airline','flightNumber','hotelName','name','from','to','date','dateTo','departureTime','arrivalTime','pnr','seat','duration','bookingNumber','cost','currency','locations'];
    const shown=new Set();
    order.forEach(k=>{if(parsed[k]){h+=suFieldHtml(k,parsed[k]);shown.add(k);}});
    Object.entries(parsed).filter(([k,v])=>v&&!shown.has(k)&&k!=='rawText'&&k!=='type'&&k!=='multiLeg'&&k!=='legs').forEach(([k,v])=>{h+=suFieldHtml(k,v);});
  }
  if(parsed.rawText)h+=`<button class="su-raw-toggle" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='none'?'block':'none';this.textContent=el.style.display==='none'?'Show raw text ▸':'Hide raw text ▾'">Show raw text ▸</button><div class="ocr-out" style="display:none;margin-top:4px">${esc(parsed.rawText)}</div>`;
  return h;
}
// Normalise "2:30 pm" / "9:05" / "14:30" → "HH:MM" (24h); '' if unparseable
function suTime24(t){
  const m=String(t||'').trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);if(!m)return '';
  let h=parseInt(m[1]);const ap=(m[3]||'').toLowerCase();
  if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
  return h>23?'':String(h).padStart(2,'0')+':'+m[2];
}
// Flights detected in a parsed document → editable leg rows
function suLegsFromParsed(p){
  if(p.multiLeg&&p.legs&&p.legs.length)return p.legs.map(l=>({airline:l.airline||p.airline||'',duration:l.duration||'',fn:l.flightNumber||'',from:l.from||'',to:l.to||'',date:l.date||'',time:suTime24(l.departureTime),adate:l.arrivalDate||l.date||'',atime:suTime24(l.arrivalTime),seat:l.seat||'',pnr:l.pnr||'',cost:l.cost||'',currency:l.currency||''}));
  return [{airline:p.airline||'',fn:p.flightNumber||'',from:p.from||'',to:p.to||'',date:p.date||'',time:suTime24(p.departureTime),adate:p.dateTo||p.date||'',atime:suTime24(p.arrivalTime),seat:p.seat||''}];
}
// Suggested event name/locations: for round trips, the destination is where the longest stay happens
function suTripInfo(legs){
  const L=legs.filter(l=>l.from||l.to);if(!L.length)return{name:'',locations:[]};
  const home=L[0].from,round=L.length>=2&&home&&L[L.length-1].to===home;
  let dest=L[L.length-1].to||L[0].to;
  if(round){
    const ts=(d,t)=>d?new Date(d+'T'+(t||'00:00')).getTime():NaN;
    let best=-1;
    for(let i=0;i<L.length-1;i++){const gap=ts(L[i+1].date,L[i+1].time)-ts(L[i].adate||L[i].date,L[i].atime);if(gap>best){best=gap;dest=L[i].to;}}
  }
  const locs=[...new Set(L.flatMap(l=>[l.from,l.to]).filter(c=>c&&c!==home))];
  return{name:dest?dest+' Trip':'',locations:locs.length?locs:[dest].filter(Boolean)};
}
function suLegRowHtml(l){
  l=l||{};
  const f=(n,v,ph,type)=>`<label class="su-lf"><span>${ph}</span><input class="fc" ${type?`type="${type}"`:''} data-k="${n}" value="${esc(v||'')}"${n==='from'||n==='to'?' list="location-list" autocomplete="off"':''}></label>`;
  return `<div class="su-leg" data-airline="${esc(l.airline||'')}" data-duration="${esc(l.duration||'')}" data-pnr="${esc(l.pnr||'')}" data-cost="${esc(l.cost||'')}" data-currency="${esc(l.currency||'')}">
    <div class="su-leg-head"><span class="su-leg-n"></span><button type="button" class="btn btn-ghost su-leg-rm" title="Remove this flight">Remove</button></div>
    <div class="su-leg-grid">
      ${f('fn',l.fn,'Flight #')}${f('from',l.from,'From')}${f('to',l.to,'To')}${f('seat',l.seat,'Seat')}
      ${f('date',l.date,'Depart date','date')}${f('time',l.time,'Depart time','time')}${f('adate',l.adate,'Arrive date','date')}${f('atime',l.atime,'Arrive time','time')}
    </div>
  </div>`;
}
function suReadLegs(){
  return [...document.querySelectorAll('#su-legs .su-leg')].map(r=>{const o={airline:r.dataset.airline||'',duration:r.dataset.duration||'',pnr:r.dataset.pnr||'',cost:r.dataset.cost||'',currency:r.dataset.currency||''};r.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());return o;}).filter(l=>l.fn||l.from||l.to);
}
// Date span covered by the legs (or by a non-flight booking)
function suSpan(type,parsed){
  if(type==='flight'){
    const legs=suReadLegs(),ds=legs.map(l=>l.date).filter(Boolean).sort(),es=legs.map(l=>l.adate||l.date).filter(Boolean).sort();
    return{start:ds[0]||'',end:es[es.length-1]||ds[ds.length-1]||''};
  }
  return{start:parsed.date||'',end:parsed.dateTo||parsed.date||''};
}
// Pick the existing event whose dates best cover the booking (±3 days for positioning flights)
function suMatchEvent(start,end){
  if(!start)return null;
  const day=d=>new Date(d+'T00:00:00').getTime(),buf=3*864e5,bs=day(start),be=day(end||start);
  let best=null,bestScore=-Infinity;
  for(const ev of S.events){
    if(ev.source==='apple'||!ev.startDate)continue;
    const es=day(ev.startDate),ee=day(ev.endDate||ev.startDate);
    if(be<es-buf||bs>ee+buf)continue;
    const overlap=Math.min(be,ee)-Math.max(bs,es);// >0 = real overlap; negative = gap within buffer
    if(overlap>bestScore){bestScore=overlap;best=ev;}
  }
  return best;
}
function suRefresh(parsed,opts){
  opts=opts||{};
  const type=document.getElementById('su-type').value;
  const evSel=document.getElementById('su-event');
  const span=suSpan(type,parsed);
  if(opts.rematch){const mt=suMatchEvent(span.start,span.end);evSel.value=mt?mt.id:'__new__';}
  const isNew=evSel.value==='__new__';
  document.getElementById('su-new-ev').style.display=isNew?'':'none';
  const hint=document.getElementById('su-match-hint');
  const mev=!isNew&&S.events.find(t=>t.id===evSel.value);
  hint.innerHTML=mev?`Dates match <b>${esc(mev.name)}</b> (${fmtS(mev.startDate)} – ${fmtS(mev.endDate)}). Choose “Create New Event” to keep it separate.`:'';
  hint.style.display=mev?'':'none';
  // Keep suggested name/dates in sync until the user edits them
  const nm=document.getElementById('su-ev-name'),sd=document.getElementById('su-ev-sd'),ed=document.getElementById('su-ev-ed');
  if(!sd.dataset.touched)sd.value=span.start;
  if(!ed.dataset.touched)ed.value=span.end;
  if(!nm.dataset.touched)nm.value=type==='flight'?(suTripInfo(suReadLegs()).name||parsed.name||'New Event'):(parsed.name||'New Event');
  const n=document.querySelectorAll('#su-legs .su-leg').length;
  document.querySelectorAll('#su-legs .su-leg-n').forEach((el,i)=>el.textContent=n>1?'Flight '+(i+1):'Flight');
  const cnt=document.getElementById('su-leg-count');if(cnt)cnt.textContent=n===1?'1 flight':n+' flights';
}

function suRenderBody(parsed){

    <p style="font-size:11px;color:var(--text3);margin:-2px 0 10px">Check each flight below. Fix anything misread, remove extras, or add any flight that wasn't picked up. All of them are saved together.</p>

    <button type="button" class="btn btn-s" id="su-add-leg" style="width:100%;margin-top:6px">+ Add another flight</button>
    <div class="fg" style="margin-top:12px">
      <div class="fi"><label>Booking total</label><input class="fc" type="number" step="0.01" id="su-cost" value="${esc(cost)}"${perLeg.length?` placeholder="Per flight" disabled title="Each flight keeps its own cost: ${esc(perLeg.map(l=>l.fn+' '+(l.currency||'')+' '+l.cost).join(', '))}"`:''}></div>
      <div class="fi"><label>Currency</label>${curSel(parsed.currency||'SGD','su-cost-cur')}</div>
    </div>

    ${parsed.rawText?`<button class="su-raw-toggle" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='none'?'block':'none';this.textContent=el.style.display==='none'?'Show raw text ▸':'Hide raw text ▾'">Show raw text ▸</button><div class="ocr-out" style="display:none;margin-top:4px">${esc(parsed.rawText)}</div>`:''}`;
}
// Several documents for one booking (e.g. OTA receipt + e-ticket) → one parsed result.
// Flights are matched by flight number; each document fills in what the others lack.
function suMergeDocs(docs){
  const ps=docs.map(d=>d.parsed).filter(Boolean);
  if(!ps.length)return null;
  const rawText=docs.map(d=>docs.length>1?`----- ${d.name} -----\n${d.txt}`:d.txt).join('\n\n');
  const flights=ps.filter(p=>p.type==='flight');
  if(!flights.length)return{...ps[ps.length-1],rawText};
  const asLegs=p=>p.multiLeg&&p.legs?p.legs:[{airline:p.airline,flightNumber:p.flightNumber,from:p.from,to:p.to,date:p.date,departureTime:p.departureTime,arrivalDate:p.dateTo,arrivalTime:p.arrivalTime,seat:p.seat}];
  const key=l=>{const fn=(l.flightNumber||'').replace(/\s+/g,'').toUpperCase().replace(/^([A-Z0-9]{2})0+(?=\d)/,'$1');return fn||((l.from||'')+'>'+(l.to||'')+'@'+(l.date||''));};
  const byKey=new Map();
  for(const p of flights)for(const l of asLegs(p)){
    if(!l.flightNumber&&!l.from&&!l.to)continue;
    const k=key(l),cur=byKey.get(k);
    if(!cur){byKey.set(k,{...l});continue;}

  const re=/([A-Z][A-Za-z .'()]{1,45}?)\s+-\s+([A-Z][A-Za-z .'()]{1,30}?)(?:\s+\d{1,2})?\s+Departure\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?),\s*([A-Za-z]+\s+\d{1,2},\s*\d{4}),\s*([\s\S]*?)\s+Arrival\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?),\s*([A-Za-z]+\s+\d{1,2},\s*\d{4}),\s*([\s\S]*?)\s+(?:\d\s+)?Airline\s+([A-Za-z .]+?)\s+([A-Z0-9]{2})\s?(\d{1,4})\b/g;
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    const leg={fromCode:_cityCode(m[5])||_cityCode(m[1]),toCode:_cityCode(m[8])||_cityCode(m[2]),departureTime:_hhmm(m[3]),arrivalTime:_hhmm(m[6])};
    if(!leg.fromCode)leg.from=m[1].trim().split(/\s+/).slice(-1)[0];
    if(!leg.toCode)leg.to=m[2].trim();
    const dd=_findDates(m[4]),ad=_findDates(m[7]);
    if(dd[0])leg.date=dd[0].date;if(ad[0])leg.arrivalDate=ad[0].date;
    leg.airline=_matchAirlineName(m[9])||m[9].trim();
    legs.push(_finishLeg(leg,{code:m[10],num:m[11]}));
  }
  return legs;
}
// B. "SIN 07:50 > SUB 09:10" route lines (Singapore Airlines e-ticket / PDF / email)
function _layoutCodeTime(txt){
  const re=/\b([A-Z]{3})\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\s*(?:>|→|-|–|—)?\s*(?:[A-Z][a-z]+\s+){0,3}([A-Z]{3})\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/g;
  const hits=[];let m;
  while((m=re.exec(txt))!==null)if(_isAp(m[1])&&_isAp(m[3])&&m[1]!==m[3])hits.push({m,pos:m.index,end:m.index+m[0].length});
  const al=_docAirlineCode(txt),legs=[];
  hits.forEach((h,i)=>{
    const prevEnd=i?hits[i-1].end:0,nextPos=i+1<hits.length?hits[i+1].pos:txt.length;
    const before=txt.substring(Math.max(prevEnd,h.pos-160),h.pos),after=txt.substring(h.end,Math.min(nextPos,h.end+260));
    const leg={fromCode:h.m[1],toCode:h.m[3],departureTime:_hhmm(h.m[2]),arrivalTime:_hhmm(h.m[4])};
    // Flight number: right before ("SQ 638 SIN 23:55…"), on the same line after, or the "1. SQ922 - …" header
    const lineAfter=after.split('\n')[0];
    const fnBefore=before.match(new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\s*$','i'));
    let fn=fnBefore?{code:fnBefore[1].toUpperCase(),num:fnBefore[2]}:_fnNear(lineAfter,al);
    if(!fn){const hdr=before.match(/\d\s*\.\s*([A-Z$5]{1,2}[A-Z0-9]?\s?[0-9OTIlSBZG]{2,4})\s*[-·.]/);if(hdr)fn=_fnNear(' '+hdr[1],al);}
    // Text after the route line that starts with another flight number belongs to the next flight
    const restAfter=after.substring(lineAfter.length);
    const nextFnAt=restAfter.search(new RegExp('\\b('+_FNCODES+')\\s{0,3}\\d{1,4}\\b'));
    const ownAfter=nextFnAt>=0?lineAfter+restAfter.substring(0,nextFnAt):after;
    if(!fn){const all=[...before.matchAll(new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g'))].filter(x=>!legs.some(l=>l.flightNumber===x[1]+x[2]));if(all.length){const l=all[all.length-1];fn={code:l[1],num:l[2]};}}
    if(!fn)fn=_fnNear(ownAfter,al);
    const ds=_findDates(ownAfter);
    if(ds[0]){leg.date=ds[0].date;if(ds[1])leg.arrivalDate=ds[1].date;}
    else{const db=_findDates(before);if(db.length)leg.date=db[db.length-1].date;}
    const dur=before.match(/(\d{1,2})\s*h(?:rs?|ours?)?\s*(\d{1,2})\s*min/i);if(dur)leg.duration=dur[1]+'h '+dur[2]+'m';
    legs.push(_finishLeg(leg,fn));
  });
  return legs;
}
// C. Scoot app/email card: "SIN CGK" / "18:15 > 19:15" / "Wed, 1 Jul Wed, 1 Jul"
function _layoutScootCard(txt){
  const re=/\b([A-Z]{3})\s+([A-Z]{3})[ \t]*\n[^\n]*?(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)[^\n]*?(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/g;
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    if(!_isAp(m[1])||!_isAp(m[2]))continue;
    const after=txt.substring(m.index+m[0].length,m.index+m[0].length+300);
    const leg={fromCode:m[1],toCode:m[2],departureTime:_hhmm(m[3]),arrivalTime:_hhmm(m[4])};
    const ds=_findDates(after);if(ds[0])leg.date=ds[0].date;if(ds[1])leg.arrivalDate=ds[1].date;
    const dur=after.match(/Duration\s*(\d{1,2})\s*h\s*(\d{1,2}|O)\s*m/i);if(dur)leg.duration=dur[1]+'h '+dur[2].replace('O','0').padStart(2,'0')+'m';
    legs.push(_finishLeg(leg,_fnNear(after)));
  }
  return legs;
}
// D. Time-then-code (Malaysia Airlines, Firefly, AirAsia): "14:35 KUL (T1) Non-Stop 2h 55min 17:30 TWU"
function _layoutTimeCode(txt){
  const re=/(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\s*=?\s*([A-Z]{3})\b([\s\S]{0,220}?)(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\s*=?\s*([A-Z]{3})\b/g;
  const hits=[];let m;
  while((m=re.exec(txt))!==null)if(_isAp(m[2])&&_isAp(m[5])&&m[2]!==m[5])hits.push({m,pos:m.index,end:m.index+m[0].length});
  const legs=[];
  hits.forEach((h,i)=>{
    const prevEnd=i?hits[i-1].end:0,nextPos=i+1<hits.length?hits[i+1].pos:txt.length;
    const before=txt.substring(Math.max(prevEnd,h.pos-450),h.pos),after=txt.substring(h.end,Math.min(nextPos,h.end+300));
    const leg={fromCode:h.m[2],toCode:h.m[5],departureTime:_hhmm(h.m[1]),arrivalTime:_hhmm(h.m[4])};
    let fn=_fnNear(h.m[3]);
    if(!fn){const all=[...before.matchAll(new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g'))];if(all.length){const l=all[all.length-1];fn={code:l[1],num:l[2]};}}
    if(!fn)fn=_fnNear(after.substring(0,120));
    // Date: nearest one before the times (skipping booking/issue dates), else the first after
    const cleanBefore=before.replace(/(?:Booking|Issue|Issued|Purchase)\s*date\s*:?[^\n]{0,30}/gi,m2=>' '.repeat(m2.length));
    const db=_findDates(cleanBefore),da=_findDates(after);
    if(db.length)leg.date=db[db.length-1].date;else if(da.length)leg.date=da[0].date;
    const dur=h.m[3].match(/(\d{1,2})\s*h\s*(\d{1,2})\s*m/i);if(dur)leg.duration=dur[1]+'h '+dur[2].padStart(2,'0')+'m';
    legs.push(_finishLeg(leg,fn));
  });
  return legs;
}
// E. GDS e-ticket table (Garuda and most full-service e-tickets): "GA0426 Y 08Jul 18:30 21:30"
function _layoutGdsTable(txt){
  const re=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\s+[A-Z]\\s+(\\d{1,2})\\s?('+_MON+')(?:\\s?(\\d{2,4}))?\\s+(\\d{1,2}:\\d{2}(?:\\s*[AaPp]\\.?[Mm]\\b\\.?)?)\\s+(\\d{1,2}:\\d{2}(?:\\s*[AaPp]\\.?[Mm]\\b\\.?)?)','gi');
  const legs=[];let m,prevEnd=0;
  while((m=re.exec(txt))!==null){
    const before=txt.substring(Math.max(prevEnd,m.index-300),m.index);prevEnd=m.index+m[0].length;
    let codes=_aliasCodesInOrder(before);
    // Airport names not in the alias list: "SORONG DOMINE EDUARD OSOK" starts with the city
    if(codes.length<2)codes=_placeCodesInOrder(before);
    if(codes.length<2)codes=[...before.matchAll(/\b([A-Z]{3})\b/g)].map(x=>x[1]).filter(_isAp);
    const leg={fromCode:codes[codes.length-2]||'',toCode:codes[codes.length-1]||'',departureTime:_hhmm(m[6]),arrivalTime:_hhmm(m[7])};
    const ds=_findDates(m[3]+' '+m[4]+(m[5]?' '+m[5]:''));if(ds[0])leg.date=ds[0].date;
    legs.push(_finishLeg(leg,{code:m[1].toUpperCase(),num:m[2]}));
  }
  return legs;
}
// F. "City (CODE)" layouts (Emirates, Qatar Airways, most OTAs): flight number, then two bracketed airports
function _layoutBracketCodes(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[],seen=new Set();
  fns.forEach((f,i)=>{
    const nextPos=i+1<fns.length?fns[i+1].pos:txt.length;
    const win=txt.substring(f.end,Math.min(nextPos,f.end+400));
    // Unknown codes still count when a place name precedes them: "DILI, TIMOR LESTE (DIL)"
    const aps=[...win.matchAll(/\(([A-Z]{3})\)/g)].filter(x=>{
      if(_isAp(x[1]))return true;
      const nm=win.substring(Math.max(0,x.index-60),x.index).split(/\s{2,}|\n/).pop().trim();
      const city=nm.split(',')[0].trim();
      if(!/^[A-Za-z][A-Za-z .'-]{2,30}$/.test(city))return false;
      AIRPORTS[x[1]]=city.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());// learn it for this session
      return true;
    });
    if(aps.length<2||aps[0][1]===aps[1][1])return;
    const key=f.code+f.num;if(seen.has(key))return;seen.add(key);
    const a1=aps[0].index,a2=aps[1].index;
    const leg={fromCode:aps[0][1],toCode:aps[1][1]};
    const depL=win.match(/Depart\w*\b[^\n]*/i),arrL=win.match(/Arriv\w*\b[^\n]*/i);
    let depZone,arrZone;
    if(depL&&arrL&&/\d{1,2}:\d{2}/.test(depL[0])&&/\d{1,2}:\d{2}/.test(arrL[0])){depZone=depL[0];arrZone=arrL[0];}
    else{
      const lineOf=pos=>{const st=win.lastIndexOf('\n',pos)+1,en=win.indexOf('\n',pos);return[st,en<0?win.length:en];};
      const[l1s,l1e]=lineOf(a1),[l2s]=lineOf(a2);
      if(l1s!==l2s){depZone=win.substring(0,l1e);arrZone=win.substring(l2s);}// one airport per line
      else{depZone=win.substring(0,a2);arrZone=win.substring(a2);}// both on one line: info follows each airport
      if(!/\d{1,2}:\d{2}/.test(win.substring(a1,a2))&&l1s===l2s){depZone=win.substring(a2);arrZone=win.substring(a2).replace(/^[\s\S]*?\d{1,2}:\d{2}/,'');}
    }
    const t1=depZone.match(/(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/),t2=arrZone.match(/(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/);
    leg.departureTime=t1?_hhmm(t1[1]):'';leg.arrivalTime=t2?_hhmm(t2[1]):'';
    const d1=_findDates(depZone),d2=_findDates(arrZone);
    if(d1.length)leg.date=d1[0].date;if(d2.length)leg.arrivalDate=d2[0].date;
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// H. Endpoint cards (Agoda/Trip.com e-tickets): "SQ 948 … SIN 09:30PM Fri, Feb 12, 2027 … DPS 12:25AM Sat, Feb 13, 2027"
function _layoutEndpoints(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[];
  fns.forEach((f,i)=>{
    const win=txt.substring(f.end,Math.min(i+1<fns.length?fns[i+1].pos:txt.length,f.end+500));
    const eps=[...win.matchAll(/\b([A-Z]{3})\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/g)].filter(x=>_isAp(x[1]));
    if(eps.length<2||eps[0][1]===eps[1][1])return;
    const leg={fromCode:eps[0][1],toCode:eps[1][1],departureTime:_hhmm(eps[0][2]),arrivalTime:_hhmm(eps[1][2])};
    const d1=_findDates(win.substring(eps[0].index,eps[1].index)),d2=_findDates(win.substring(eps[1].index,eps[1].index+90));
    if(d1[0])leg.date=d1[0].date;if(d2[0])leg.arrivalDate=d2[0].date;
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// I. "Travel Reservation" layouts (Sabre-style, many airlines/agents): "DEPARTURE: FRIDAY 20 NOV … OD 0372 … KUL … DIL …
//    Departing At: 02:15 … Arriving At: 07:30"
function _layoutLabelledTimes(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[];
  fns.forEach((f,i)=>{
    const win=txt.substring(f.end,Math.min(i+1<fns.length?fns[i+1].pos:txt.length,f.end+700));
    const dep=win.match(/Depart\w*\s*(?:At|Time)?\s*[:：]?\s*(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/i),arr=win.match(/Arriv\w*\s*(?:At|Time)?\s*[:：]?\s*(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/i);
    if(!dep||!arr)return;
    const codes=[...win.substring(0,dep.index).matchAll(/\b([A-Z]{3})\b/g)].map(x=>x[1]).filter(_isAp).filter((c,k,a)=>!k||c!==a[k-1]);
    if(codes.length<2)return;
    const leg={fromCode:codes[0],toCode:codes[1],departureTime:_hhmm(dep[1]),arrivalTime:_hhmm(arr[1])};
    const prevEnd=i?fns[i-1].end:0;
    const db=_findDates(txt.substring(Math.max(prevEnd,f.pos-200),f.pos)),dw=_findDates(win.substring(0,dep.index+dep[0].length+60));
    if(dw.length)leg.date=dw[0].date;else if(db.length)leg.date=db[db.length-1].date;
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// G. OTA receipts with airport names (Agoda…): "EQEO68 SQ 948 Singapore Changi Airport - Ngurah Rai International Airport Fri, Feb 12, 2027"
function _layoutAirportNames(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[];
  fns.forEach((f,i)=>{
    const win=txt.substring(f.end,Math.min(i+1<fns.length?fns[i+1].pos:txt.length,f.end+300));
    const dash=win.search(/\s[-–—]\s/);if(dash<0)return;
    const ds=_findDates(win);const d=ds.find(x=>x.pos>dash);
    const left=win.substring(0,dash),right=win.substring(dash+3,d?d.pos:Math.min(win.length,dash+90));
    const leg={fromCode:_cityCode(left),toCode:_cityCode(right)};
    if(!leg.fromCode||!leg.toCode||leg.fromCode===leg.toCode)return;
    if(d)leg.date=d.date;
    const ts=[...win.matchAll(/\b(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\b/g)];if(ts[0])leg.departureTime=_hhmm(ts[0][1]);if(ts[1])leg.arrivalTime=_hhmm(ts[1][1]);
    // Airline booking reference printed just before the flight number
    const ref=txt.substring(Math.max(0,f.pos-30),f.pos).match(/\b([A-Z0-9]{6})\s*$/);
    if(ref&&/[A-Z]/.test(ref[1])&&/^[A-Z0-9]+$/.test(ref[1]))leg.pnr=ref[1];
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// J. Route list without times (Trip.com receipts): "Singapore - Kuala Lumpur  Malaysia Airlines MH614  August 5, 2026"
function _layoutRouteList(txt){
  const re=new RegExp("([A-Z][A-Za-z .']{1,30}?)\\s+[-–]\\s+([A-Z][A-Za-z .' ]{1,60}?)\\s+("+_FNCODES+")\\s?(\\d{1,4})\\s+((?:"+_MON+")\\.?\\s+\\d{1,2},?\\s+\\d{4}|\\d{1,2}\\s+(?:"+_MON+")\\.?\\s+\\d{4})",'g');
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    // "Kuala Lumpur  Malaysia Airlines": the destination is the longest leading run of words that names a city
    const w=m[2].trim().split(/\s+/);let toCode='';
    for(let k=Math.min(3,w.length);k>=1&&!toCode;k--)toCode=_cityCode(w.slice(0,k).join(' '));
    const leg={fromCode:_cityCode(m[1]),toCode};
    if(!leg.fromCode||!leg.toCode||leg.fromCode===leg.toCode)continue;
    const ds=_findDates(m[5]);if(ds[0])leg.date=ds[0].date;
    legs.push(_finishLeg(leg,{code:m[3],num:m[4]}));
  }
  return legs;
}
// K. Flight number, then date and times in a table row (t'way, Air Seoul, Air India…):
//    "TW171 A330-300 2022-12-31(Sat) 19:35 01:00 +1 06h25m", "RS922 22Dec22 (Thu) 10:05 11:15", "AI2106 10:30 05Nov2025 14:05 05Nov2025"
function _layoutFnDateTimes(txt){
  const D="(?:20\\d{2}-\\d{2}-\\d{2}|\\d{1,2}\\s?(?:"+_MON+")\\s?(?:\\d{4}|\\d{2})?)(?:\\s*\\([A-Za-z]{2,3}\\))?",T="\\d{1,2}:\\d{2}";
  const re=new RegExp("\\b("+_FNCODES+")\\s?(\\d{1,4})\\s+(?:[A-Z0-9-]{3,10}\\s+)?(?:("+D+")\\s+("+T+")\\s+("+T+")|("+T+")\\s+("+D+")\\s+("+T+")(?:\\s+("+D+"))?)",'g');
  const legs=[];let m,prevEnd=0;
  while((m=re.exec(txt))!==null){
    const before=txt.substring(Math.max(prevEnd,m.index-300),m.index).replace(/\(([A-Z])\s*([A-Z])\s*([A-Z])\)/g,' $1$2$3 ');// "(G  MP)" → GMP
    prevEnd=m.index+m[0].length;
    let codes=[...before.matchAll(/\b([A-Z]{3})\b/g)].map(x=>x[1]).filter(_isAp).filter((c,k,a)=>!k||c!==a[k-1]);
    if(codes.length<2)codes=_placeCodesInOrder(before);
    if(codes.length<2)continue;
    const leg={fromCode:codes[codes.length-2],toCode:codes[codes.length-1]};
    if(m[3]){leg.departureTime=m[4];leg.arrivalTime=m[5];const d=_findDates(m[3]);if(d[0])leg.date=d[0].date;}
    else{leg.departureTime=m[6];leg.arrivalTime=m[8];const d=_findDates(m[7]),a=m[9]?_findDates(m[9]):[];if(d[0])leg.date=d[0].date;if(a[0])leg.arrivalDate=a[0].date;}
    legs.push(_finishLeg(leg,{code:m[1],num:m[2]}));
  }
  return legs;
}
// L. This app's own itinerary PDF ("Generated by Holiday Tracker"): "Day 1 — Wednesday, 1 July 2026 … FLIGHT Scoot TR278
//    Route: Singapore to Jakarta Depart: 6:15 pm Arrive: 7:15 pm PNR: MGH6MH Cost: SGD 175.2"
function _layoutTrackerExport(txt){
  if(!/Generated by Holiday Tracker/.test(txt))return [];
  // Older exports drew "→" as "!’" and letter-spaced the route: "S i n g a p o r e  !’    J a k a r t a"
  const unspace=x=>x.replace(/!’|!'/g,' to ').split(/\s{2,}/).map(w=>/^(?:\S )+\S$/.test(w.trim())?w.trim().replace(/ /g,''):w).join(' ').replace(/\s+/g,' ').trim();
  const days=[...txt.matchAll(/Day\s+\d+\s+—\s+\w+,\s+(\d{1,2}\s+\w+\s+\d{4})/g)].map(x=>({pos:x.index,date:(_findDates(x[1])[0]||{}).date}));
  const re=/FLIGHT\s+(.{0,40}?)\b([A-Z0-9]{2})\s?(\d{1,4})\s+Route:\s+([\s\S]{1,120}?)\s+Depart:\s+([\d:]+\s*[ap]m)?\s*(?:Arrive:\s+([\d:]+\s*[ap]m))?([\s\S]*?)(?=FLIGHT\s|ACTIVITY\s|HOTEL\s|TRANSPORT\s|Day\s+\d+\s+—|Cost Summary|$)/g;
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    const route=unspace(m[4]).split(/\s+to\s+|\s*→\s*/);if(route.length<2)continue;
    const leg={from:route[0].trim(),to:route[1].trim(),departureTime:m[5]?_hhmm(m[5]):'',arrivalTime:m[6]?_hhmm(m[6]):''};
    leg.fromCode=_cityCode(leg.from)||leg.from;leg.toCode=_cityCode(leg.to)||leg.to;

function parseFlightSegments(txt){

      const positions=fnMatches.map(f=>{

function dedupeLines(txt){
  // Times like "10 ∶ 20" (ratio sign) in some OTA PDFs
  txt=txt.replace(/\u0000/g,'').replace(/(\d{1,2})\s*[∶꞉]\s*(\d{2})/g,'$1:$2');
  // Some PDF extractors (e.g. Malaysia Airlines) repeat each phrase 3-4x on one line: "14:35 14:35 14:35 14:35"
  txt=txt.replace(/(\S(?:[^\n]{0,80}?\S)?)(?:[ \t]+\1){2,}(?=\s|$)/g,'$1');
  // …or repeat each line 2-4x
  const lines=txt.split('\n');const out=[];
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(!l){out.push('');continue;}
    // Skip if same as previous non-empty line
    if(out.length&&out[out.length-1].trim()===l)continue;
    out.push(lines[i]);
  }
  return out.join('\n');
}

// Booking total + currency (sets r.cost / r.currency)
function _extractCost(txt,r){
  const costPats=[
    /Grand\s*total\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW|INR|JPY|HKD)\s*([\d,]+\.?\d*)/i,
    /Total\s*\([^)]{1,25}\)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW|INR|JPY|HKD)\s*([\d,]+\.?\d*)/i,
    // "Grand total: IDR 2,320,000"
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?|TOTAL)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW)\s*([\d,]+\.?\d*)/i,
    // "Total S$ 79.10" or "Total Rp 3,106,856"
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?|TOTAL)\s*[:#]?\s*(?:Rp\.?|RM|S\$|A\$|₱|¥|฿|€|£|\$)\s*([\d,]+\.?\d*)/i,
    // "SGD235.20" (no space)
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?|TOTAL)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY)([\d,]+\.?\d*)/i,
    // "Total 3,106,856" (amount only)
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?)\s*[:#]?\s*[\$]?\s*([\d,]+\.?\d{0,2})\b/i,
  ];
  for(const pat of costPats){const m=txt.match(pat);if(m){
    if(m[2]){
      if(/^[A-Z]{3}$/.test(m[1])){r.currency=m[1].toUpperCase();r.cost=m[2].replace(/,/g,'');}
      else{r.cost=m[1].replace(/,/g,'');if(/^[A-Z]{3}$/.test(m[2]))r.currency=m[2].toUpperCase();}
    }else{r.cost=m[1].replace(/,/g,'');}
    break;
  }}
  // Detect currency from context near total
  if(r.cost&&!r.currency){
    const totalCtx=txt.match(/(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?)\s*[:#]?\s*(.{0,30})/i);
    if(totalCtx){const ctx=totalCtx[1].toLowerCase();
      for(const[sym,iso]of Object.entries(CURRENCY_SYMBOLS).sort((a,b)=>b[0].length-a[0].length)){if(ctx.includes(sym)){r.currency=iso;break;}}}
  }
  // Fallback: any "MYR 95.04" or "IDR 2,320,000" pattern
  if(!r.cost){const cm=txt.match(/(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD)\s*([\d,]+\.?\d*)/i);if(cm){r.currency=cm[1].toUpperCase();r.cost=cm[2].replace(/,/g,'');}}
  if(!r.cost){const symCost=txt.match(/\b(Rp\.?|RM|S\$|A\$)\s*([\d,]+\.?\d*)/i);
    if(symCost){r.cost=symCost[2].replace(/,/g,'');const sym=symCost[1].toLowerCase().replace(/\.$/,'');r.currency=CURRENCY_SYMBOLS[sym]||'SGD';}}
}

function parseBookingText(rawTxt){
  const txt=dedupeLines(rawTxt);

  // ===== 0. Known airline layouts first, then generic multi-segment parsing =====

    /\b(HOTEL|RESORT|HOSTEL|VILLA|INN|GUESTHOUSE|BUNGALOW|HOMESTAY|LODGE|APARTMENT|ACCOMMODATION)\b/i.test(txt)||
    (/\bcheck.?in\b/i.test(txt)&&/\bcheck.?out\b/i.test(txt)&&/\b\d+\s*nights?\b/i.test(txt))||
    /\byour\s+booking\s+in\b/i.test(txt)||/\bexpecting\s+you\b/i.test(txt)||

  const txtNoRefs=txt.replace(/(?:[Bb]ooking|BOOKING|[Oo]rder|ORDER|[Rr]eference|REFERENCE|[Rr]ef\.?|[Cc]onfirmation|CONFIRMATION|[Vv]oucher|PNR)(?:[ \t]+(?:[Rr]eference|REFERENCE|[Rr]ef\.?|[Nn]o\.?|NO\.?|[Nn]umber|NUMBER|ID|[Cc]ode|CODE|#))?[ \t]*[:：#]?[ \t]*[A-Z0-9-]{4,20}\b/g,' ');

  // Product title on OTA receipts (Trip.com/Klook: "Activity  <title>  Departure time…")

  if(r.type==='transport'){
    const tt=(title||txt);

    .replace(/cancellation\s*(?:policy|cost|fee|deadline)[\s\S]*?(?=\n\s*\n|\bYour\s*reservation\b|\bGuest\s*name\b|\bPrice\s*detail|\bTotal\s*price|$)/gi,'')

      // "Firefly FY3122" or "Singapore Airlines . SQ947"

    ];
    for(const pat of fnPats){const m=txt.match(pat);if(m){
      if(m[2]){r.flightNumber=(m[1]+m[2]).replace(/\s/g,'');if(AIRLINE_MAP[m[1]])r.airline=AIRLINE_MAP[m[1]];}
      else{r.flightNumber=m[1].replace(/\s/g,'');const code=m[1].replace(/\s/g,'').replace(/\d+/,'');if(AIRLINE_MAP[code])r.airline=AIRLINE_MAP[code];}

    }}

    // Also check "Operated by" and "AirAsia , AK" style

      if(opM){const nm=opM[1].trim();const opAl=_matchAirlineName(nm);if(opAl)r.airline=opAl;}}
  }

  // ===== 6. Airport codes & route =====
  const foundAirports=r.type==='flight'?findAirports(txt):[];// codes like KTM/ETS on train tickets aren't airports
  const distinctAps=[];
  for(const a of foundAirports){if(!distinctAps.length||distinctAps[distinctAps.length-1].code!==a.code)distinctAps.push(a);}
  if(distinctAps.length>=1){r.from=distinctAps[0].city;r.fromCode=distinctAps[0].code;}
  if(distinctAps.length>=2){r.to=distinctAps[1].city;r.toCode=distinctAps[1].code;}
  // Also try "From X to Y" pattern
  if(r.type!=='hotel'&&(!r.from||!r.to)){const routeM=txt.match(/\bFrom[ \t]+([A-Z][a-z]+(?:[ \t][A-Z][a-z]+)*)[ \t]+to[ \t]+([A-Z][a-z]+(?:[ \t][A-Z][a-z]+)*)\b/);
    if(routeM){if(!r.from)r.from=routeM[1];if(!r.to)r.to=routeM[2];}}
  // Also try "City → City" or "City to City" from route headers
  if(r.type!=='hotel'&&(!r.from||!r.to)){const arrowM=txt.match(/([A-Z][a-z]+(?:[ \t][A-Z][a-z]+)*)[ \t]*(?:→|->|\bto\b)[ \t]*([A-Z][a-z]+(?:[ \t][A-Z][a-z]+)*)/);

  const locSet=new Set(distinctAps.map(a=>a.city));
  CITIES.forEach(c=>{
    if(t.includes(c.toUpperCase())){locSet.add(c);return;}
    const city=c.split(',')[0].trim();// "Nusa Lembongan" — only distinctive names, to avoid words like "Male"
    if(city!==c&&(city.includes(' ')||city.length>=7)&&new RegExp('\\b'+city.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(t))locSet.add(city);
  });
  // Extract location from "Your booking in [Location]"
  const bookingLocM=txt.match(/your\s+booking\s+in\s+([A-Z][A-Za-z\s]{2,30})\s+is/i);
  if(bookingLocM)locSet.add(bookingLocM[1].trim());
  // Extract from address lines (e.g. "80771 Nusa Lembongan, Indonesia")
  const addrM=txt.match(/\d{4,5}\s+([A-Z][A-Za-z\s]{2,30}),\s*(?:Indonesia|Thailand|Malaysia|Philippines|Vietnam|Cambodia|Myanmar|Laos|Sri Lanka|Maldives|Japan|South Korea|China|Taiwan|India|Nepal|Australia|New Zealand)/i);

  if(r.from)locSet.add(r.from);if(r.to)locSet.add(r.to);

  // Hotel address: the first known town in it is the most specific location ("…, Sanur, Denpasar, Bali")
  let addrLine=txt.match(/\b(?:Ad{1,2}re?s{1,2}|Addr\.?|Alamat)\s*[:：.]\s*([^\n]+(?:\n[^\n:]+)?)/i);

  if(addrLine){
    const A=addrLine[1].toUpperCase();let best=null;
    for(const c of CITIES){const city=c.split(',')[0].trim();const m=new RegExp('\\b'+city.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').exec(A);if(m&&(!best||m.index<best.pos))best={city,pos:m.index};}

  // ===== 7. Seat (flights only) =====
  if(r.type==='flight'){const seat=txt.match(/(?:Seat|SEAT)\s*[:#]?\s*(\d{1,3}[A-HJ-K])/i);if(seat)r.seat=seat[1];}

  // ===== 8. Dates =====
  const dateSrc=r.type==='hotel'?txtClean:txt.replace(/Booking\s*date\s*[:]\s*[\w\s,]+\d{4}/gi,'').replace(/Date\s*of\s*Issue\s*[:]\s*[\w\s]+\d{4}/gi,'');

      while((m2=dp2.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){

      // "Mon, May 25" format

      while((m2=dp2b.exec(dateSrc))!==null){const mm=MMAP[m2[1].toLowerCase().slice(0,3)];if(mm){
        let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m2[2]));if(td2<new Date(Date.now()-90*864e5))yr++;

      while((m2=dp3.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){
        let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m2[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
        const ds=`${yr}-${mm}-${m2[1].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}

    while((m2=dp4.exec(dateSrc))!==null){const ds=m2[0];if(!foundDates.includes(ds))foundDates.push(ds);}
    // "10 AUG , 2026" format (with comma between month and year)

    while((m2=dp5.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){const ds=`${m2[3]}-${mm}-${m2[1].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}
    const uniqueDates=[...new Set(foundDates)].sort();

    if(uniqueDates.length>=2&&!r.dateTo)r.dateTo=uniqueDates[uniqueDates.length-1];

  // ===== 9. Times (flights only) =====

    const arrTimeM=txt.match(/(?:Arriv(?:al|ing)\s*(?:At|Time)?\s*[:#]?\s*|ARRIVING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    if(depTimeM)r.departureTime=depTimeM[1].trim();

  // ===== 11. Hotel extras: room type, nights =====

    if(!r.roomType){const lt=txt.match(/(?:^|\n|\s{2,})Room\s*[Tt]ype\s*[:：]?\s+([A-Z][^\n]{2,60}?)(?:\s{2,}|\n|$)/);if(lt)r.roomType=lt[1].trim();}
    if(!r.roomType){const rt=txt.match(/\b((?:Deluxe|Superior|Standard|Classic|Premier|Executive|Family|Double|Twin|Single|Triple|Quad|King|Queen|Budget|Economy|Garden|Pool|Ocean|Sea)(?:[ \t]+[A-Z][a-z]+){0,3}[ \t]+(?:Room|Suite|Villa|Bungalow|Studio|Cabin|Dorm))\b/);if(rt)r.roomType=rt[1];}
    if(!r.nights&&r.date&&r.dateTo)r.nights=Math.round((new Date(r.dateTo)-new Date(r.date))/864e5);
  }

  // ===== 12. Flight duration =====
  if(r.type==='flight'){const durM=txt.match(/(?:Duration|Non-stop)\s*[,:.]?\s*(\d+)\s*h(?:rs?|ours?)?\s*(\d+)\s*m(?:in)?/i);
    if(durM)r.duration=durM[1]+'h '+durM[2]+'m';}

  // ===== 13. Build display name =====
  if(r.type==='flight')r.name=r.airline?`${r.airline} ${r.flightNumber||'Flight'}`+(r.from&&r.to?` (${r.from} → ${r.to})`:''):(r.from&&r.to?`${r.from} → ${r.to}`:'Flight');
  else if(r.type==='hotel')r.name=r.hotelName||(r.locations.length?r.locations[0]+' Hotel':'Hotel Booking');
  else if(r.type==='transport')r.name=r.provider||r.title||r.locations.join(' → ')||'Uploaded Booking';
  else r.name=r.title||r.locations.join(' → ')||'Uploaded Booking';
  return r;
}

document.addEventListener('dragstart',e=>{

});
document.addEventListener('dragend',()=>{document.body.classList.remove('apple-dragging');document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'));});
document.addEventListener('dragover',e=>{
  const t=e.target.closest&&e.target.closest('[data-drop-ev]');
  if(!t||!e.dataTransfer.types.includes('text/x-apple-ev'))return;
  e.preventDefault();e.dataTransfer.dropEffect='move';

        const fi=document.getElementById(fid);

          if(!file)return;
          const reader=new FileReader();
          reader.onload=()=>{
            const img=new Image();
            img.onload=()=>{
              const canvas=document.createElement('canvas');
              const maxW=300,maxH=300;
              let w=img.width,h=img.height;
              if(w>maxW){h=h*(maxW/w);w=maxW;}
              if(h>maxH){w=w*(maxH/h);h=maxH;}
              canvas.width=w;canvas.height=h;
              const ctx=canvas.getContext('2d');
              ctx.drawImage(img,0,0,w,h);
              fi._pendingThumb=canvas.toDataURL('image/jpeg',0.6);
              toast('Image ready');
            };
            img.src=reader.result;
          };
          reader.readAsDataURL(file);
        });
      },100);
      }break;}

});

document.addEventListener('change',e=>{
  if(e.target.matches('[data-action="entry-sort-key"]')){sortKey=e.target.value;render();}
  if(e.target.matches('[data-action="event-sort-key"]')){eventSortKey=e.target.value;render();}
  if(e.target.matches('[data-action="tp-change"]')){S._tp=e.target.value;saveS();render();}
  if(e.target.matches('[data-action="tp-from"]')){S._tpFrom=e.target.value;saveS();render();}
  if(e.target.matches('[data-action="tp-to"]')){S._tpTo=e.target.value;saveS();render();}
});

document.addEventListener('change',e=>{if(e.target.id==='imp-f'&&e.target.files.length){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.events||d.trips){if(d.trips&&!d.events){d.events=d.trips.map(t=>({...t,category:'trip',requiresLeave:true}));delete d.trips;}S=d;saveS();render();toast('Imported');}}catch(e2){toast('Error');}};r.readAsText(e.target.files[0]);}});
// Search input handler
document.addEventListener('input',e=>{
  if(e.target.matches('[data-action="search-events"]')){S._searchQ=e.target.value;render();
    // Re-focus after render
    setTimeout(()=>{const inp=document.querySelector('[data-action="search-events"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
  if(e.target.matches('[data-action="dash-search"]')){S._dashSearch=e.target.value;render();
    setTimeout(()=>{const inp=document.querySelector('[data-action="dash-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
  if(e.target.matches('[data-action="country-search"]')){S._countrySearch=e.target.value;render();
    setTimeout(()=>{const inp=document.querySelector('[data-action="country-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
});

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){xm();closeMobileMenu();}
  // Don't trigger shortcuts when typing in inputs
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='1')nav('dashboard');
  else if(e.key==='2')nav('events');
  else if(e.key==='3')nav('calendar');
  else if(e.key==='4')nav('leave');
  else if(e.key==='5')nav('budget');
  else if(e.key==='6')nav('settings');
  else if(e.key==='n'&&!e.ctrlKey&&!e.metaKey)fEvent();
  else if(e.key==='u'&&!e.ctrlKey&&!e.metaKey)showSmartUpload();
  else if(e.key==='/'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const si=document.querySelector('[data-action="search-events"]');if(si)si.focus();else nav('events');}
});

// Hamburger
document.getElementById('hamburger').onclick=toggleMobileMenu;
document.getElementById('sidebar-overlay').onclick=closeMobileMenu;
// Close mobile menu when navigating
const origNav=nav;
nav=function(v,x){closeMobileMenu();origNav(v,x);};

// FAB
document.getElementById('fab').onclick=()=>showSmartUpload();

// Tesseract lazy load
(function(){if(typeof Tesseract==='undefined'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.head.appendChild(s);}})();

// Build datalists for airline and location autocomplete
(function(){
  const alDl=document.createElement('datalist');alDl.id='airline-list';
  AIRLINE_NAMES.forEach(a=>{const o=document.createElement('option');o.value=a;alDl.appendChild(o);});
  document.body.appendChild(alDl);
  const locDl=document.createElement('datalist');locDl.id='location-list';
  const locSet=new Set();
  Object.entries(AIRPORTS).forEach(([code,city])=>{locSet.add(city);locSet.add(city+' ('+code+')');});
  CITIES.forEach(c=>locSet.add(c));
  [...locSet].sort().forEach(l=>{const o=document.createElement('option');o.value=l;locDl.appendChild(o);});
  document.body.appendChild(locDl);
})();

// Init
try{render();
  // Auto-sync on load
  const _initConf=getSyncConfig();
  if(acctEnabled()){acctInit().then(()=>{if(!_acct&&cloudMode()==='gist')fullSync();});}
  else if(_initConf.token){setTimeout(()=>fullSync(),800);}
  else if(_initConf.gistId){
    // Arrived via link — pull data anonymously (read-only, no token needed)
    setTimeout(()=>pullGistAnon(_initConf.gistId),500);
  }
}catch(e){console.error('Render error:',e);document.getElementById('app').innerHTML='<div style="padding:40px;color:#ff6b6b"><h2>Error loading app</h2><pre style="margin-top:12px;font-size:12px;white-space:pre-wrap;color:#e8e9ed">'+e.message+'\n\n'+e.stack+'</pre><button onclick="localStorage.removeItem(\'htV4\');localStorage.removeItem(\'htV3\');location.reload()" style="margin-top:16px;padding:8px 16px;background:#6c8cff;color:#fff;border:none;border-radius:8px;cursor:pointer">Reset &amp; Reload</button></div>';}

// Near-realtime sync: poll + visibility
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const vc=getSyncConfig();
    if(cloudMode())cloudFullSync();
    else if(vc.gistId&&!acctEnabled())pullGistAnon(vc.gistId);
  }
});
window.addEventListener('focus',()=>{
  const fc=getSyncConfig();
  if(cloudMode())cloudPull().then(pulled=>{if(pulled){render();toast('Synced from cloud');}});
  else if(fc.gistId&&!acctEnabled())pullGistAnon(fc.gistId);
});
window.addEventListener('beforeunload',()=>{
  if(_syncTimer){clearTimeout(_syncTimer);cloudPush();}
});
startSyncPolling();
setInterval(()=>{try{renderSidebar();}catch(e){}},60000);

// Offline detection
const _ob=document.createElement('div');_ob.className='offline-banner';_ob.textContent='You are offline — changes will sync when reconnected';document.body.appendChild(_ob);
window.addEventListener('online',()=>{_ob.classList.remove('show');if(cloudMode())cloudPush();});
window.addEventListener('offline',()=>_ob.classList.add('show'));
if(!navigator.onLine)_ob.classList.add('show');
</script>
</body>
</html>
