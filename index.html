// ===== LEAVE RULES (how a company works it out) =====
// Entitlement: the yearly days, prorated by the part of the year you're employed (to the nearest half day);
// with monthly credit only the months completed so far are available now.
// Carry forward: what's left of annual leave at year end moves to the next year at the same employer, up to a cap,
// and can expire on a set date (carried days are used first). Days in lieu and volunteer leave are their own
// allowances and don't carry over; using more than you have comes out of annual leave.
const LEAVE_EXPIRY=[['','Never'],['03-31','31 Mar'],['06-30','30 Jun'],['09-30','30 Sep'],['12-31','End of the year']];
const LEAVE_TYPES=[['annual','Annual leave'],['lieu','Day off in lieu'],['volunteer','Volunteer leave'],['other','Sick / other (not deducted)']];

function lieuSuggestions(y){
  const l=leaveData(y),p=P(),cc=p.workHolidays;if(!l||!cc)return[];
  const reg=p.region||'',mine=h=>h.s==='all'||(reg&&(Array.isArray(h.s)?h.s.includes(reg):h.s===reg));

  holidaysFor(cc,y).filter(mine).forEach(h=>{
    if(have.has(h.d)||skip.has(h.d))return;
    if(/observed/i.test(h.n))return;
    // Singapore: a Sunday holiday always moves to Monday by law
    if(cc==='SG'&&new Date(h.d+'T00:00:00').getDay()===0)return;
    if(!isWeekendDow(new Date(h.d+'T00:00:00').getDay()))return;

    let c=new Date(h.d+'T00:00:00');do c.setDate(c.getDate()+1);while(isWeekendDow(c.getDay()));
    if(isWorkPH(ymd(c)))return;
    if(!l.jobs.some(j=>h.d>=jobStart(j,y)&&h.d<=jobEnd(j,y)))return;
    res.push(h);
  });
  return res;
}

function leaveTripsUnbooked(y){

    if(t.requiresLeave===false||!t.startDate||!t.endDate)return;

// The best stretches off for a few days of leave: bridges between your weekend and the holidays that are days off at work.
function longWeekends(y,maxLeave){
  const td=ymd(new Date()),start=String(y)>td.slice(0,4)?`${y}-01-01`:td,end=`${y}-12-31`;
  if(start>end)return[];
  const days=[];for(let c=new Date(start+'T00:00:00');ymd(c)<=end;c.setDate(c.getDate()+1))days.push(ymd(c));
  const off=days.map(d=>!isWorkday(d)),hol=days.map(d=>!isWeekendDow(new Date(d+'T00:00:00').getDay())&&isWorkPH(d));
  // Days already taken: trips, work trips and training you've planned, and leave you've applied for
  const busy=new Set();(S.events||[]).forEach(t=>{if(t.source==='apple'||!t.startDate||!t.endDate||!(['trip','work','training'].includes(t.category||'trip')||t.requiresLeave===true))return;for(let c=new Date(t.startDate+'T00:00:00');ymd(c)<=t.endDate;c.setDate(c.getDate()+1))busy.add(ymd(c));});
  days.forEach(d=>{if(getAppliedForDate(d))busy.add(d);});
  const cands=[];
  // Every stretch of days off plus leave days that starts after a workday and ends before one
  for(let a=0;a<days.length;a++){
    if(a>0&&off[a-1])continue;
    let w=0;const take=[];
    for(let b=a;b<days.length&&b-a<16;b++){
      if(!off[b]){w++;take.push(days[b]);if(w>maxLeave)break;}
      if(b+1<days.length&&off[b+1])continue;// a following day off belongs in the stretch
      if(!w)continue;
      const span=days.slice(a,b+1),L=span.length;
      if(!hol.slice(a,b+1).some(Boolean)||L<w+3)continue;// must use a holiday and beat a normal weekend
      if(span.some(d=>busy.has(d)))continue;
      cands.push({from:days[a],to:days[b],len:L,leave:w,take:[...take],hols:[...new Set(span.filter((d,i)=>hol[a+i]).flatMap(d=>getPH(d).filter(h=>h.country===P().workHolidays||h.country==='MINE').map(h=>h.n)))]});
    }
  }
  // Longest break within the leave allowed (at least 2 days off per leave day), then best value; overlaps are dropped
  cands.sort((x,z)=>z.len-x.len||z.len/z.leave-x.len/x.leave);
  for(let i=cands.length-1;i>=0;i--)if(cands[i].len/cands[i].leave<2)cands.splice(i,1);
  const pick=[];for(const c of cands)if(!pick.some(p=>!(c.to<p.from||c.from>p.to)))pick.push(c);
  return pick.sort((x,z)=>x.from.localeCompare(z.from));
}

function findDuplicatePairs(ev,arr){
  const list=ev[arr]||[],pairs=[],used=new Set();
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];
    if(used.has(a.id)||used.has(b.id)||(a.appleUid&&b.appleUid)||(a._notDup||[]).includes(b.id))continue;
    if(_sameEntry(arr,a,b)){pairs.push(b.appleUid?[b,a]:[a,b]);used.add(a.id);used.add(b.id);}// Apple-linked first
  }

}

function importAppleCalendar(icsText){
  if(!icsText||!icsText.includes('BEGIN:VCALENDAR'))return 0;
  let parsed;
  try{parsed=parseICSFeed(icsText);}catch(e){console.warn('Apple import parse failed',e);return 0;}
  const incoming=[];
  for(const v of parsed){
    if(!v.uid||!v.start||!v.summary)continue;
    if(v.uid.includes('@holiday-tracker'))continue; // our own exported events — prevent echo loop
    if(v.rrule)continue; // recurring events not supported
    if(v.status==='CANCELLED')continue;
    const startDate=v.start.date;
    let endDate=v.end?v.end.date:startDate;
    const startTime=v.start.time||'',endTime=v.end&&v.end.time?v.end.time:'';
    if(!v.start.time){ // all-day: ICS DTEND is exclusive
      if(v.end&&!v.end.time)endDate=icsPrevDay(endDate);
      if(endDate<startDate)endDate=startDate;
    }
    incoming.push({appleUid:v.uid,name:v.summary,startDate,endDate,startTime,endTime,
      locations:v.location?[v.location]:[],notes:v.description||'',startTz:v.start.tz||'',endTz:(v.end&&v.end.tz)||v.start.tz||''});
  }
  const byUid=new Map(incoming.map(e=>[e.appleUid,e]));
  let changed=0;
  // An empty feed is almost certainly a fetch glitch, not "everything deleted" — remove nothing
  const allowDeletes=incoming.length>0;
  // Apple events attached to tracker events: update their activity, never re-create them standalone
  const attached=attachedAppleUids();
  for(const{ev,kind,arr,e}of _appleEntries()){
    const inc=byUid.get(e.appleUid);
    if(!inc){if(allowDeletes){ev[arr]=ev[arr].filter(x=>x!==e);changed++;}continue;}// deleted in Apple Calendar → removed from the trip
    const src=_appleSrcOf(inc);
    if(JSON.stringify(src)!==JSON.stringify(e.appleSrc||{})||(e.appleV||1)<APPLE_MAP_V){_applyAppleToEntry(kind,e,src);changed++;}
    byUid.delete(e.appleUid);
  }
  // Update or delete existing apple-sourced events (never touches tracker-native events)
  S.events=(S.events||[]).filter(ev=>{
    if(ev.source!=='apple')return true;
    if(attached.has(ev.appleUid)){changed++;return false;}// standalone copy of an attached event (e.g. synced from another device)
    const inc=byUid.get(ev.appleUid);
    if(!inc){if(!allowDeletes)return true;changed++;return false;} // deleted in Apple Calendar
    const fields=['name','startDate','endDate','startTime','endTime','notes','startTz','endTz'];
    const diff=fields.some(f=>(ev[f]||'')!==(inc[f]||''))||JSON.stringify(ev.locations||[])!==JSON.stringify(inc.locations);
    if(diff){Object.assign(ev,inc);ev.year=parseInt(inc.startDate)||ev.year;changed++;}
    byUid.delete(ev.appleUid);
    return true;
  });
  // Add new events from Apple (deterministic IDs so devices don't duplicate)
  for(const inc of byUid.values()){
    S.events.push({id:appleId(inc.appleUid),source:'apple',category:'personal',requiresLeave:false,
      hotels:[],flights:[],activities:[],transport:[],sharedLink:'',
      year:parseInt(inc.startDate)||new Date().getFullYear(),...inc});
    changed++;
  }
  if(changed){S.lastModified=Date.now();try{localStorage.setItem('htV5',JSON.stringify(S));}catch(e){}}
  return changed;
}

// A trip's countries: the ones attached to it, else worked out from its places ("Kuala Lumpur" → Malaysia)
function tripCountries(t){
  if((t.countries||[]).length)return t.countries.map(String);
  const byName={};for(const[id,n]of Object.entries(COUNTRY_DATA))byName[n.toLowerCase()]=id;
  const out=new Set();
  for(const raw of t.locations||[]){const l=String(raw).trim().toLowerCase();if(!l)continue;
    if(byName[l]){out.add(byName[l]);continue;}
    const c=CITIES.find(x=>x.toLowerCase().split(',')[0].trim()===l);const cn=c&&c.includes(',')?c.split(',').pop().trim().toLowerCase():'';
    if(cn&&byName[cn])out.add(byName[cn]);
    else{const tail=l.split(',').pop().trim();if(byName[tail])out.add(byName[tail]);}}
  return [...out];
}
function _durMin(s){const m=String(s||'').match(/(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?/i);return m&&(m[1]||m[2])?(+m[1]||0)*60+(+m[2]||0):0;}
function vTravelStats(){
  const all=(S.events||[]).filter(t=>t.source!=='apple'&&t.startDate&&t.endDate&&(t.category||'trip')==='trip');
  const td=ymd(new Date());
  const years=[...new Set(all.map(t=>t.startDate.slice(0,4)))].sort().reverse();
  const y=S._statY&&(S._statY==='all'||years.includes(S._statY))?S._statY:'all';
  const T=all.filter(t=>(y==='all'||t.startDate.startsWith(y))&&t.startDate<=td);// trips that have started
  const flights=T.flatMap(t=>t.flights||[]);
  // Flight time: the saved duration, else worked out from departure and arrival in their airports' time zones
  const fMin=f=>{const d=_durMin(f.duration);if(d)return d;const z=flightTzs(f),a=zonedToUtc(f.departureTime,z.dep),b=zonedToUtc(f.arrivalTime,z.arr),m=(b-a)/6e4;return m>0&&m<24*60?Math.round(m):0;};

function renderWorldMap(){
  const container=document.getElementById('world-map');
  if(!container||typeof d3==='undefined')return;
  const vc=S.visitedCountries||[];
  const width=container.clientWidth-32;
  const height=Math.min(width*0.55,500);

  container.innerHTML='';
  const svg=d3.select(container).append('svg')
    .attr('viewBox',`0 0 ${width} ${height}`)
    .attr('preserveAspectRatio','xMidYMid meet');

  const projection=d3.geoNaturalEarth1()
    .scale(width/5.8)
    .translate([width/2,height/2]);
  const pathGen=d3.geoPath(projection);

  svg.append('path')
    .datum(d3.geoGraticule10())
    .attr('d',pathGen)
    .attr('fill','none')
    .attr('stroke','var(--glass-border)')
    .attr('stroke-width',0.3)
    .attr('opacity',0.5);

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r=>r.json())
    .then(world=>{
      const countries=topojson.feature(world,world.objects.countries).features;
      // The map data draws French Guiana as part of France (250): split it off so visiting France
      // doesn't light up South America. It becomes its own, untracked shape.
      const fr=countries.find(f=>String(f.id)==='250');
      if(fr&&fr.geometry&&fr.geometry.type==='MultiPolygon'){
        const isGuiana=poly=>d3.geoCentroid({type:'Polygon',coordinates:poly})[0]<-30;
        const guf=fr.geometry.coordinates.filter(isGuiana);
        if(guf.length){
          fr.geometry={type:'MultiPolygon',coordinates:fr.geometry.coordinates.filter(p=>!isGuiana(p))};
          countries.push({type:'Feature',id:'GUF',properties:{name:'French Guiana'},geometry:{type:'MultiPolygon',coordinates:guf}});
        }
      }
      svg.selectAll('path.country')
        .data(countries)
        .enter().append('path')
        .attr('class',d=>{const cid=String(d.id);const known=!!COUNTRY_DATA[cid];return 'country'+(known?'':' untracked')+(vc.includes(cid)?' visited':'');})
        .attr('d',pathGen)
        .attr('data-id',d=>d.id)
        .attr('data-name',d=>COUNTRY_DATA[String(d.id)]||'')
        .style('pointer-events',d=>COUNTRY_DATA[String(d.id)]?'all':'none')
        .on('click',function(event,d){
          const cid=String(d.id);
          if(!COUNTRY_DATA[cid])return;
          if(!S.visitedCountries)S.visitedCountries=[];
          const idx=S.visitedCountries.indexOf(cid);
          if(idx>=0)S.visitedCountries.splice(idx,1);
          else S.visitedCountries.push(cid);
          saveS();
          d3.select(this).classed('visited',S.visitedCountries.includes(cid));
          render();
        })
        .on('mouseenter',function(event,d){
          const cid=String(d.id),name=COUNTRY_DATA[cid];const tip=document.getElementById('map-tip');if(!name||!tip)return;
          tip.innerHTML=`<div class="mt-row">${flagHtml(cid,'mt-flag')}<span class="mt-name">${esc(name)}</span></div>`;
          tip.classList.add('on');
        })
        .on('mousemove',function(event){
          const tip=document.getElementById('map-tip'),box=container.getBoundingClientRect();if(!tip)return;
          let x=event.clientX-box.left+14,y=event.clientY-box.top+14;
          if(x+tip.offsetWidth>box.width-8)x=event.clientX-box.left-tip.offsetWidth-14;
          tip.style.transform=`translate(${x}px,${y}px)`;
        })
        .on('mouseleave',function(){const tip=document.getElementById('map-tip');if(tip)tip.classList.remove('on');});
      container.insertAdjacentHTML('beforeend','<div id="map-tip" class="map-tip" role="tooltip"></div>');
    })
    .catch(()=>{container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text3);font-size:12px">Could not load map data. Check your connection.</div>';});
}

      <button class="btn btn-s" data-action="export">Export JSON</button>
      <button class="btn btn-s" data-action="export-csv">Export CSV</button>
      <button class="btn btn-s" data-action="import">Import JSON</button>
      ${localStorage.getItem('htV5_backup')?`<button class="btn btn-s" data-action="restore-backup" style="border-color:var(--orange);color:var(--orange)">Restore Backup <span style="font-size:10.5px;opacity:.7">(${localStorage.getItem('htV5_backup_ts')||'unknown'})</span></button>`:''}

function buildItineraryItems(t,opts){
  opts=opts||{};
  const secs=opts.sections||['flights','hotels','activities','transport'];
  const flds=opts.fields||['costs','booking','notes'];
  const incBooking=flds.includes('booking');
  const incNotes=flds.includes('notes');
  const incPayments=flds.includes('payments');
  const dateFrom=opts.dateFrom||'';
  const dateTo=opts.dateTo||'';
  const inRange=d=>{if(!d)return true;if(dateFrom&&d<dateFrom)return false;if(dateTo&&d>dateTo)return false;return true;};
  const items=[];
  const fmtD2=d=>d?new Date(d+'T00:00:00').toLocaleDateString(dloc(),{day:'numeric',month:'short',year:'numeric'}):'';
  const fmtT2=dt=>{if(!dt)return '';try{const d2=new Date(dt.includes('T')?dt:dt.replace(' ','T'));if(isNaN(d2))return dt;return d2.toLocaleTimeString(dloc(),{hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return dt;}};
  const payDet=(e)=>{const r=[];if(flds.includes('costs')&&myFrac(e,t)!==1&&parseFloat(e.cost))r.push(['Your share',`${e.currency||baseCur()} ${fmtAmt(shareAmt(e,t))}${myFrac(e,t)?` (split ${splitN(e,t)} ways)`:' (not yours)'}`]);if(!incPayments)return r;if(e.fullPaymentAmount)r.push(['Full Payment',`${e.fullPaymentCurrency||e.currency||baseCur()} ${e.fullPaymentAmount}`]);if(e.depositAmount)r.push(['Deposit',`${e.depositCurrency||e.currency||baseCur()} ${e.depositAmount}${e.depositPaid==='yes'?' (Paid)':' (Unpaid)'}`]);if(e.depositDate)r.push(['Deposit Date',fmtD2(e.depositDate)]);if(e.paymentDueDate)r.push(['Payment Due',fmtD2(e.paymentDueDate)]);if(e.fullyPaid==='yes')r.push(['Status','Fully Paid']);return r;};
  if(secs.includes('flights'))(t.flights||[]).forEach(f=>{
    const d=f.departureTime?(f.departureTime.includes('T')?f.departureTime.split('T')[0]:f.departureTime.split(' ')[0]):'';
    if(!inRange(d||t.startDate))return;
    const det=[];
    if(f.from||f.to)det.push(['Route',`${f.from||'?'} to ${f.to||'?'}`]);
    if(f.departureTime)det.push(['Depart',fmtT2(f.departureTime)]);
    if(f.arrivalTime)det.push(['Arrive',fmtT2(f.arrivalTime)]);
    if(f.pnr)det.push(['PNR',f.pnr]);
    if(f.seat)det.push(['Seat',f.seat]);
    if(f.duration)det.push(['Duration',f.duration]);
    if(incBooking&&f.bookingDetails)det.push(['Booking',f.bookingDetails]);
    if(incNotes&&f.notes)det.push(['Notes',f.notes]);
    det.push(...payDet(f));
    items.push({type:'FLIGHT',date:d||t.startDate,sortKey:f.departureTime||d||t.startDate,
      title:`${f.airline||''} ${f.flightNumber||''}`.trim()||'Flight',
      details:det,cost:f.cost?parseFloat(f.cost):0,currency:f.currency||baseCur(),color:[59,130,246],
      timeStr:f.departureTime?`${fmtT2(f.departureTime)} - ${fmtT2(f.arrivalTime)}`:'',
      detailStr:[f.from&&f.to?`${f.from} → ${f.to}`:'',f.pnr?`PNR: ${f.pnr}`:'',f.seat?`Seat: ${f.seat}`:'',f.duration?`Duration: ${f.duration}`:''].filter(Boolean).join(' | ')
    });
  });
  if(secs.includes('hotels'))(t.hotels||[]).forEach(h=>{
    if(!inRange(h.checkIn||t.startDate))return;
    const det=[];
    if(h.checkIn)det.push(['Check-in',fmtD2(h.checkIn)]);
    if(h.checkOut)det.push(['Check-out',fmtD2(h.checkOut)]);
    if(h.checkIn&&h.checkOut)det.push(['Nights',String(nights(h.checkIn,h.checkOut))]);
    if(incBooking&&h.bookingNumber)det.push(['Booking #',h.bookingNumber]);
    if(incNotes&&h.notes)det.push(['Notes',h.notes]);
    det.push(...payDet(h));
    items.push({type:'HOTEL',date:h.checkIn||t.startDate,sortKey:h.checkIn||t.startDate,
      title:h.name||'Hotel',
      details:det,cost:h.cost?parseFloat(h.cost):0,currency:h.currency||baseCur(),color:[168,85,247],
      timeStr:h.checkIn&&h.checkOut?`${fmtD2(h.checkIn)} - ${fmtD2(h.checkOut)}`:'',
      detailStr:[incBooking&&h.bookingNumber?`Booking: ${h.bookingNumber}`:'',h.checkIn&&h.checkOut?`${nights(h.checkIn,h.checkOut)} nights`:''].filter(Boolean).join(' | ')
    });
  });
  if(secs.includes('activities'))(t.activities||[]).forEach(a=>{
    if(!inRange(a.date||t.startDate))return;
    const det=[];
    if(a.location)det.push(['Location',a.location]);
    if(a.time)det.push(['Time',a.time]);
    if(a.duration)det.push(['Duration',a.duration]);
    if(incBooking&&a.bookingDetails)det.push(['Booking',a.bookingDetails]);
    if(incNotes&&a.notes)det.push(['Notes',a.notes]);
    det.push(...payDet(a));
    items.push({type:'ACTIVITY',date:a.date||t.startDate,sortKey:(a.date||t.startDate)+' '+(a.time||'99'),
      title:a.name||'Activity',
      details:det,cost:a.cost?parseFloat(a.cost):0,currency:a.currency||baseCur(),color:[245,158,11],
      timeStr:a.time||'',
      detailStr:[a.location||'',a.duration?`Duration: ${a.duration}`:'',incBooking&&a.bookingDetails?`Booking: ${a.bookingDetails}`:''].filter(Boolean).join(' | ')
    });
  });
  if(secs.includes('transport'))(t.transport||[]).forEach(x=>{
    if(!inRange(x.date||t.startDate))return;
    const det=[];
    if(x.location)det.push(['Location',x.location]);
    if(x.time)det.push(['Time',x.time]);
    if(x.duration)det.push(['Duration',x.duration]);
    if(incBooking&&x.bookingDetails)det.push(['Booking',x.bookingDetails]);
    if(incNotes&&x.notes)det.push(['Notes',x.notes]);
    det.push(...payDet(x));
    items.push({type:'TRANSPORT',date:x.date||t.startDate,sortKey:(x.date||t.startDate)+' '+(x.time||'99'),
      title:`${x.type||''} ${x.name||''}`.trim()||'Transport',
      details:det,cost:x.cost?parseFloat(x.cost):0,currency:x.currency||baseCur(),color:[34,197,94],
      timeStr:x.time||'',
      detailStr:[x.location||'',x.duration?`Duration: ${x.duration}`:'',incBooking&&x.bookingDetails?`Booking: ${x.bookingDetails}`:''].filter(Boolean).join(' | ')
    });
  });
  items.sort((a,b)=>a.sortKey.localeCompare(b.sortKey));
  return items;
}

function genItineraryPDF(t,opts){
  if(typeof window.jspdf==='undefined'){toast('PDF library still loading — try again');return;}
  opts=opts||{};
  const incCost=(opts.fields||[]).includes('costs');
  const secs=opts.sections||['flights','hotels','activities','transport'];
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=15,CW=W-2*M;
  let y=0,pg=1;
  const fmtD2=d=>d?new Date(d+'T00:00:00').toLocaleDateString(dloc(),{day:'numeric',month:'short',year:'numeric'}):'';
  const fmtDL=d=>d?new Date(d+'T00:00:00').toLocaleDateString(dloc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
  const addFoot=()=>{doc.setFontSize(7);doc.setTextColor(160);doc.text('Generated by '+APP_NAME,M,290);doc.text('Page '+pg,W-M,290,{align:'right'});doc.setTextColor(0);};
  const np=()=>{addFoot();doc.addPage();y=15;pg++;};
  const ck=h=>{if(y+h>278)np();};

  // Header
  doc.setFillColor(30,41,59);doc.rect(0,0,W,48,'F');
  doc.setFillColor(59,130,246);doc.rect(0,48,W,1.5,'F');
  doc.setTextColor(148,163,184);doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('EVENT ITINERARY',M,14);
  doc.setTextColor(255);doc.setFontSize(20);doc.setFont('helvetica','bold');
  const tLines=doc.splitTextToSize(t.name,CW);doc.text(tLines,M,26);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(203,213,225);
  doc.text(`${fmtD2(t.startDate)} — ${fmtD2(t.endDate)}  |  ${days(t.startDate,t.endDate)} days, ${nights(t.startDate,t.endDate)} nights  |  ${t.locations.join(', ')}`,M,40);
  if(incCost){doc.setTextColor(134,239,172);doc.text(`Total: ${baseCur()} ${eCost(t).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`,W-M,40,{align:'right'});}
  y=56;doc.setTextColor(0);

  // Build & group items
  const items=buildItineraryItems(t,opts);
  const byDate={};items.forEach(it=>{if(!byDate[it.date])byDate[it.date]=[];byDate[it.date].push(it);});
  const sortedDates=Object.keys(byDate).sort();
  const evStart=new Date(t.startDate+'T00:00:00');

  if(!items.length){
    doc.setFontSize(11);doc.setTextColor(100);doc.text('No bookings match the selected filters.',M,y);
    addFoot();doc.save(`${t.name.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'-').toLowerCase()}-itinerary.pdf`);
    toast('PDF exported');return;
  }

  sortedDates.forEach(date=>{
    const dayNum=Math.max(1,Math.ceil((new Date(date+'T00:00:00')-evStart)/864e5)+1);
    ck(20);
    // Day header
    doc.setFillColor(241,245,249);doc.roundedRect(M,y,CW,8,1.5,1.5,'F');
    doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
    doc.text(`Day ${dayNum} — ${fmtDL(date)}`,M+4,y+5.5);
    y+=12;

    byDate[date].forEach(item=>{
      const nDet=item.details.length+(incCost&&item.cost?1:0);
      const estH=14+nDet*4.2;
      ck(estH+4);

      // Accent border
      doc.setDrawColor(item.color[0],item.color[1],item.color[2]);doc.setLineWidth(1);
      doc.line(M+2,y,M+2,y+estH-3);

      // Type
      doc.setFontSize(7);doc.setFont('helvetica','bold');
      doc.setTextColor(item.color[0],item.color[1],item.color[2]);
      doc.text(item.type,M+6,y+3);

      // Title
      doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
      doc.text(doc.splitTextToSize(item.title,CW-12)[0],M+6,y+8.5);

      // Details
      let dy=y+14;doc.setFontSize(8);
      item.details.forEach(([k,v])=>{
        doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);
        doc.text(k+':',M+6,dy);
        doc.setTextColor(51,65,85);
        const vLines=doc.splitTextToSize(String(v||''),CW-38);
        doc.text(vLines[0]||'',M+28,dy);
        if(vLines.length>1){dy+=4;doc.text(vLines[1],M+28,dy);}
        dy+=4.2;
      });
      if(incCost&&item.cost){
        doc.setFont('helvetica','bold');doc.setTextColor(22,163,74);
        doc.text('Cost:',M+6,dy);
        doc.text(`${item.currency} ${item.cost.toLocaleString()}`,M+28,dy);
        dy+=4.2;
      }
      y=dy+3;doc.setDrawColor(0);doc.setLineWidth(0.2);
    });
    y+=4;
  });

  // Cost summary
  if(incCost){
    ck(50);y+=4;
    doc.setDrawColor(200);doc.line(M,y,W-M,y);y+=8;
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
    doc.text('Cost Summary',M,y);y+=8;
    const catMap={flights:'Flights',hotels:'Hotels',activities:'Activities',transport:'Transport'};
    const cats=secs.map(s=>({l:catMap[s]||s,a:t[s]||[]}));
    doc.setFontSize(9);
    cats.forEach(c=>{
      const sm=c.a.reduce((s,e)=>s+toBase(e.cost,e.currency,e.rateToSGD),0);
      if(sm>0){
        doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.text(c.l,M+4,y);
        doc.setFont('helvetica','normal');doc.setTextColor(51,65,85);
        doc.text(`${baseCur()} ${sm.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`,M+45,y);y+=5;
      }
    });
    y+=1;doc.setDrawColor(200);doc.line(M+4,y,M+80,y);y+=6;
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(30,41,59);
    doc.text('Total',M+4,y);
    doc.text(`${baseCur()} ${eCost(t).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}`,M+45,y);
  }

  addFoot();
  const fn=t.name.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'-').toLowerCase();
  doc.save(`${fn}-itinerary.pdf`);toast('PDF exported');
}

function genItineraryXLSX(t,opts){
  if(typeof XLSX==='undefined'){toast('Excel library still loading — try again');return;}
  opts=opts||{};
  const incCost=(opts.fields||[]).includes('costs');
  const incPayments=(opts.fields||[]).includes('payments');
  const secs=opts.sections||['flights','hotels','activities','transport'];
  const fmtD2=d=>d?new Date(d+'T00:00:00').toLocaleDateString(dloc(),{day:'numeric',month:'short',year:'numeric'}):'';
  const wb=XLSX.utils.book_new();

  // Overview sheet
  const catMap={flights:'Flights',hotels:'Hotels',activities:'Activities',transport:'Transport'};
  const ov=[['Event Itinerary'],[],['Event Name',t.name],['Dates',`${fmtD2(t.startDate)} — ${fmtD2(t.endDate)}`],
    ['Duration',`${days(t.startDate,t.endDate)} days, ${nights(t.startDate,t.endDate)} nights`],
    ['Locations',t.locations.join(', ')],[]];
  secs.forEach(s=>ov.push([catMap[s]||s,(t[s]||[]).length]));
  if(incCost){ov.push([],[`Total Cost (${baseCur()})`,eCost(t).toFixed(2)]);}
  const ws1=XLSX.utils.aoa_to_sheet(ov);ws1['!cols']=[{wch:18},{wch:45}];
  XLSX.utils.book_append_sheet(wb,ws1,'Overview');

  // Itinerary sheet
  const hdr=['Day','Date','Type','Name','Details','Time'];
  const flds=opts.fields||['costs','booking','notes'];
  if(flds.includes('notes'))hdr.push('Notes');
  if(incCost)hdr.push('Cost','Currency');
  if(incPayments)hdr.push('Full Payment','Deposit','Deposit Date','Payment Due','Fully Paid');
  const rows=[hdr];
  const items=buildItineraryItems(t,opts);
  const evStart=new Date(t.startDate+'T00:00:00');
  items.forEach(it=>{
    const dn=Math.max(1,Math.ceil((new Date(it.date+'T00:00:00')-evStart)/864e5)+1);
    const r=[dn,fmtD2(it.date),it.type,it.title,it.detailStr,it.timeStr];
    if(flds.includes('notes'))r.push(it.details.find(d=>d[0]==='Notes')?it.details.find(d=>d[0]==='Notes')[1]:'');
    if(incCost)r.push(it.cost||'',it.currency);
    if(incPayments){
      const full=it.details.find(d=>d[0]==='Full Payment');
      const dep=it.details.find(d=>d[0]==='Deposit');
      const depDate=it.details.find(d=>d[0]==='Deposit Date');
      const pmtDue=it.details.find(d=>d[0]==='Payment Due');
      const status=it.details.find(d=>d[0]==='Status');
      r.push(full?full[1]:'',dep?dep[1]:'',depDate?depDate[1]:'',pmtDue?pmtDue[1]:'',status?status[1]:'');
    }
    rows.push(r);
  });
  if(incCost){rows.push([]);const totalRow=new Array(hdr.length).fill('');totalRow[hdr.indexOf('Cost')-1]=`Total (${baseCur()})`;totalRow[hdr.indexOf('Cost')]=eCost(t).toFixed(2);rows.push(totalRow);}
  const ws2=XLSX.utils.aoa_to_sheet(rows);
  ws2['!cols']=[{wch:5},{wch:16},{wch:11},{wch:30},{wch:40},{wch:22}];
  if(flds.includes('notes'))ws2['!cols'].push({wch:25});
  if(incCost)ws2['!cols'].push({wch:10},{wch:8});
  if(incPayments)ws2['!cols'].push({wch:18},{wch:18},{wch:12},{wch:14},{wch:10});
  XLSX.utils.book_append_sheet(wb,ws2,'Itinerary');

  const fn=t.name.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'-').toLowerCase();
  XLSX.writeFile(wb,`${fn}-itinerary.xlsx`);toast('Excel exported');
}

// ===== MODALS =====
function modal(title,body,onSave,opts){
  opts=opts||{};
  const saveLabel=opts.saveLabel||'Save';
  const saveCls=opts.danger?'btn btn-d':'btn btn-p';
  const o=document.getElementById('mbg');
  o.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="modal-x" data-action="xm">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-s" data-action="xm">${opts.noSave?'Close':'Cancel'}</button>${opts.noSave?'':`<button class="${saveCls}" id="msave">${saveLabel}</button>`}</div></div>`;
  o.classList.add('open');
  if(onSave&&!opts.noSave)document.getElementById('msave').onclick=()=>{const r=onSave();if(r===false)return;xm();};
  o.onclick=e=>{if(e.target===o)xm();};
  o.querySelectorAll('.dz').forEach(setupDZ);
  setupDZTabs(o);
  splitHintUpd(o.querySelector('.modal'));
}
function xm(){document.getElementById('mbg').classList.remove('open');}

function eventCur(ev){
  if(!ev)return baseCur();
  const all=[...(ev.flights||[]),...(ev.hotels||[]),...(ev.activities||[]),...(ev.transport||[])];
  for(let i=all.length-1;i>=0;i--){if(all[i].currency)return all[i].currency;}
  return baseCur();
}
function curSel(sel,nm='currency'){sel=sel||baseCur();const l=currencyList();if(!l.includes(sel))l.unshift(sel);return`<select class="fc" name="${nm}">${l.map(c=>`<option value="${c}"${c===sel?' selected':''} title="${esc(_currencyName(c))}">${c}</option>`).join('')}</select>`;}
function dzHtml(id,showTextTab){
  const tabs=showTextTab?`<div class="dz-tabs"><button class="dz-tab active" data-dztab="file" data-dzid="${id}">Upload / Paste image</button><button class="dz-tab" data-dztab="text" data-dzid="${id}">Paste text</button></div>`:'';

function setupDZ(dz){
  const id=dz.dataset.dz,inp=dz.querySelector(`[data-fi="${id}"]`);
  dz.onclick=()=>inp.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files.length)runOCR(e.dataTransfer.files[0],id);};
  inp.onchange=e=>{if(e.target.files.length)runOCR(e.target.files[0],id);};
  const clip=dz.parentElement&&dz.parentElement.querySelector(`[data-dzclip="${id}"]`);if(clip)clip.onclick=e=>{e.preventDefault();dzClipboardPaste(id);};
  // Clipboard paste (screenshots and text) is handled by one document-level listener, so it works
  // wherever focus is — a paste event goes to the focused element, which is often outside the modal
  if(!document._dzPasteSet){
    document._dzPasteSet=true;
    document.addEventListener('paste',e=>{
      // Route to the drop zone in the open modal
      const bg=document.getElementById('mbg');
      const activeDZ=bg&&bg.classList.contains('open')?bg.querySelector('.dz[data-dz]'):null;
      if(!activeDZ)return;
      const activeId=activeDZ.dataset.dz;
      const items=e.clipboardData&&e.clipboardData.items;
      if(!items)return;
      // Check for image data first (screenshot paste)
      for(let i=0;i<items.length;i++){
        if(items[i].type.startsWith('image/')){
          e.preventDefault();
          const blob=items[i].getAsFile();
          if(blob)runOCR(blob,activeId);
          return;
        }
      }
      // Check for text data (email confirmation paste)
      const txt=e.clipboardData.getData('text/plain');
      if(txt&&txt.trim().length>20){
        // Only intercept if the paste target isn't a textarea/input
        if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
        e.preventDefault();
        handleTextPaste(txt.trim(),activeId);
      }
    });
  }
}

// Paste button: phones have no Ctrl+V, and a long-press on the drop zone offers no Paste, so read the clipboard directly
async function dzClipboardPaste(id){
  const c=navigator.clipboard;
  if(!c||(!c.read&&!c.readText)){toast('This browser can\'t paste here. Use Paste text, or save the screenshot and tap the box to choose it.');return;}
  try{
    if(c.read){
      const items=await c.read();
      for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){const b=await it.getType(t);runOCR(new File([b],'Pasted screenshot',{type:t}),id);return;}}
      for(const it of items){if(it.types.includes('text/plain')){const txt=(await (await it.getType('text/plain')).text()).trim();if(txt){dzPasteText(txt,id);return;}}}
    }else{const txt=((await c.readText())||'').trim();if(txt){dzPasteText(txt,id);return;}}
    toast('Nothing to paste. Copy a screenshot or the booking email text first.');
  }catch(e){
    // Older browsers without image support: fall back to text
    if(e&&e.name!=='NotAllowedError'&&c.readText){try{const txt=((await c.readText())||'').trim();if(txt){dzPasteText(txt,id);return;}}catch(e2){}}
    toast(e&&e.name==='NotAllowedError'?'Pasting was blocked. Tap Paste again and allow it, or use Paste text.':'Couldn\'t read the clipboard. Try Paste text instead.');
  }
}

// ===== Learned layouts =====
// When the built-in rules can't read a booking, the AI reads it (Edge Function "ai-scan") and also writes a
// recipe for that layout: wording that identifies it plus patterns like "Confirmation number: {pnr}".
// Recipes are shared (supabase/ai_scan.sql: scan_rules) and kept on this device, so the next booking in a
// known layout is read here, offline too, without the AI. The same pattern engine runs in the function.
const RULE_FIELDS={pnr:'code',bookingNumber:'code',cost:'amount',currency:'cur',date:'date',dateTo:'date',nights:'int',
  hotelName:'text',title:'text',provider:'text',roomType:'text',departureTime:'time',arrivalTime:'time',
  airline:'text',flightNumber:'fn',fromCode:'iata',toCode:'iata',from:'text',to:'text',arrivalDate:'date',seat:'seat'};
const RULE_VAL={code:'[A-Z0-9][A-Z0-9-]{3,23}',amount:"\\d[\\d,.' ]*\\d|\\d",cur:'[A-Z]{3}|Rp\\.?|RM|[A-Z]{0,2}\\$|[^\\sA-Za-z0-9]{1,2}',
  date:'[^\\n]{3,32}?',int:'\\d{1,3}',text:'[^\\n]{2,80}?',time:'\\d{1,2}[:.h]\\d{2}(?:\\s*[AaPp]\\.?[Mm]\\.?)?|[0-2]\\d[0-5]\\d',
  fn:'[A-Z0-9]{2}\\s?\\d{1,4}',iata:'[A-Z]{3}',seat:'\\d{1,2}[A-K]'};
const _patCache=new Map();
function compileScanPattern(p,flags){
  const key=p+'|'+(flags||'');if(_patCache.has(key))return _patCache.get(key);
  const parts=p.split(/(\{[a-zA-Z]+\})/),fields=[];let re='';
  parts.forEach((part,i)=>{
    const ph=part.match(/^\{([a-zA-Z]+)\}$/);
    if(ph){const t=RULE_FIELDS[ph[1]];if(!t)throw new Error('unknown field '+ph[1]);fields.push(ph[1]);let v=RULE_VAL[t];
      if(v.endsWith('?')&&!parts.slice(i+1).join('').trim())v=v.slice(0,-1);
      re+='('+v+')';return;}
    const toks=part.match(/[A-Za-z]+|\d+|[^\sA-Za-z\d]/g)||[];
    if(!toks.length){re+='\\s*';return;}
    re+='\\s*'+toks.map(t=>/^[A-Za-z]+$/.test(t)?t.replace(/[A-Za-z]/g,c=>'['+c.toUpperCase()+c.toLowerCase()+']'):'(?:'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')?').join('\\s*')+'\\s*';
  });
  if(!fields.length)throw new Error('no field');
  const out={re:new RegExp(re,flags||''),fields};_patCache.set(key,out);return out;
}
function ruleValue(f,raw){
  raw=String(raw||'').trim();if(!raw)return '';
  switch(RULE_FIELDS[f]){
    case 'code':case 'fn':case 'iata':case 'seat':return raw.replace(/\s/g,'').toUpperCase();
    case 'amount':return raw.replace(/[,' ]/g,'');
    case 'cur':{if(/^[A-Za-z]{3}$/.test(raw))return raw.toUpperCase();const k=raw.toLowerCase().replace(/\.$/,'');return{'hk$':'HKD','nt$':'TWD','us$':'USD'}[k]||CURRENCY_SYMBOLS[k]||'';}
    case 'date':return parseDate(raw)||((_findDates(raw)[0]||{}).date)||'';
    case 'int':return parseInt(raw,10)||'';
    case 'time':{const m=raw.match(/(\d{1,2})[:.h]?(\d{2})\s*([AaPp])?/);if(!m)return '';let h=+m[1];if(m[3]){const pm=/p/i.test(m[3]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0;}return String(h).padStart(2,'0')+':'+m[2];}
    default:return raw.replace(/^[\W_]+|[\s,;:|]+$/g,'').replace(/\s+/g,' ');
  }
}
let _scanRulesMem=null,_scanRulesAt=0;
function scanRules(){if(_scanRulesMem)return _scanRulesMem;try{_scanRulesMem=JSON.parse(localStorage.getItem('htScanRules')||'[]');}catch(e){_scanRulesMem=[];}return _scanRulesMem;}
async function loadScanRules(force){
  if(!_acct||!navigator.onLine||!sbClient())return;
  if(!force&&Date.now()-_scanRulesAt<10*60*1000)return;_scanRulesAt=Date.now();
  try{const{data,error}=await sbClient().from('scan_rules').select('id,kind,signature,patterns,leg_pattern');
    if(!error&&Array.isArray(data)){_scanRulesMem=data;_patCache.clear();try{localStorage.setItem('htScanRules',JSON.stringify(data));}catch(e){}}}catch(e){}
}
const _ruleWords=t=>' '+String(t).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()+' ';
function applyLearnedRules(txt,r){
  const rules=scanRules();if(!rules.length)return r;
  const words=_ruleWords(txt);
  // Every recipe whose wording is all here adds what it reads; the most specific recipe (most wording) goes first and wins
  const hits=rules.filter(rule=>{const sig=rule.signature||[];return sig.length>=2&&sig.every(x=>words.includes(_ruleWords(x)));})
    .sort((a,b)=>(b.signature.length-a.signature.length));
  if(!hits.length)return r;
  const kind=hits[0].kind,got={};let legs=null;
  for(const rule of hits.filter(x=>x.kind===kind)){
    for(const p of rule.patterns||[]){try{const{re,fields}=compileScanPattern(p.pattern);const m=txt.match(re);if(m)fields.forEach((f,i)=>{const v=ruleValue(f,m[i+1]);if(v!==''&&v!=null&&!(f in got))got[f]=v;});}catch(e){}}
    if(!legs&&rule.leg_pattern){try{const{re,fields}=compileScanPattern(rule.leg_pattern,'g');const ms=[...txt.matchAll(re)];
      if(ms.length)legs=ms.map(m=>{const l={};fields.forEach((f,i)=>{const v=ruleValue(f,m[i+1]);if(v!=='')l[f]=v;});return l;});}catch(e){}}
  }
  if(!Object.keys(got).length&&!legs)return r;
  const out={...r,...got,type:kind,learnedLayout:hits[0].id};
  if(legs&&legs.length)_setLegs(out,legs.map(l=>_completeLeg(l,got)));
  _finishParsed(out);
  return out;
}
function _completeLeg(l,top){
  if(l.fromCode&&!l.from)l.from=AIRPORTS[l.fromCode]||l.fromCode;
  if(l.toCode&&!l.to)l.to=AIRPORTS[l.toCode]||l.toCode;
  if(l.flightNumber){l.flightNumber=l.flightNumber.replace(/\s+/g,'').toUpperCase();if(!l.airline)l.airline=AIRLINE_MAP[l.flightNumber.slice(0,2)]||'';}
  if(!l.pnr&&top&&top.pnr)l.pnr=top.pnr;
  if(!l.arrivalDate&&l.date)l.arrivalDate=l.date;
  return l;
}
function _setLegs(r,legs){
  r.multiLeg=true;r.legs=legs;
  const ds=legs.map(l=>l.date).filter(Boolean).sort(),es=legs.map(l=>l.arrivalDate||l.date).filter(Boolean).sort();
  if(ds.length)r.date=ds[0];if(es.length)r.dateTo=es[es.length-1];
  const f=legs[0],last=legs[legs.length-1];
  Object.assign(r,{from:f.from||'',to:last.to||'',flightNumber:f.flightNumber||'',departureTime:f.departureTime||'',arrivalTime:f.arrivalTime||'',airline:f.airline||r.airline||''});
  r.locations=[...new Set(legs.flatMap(l=>[l.from,l.to]).filter(Boolean))];
}
function _finishParsed(r){
  if(!r.locations)r.locations=[];
  _yenOrYuan(r.rawText||'',r);
  if(r.type==='hotel'){if(!r.nights&&r.date&&r.dateTo)r.nights=Math.round((new Date(r.dateTo)-new Date(r.date))/864e5);r.name=r.hotelName||r.name||'Hotel Booking';}
  else if(r.type==='flight'&&r.legs&&r.legs.length)r.name=`${r.airline||'Flight'} ${r.from||''} → ${r.to||''}`+(r.legs.length>1?` (${r.legs.length} legs)`:'');
  else r.name=r.title||r.provider||r.name||'Uploaded Booking';
  return r;
}
// The AI's reading in the app's own shape
function aiToParsed(res){
  const b=res.booking||{},r={type:res.type||'activity'};
  for(const k of ['hotelName','title','provider','pnr','bookingNumber','date','dateTo','cost','currency','roomType','departureTime','arrivalTime','transportType'])if(b[k]!=null&&String(b[k]).trim())r[k]=String(b[k]).trim();
  if(b.nights)r.nights=parseInt(b.nights,10)||undefined;
  if(r.cost)r.cost=String(r.cost).replace(/[^\d.]/g,'');
  if(r.currency)r.currency=r.currency.toUpperCase().slice(0,3);
  for(const k of ['date','dateTo'])if(r[k]&&!/^\d{4}-\d{2}-\d{2}$/.test(r[k]))delete r[k];
  r.locations=Array.isArray(b.locations)?b.locations.filter(Boolean).map(String):[];
  if(r.type==='flight'&&Array.isArray(res.legs)&&res.legs.length)_setLegs(r,res.legs.map(l=>_completeLeg({...l},r)));
  return _finishParsed(r);
}
// Ask the AI to read a booking the rules couldn't. Returns {parsed, learned, remaining} or {error}.
async function aiRead(txt){
  if(!acctEnabled()||!_acct||!navigator.onLine)return null;
  const{data}=await sbClient().auth.getSession();const tok=data&&data.session&&data.session.access_token;if(!tok)return null;
  let r;try{r=await fetch(SUPA_URL+'/functions/v1/ai-scan',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+tok},body:JSON.stringify({text:txt.slice(0,12000)})});}catch(e){return null;}
  const j=await r.json().catch(()=>({}));
  if(r.status===404||j.error==='not_enabled')return null;// AI reading not set up
  if(!r.ok){
    if(j.error==='user_limit')return{error:'You\'ve used today\'s 20 AI reads. Check the details below; AI reading is available again tomorrow.',remaining:0};
    if(j.error==='daily_cap')return{error:'AI reading has reached today\'s limit. Check the details below; it\'s available again tomorrow.',remaining:j.remaining};
    if(r.status===401)return{error:'Please sign in again to use AI reading.'};
    // Anything else is a server or setup problem: keep the detail for the admin, show a plain message
    console.warn('AI reading failed:',r.status,j.error);
    return{error:'AI reading isn\'t available right now. Check the details below and fix anything that\'s missing.'};
  }
  if(j.learned)loadScanRules(true);
  return{parsed:aiToParsed(j),learned:!!j.learned,remaining:j.remaining};
}
// The AI's values win; anything it left out keeps the rules' value
function mergeAiParsed(rules,ai){
  const out={...rules};
  for(const[k,v]of Object.entries(ai))if(v!==''&&v!=null&&!(Array.isArray(v)&&!v.length))out[k]=v;
  if(ai.legs&&ai.legs.length){out.legs=ai.legs;out.multiLeg=true;}
  return out;
}

// Screenshot text, rebuilt from word positions: on wide layouts two columns can share a row
// ("Hilton Niseko Village        Total fees ¥40,320"); a wide gap between two runs of words starts a new line.
// Label/value rows ("Total fees    ¥40,320", "Check-in:    7 Mar") stay together.
function ocrLayoutText(d){
  if(!d||!d.lines||!d.lines.length)return d&&d.text||'';
  const words=t=>(t.match(/[A-Za-z]{3,}/g)||[]).length;
  return d.lines.map(ln=>{
    const ws=(ln.words||[]).filter(w=>w.text&&w.text.trim());if(!ws.length)return(ln.text||'').trim();
    const hs=ws.map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b),h=Math.max(8,hs[hs.length>>1]);
    const segs=[[ws[0].text]];
    for(let i=1;i<ws.length;i++){
      const gap=ws[i].bbox.x0-ws[i-1].bbox.x1,left=segs[segs.length-1].join(' '),rest=ws.slice(i).map(w=>w.text).join(' ');
      if(gap>h*2.5&&words(left)>=2&&words(rest)>=2&&!/[:：]$/.test(left))segs.push([ws[i].text]);else segs[segs.length-1].push(ws[i].text);
    }
    return segs.map(x=>x.join(' ')).join('\n');
  }).join('\n');
}
// PDF text items in reading order as one run. Pieces of one word (browser-printed emails split words:
// "B","oo","ki","n","g") join without a space; a real gap or a new line becomes one space.
function pdfJoin(items){
  // Same as joining every piece with a space (other readers rely on that spacing), except pieces that touch
  let out='',prev=null;
  items.forEach((it,i)=>{
    const str=it.str||'',x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||it.height||10;
    let sep=i?' ':'';
    if(prev&&prev.word&&/^\S/.test(str)&&Math.abs(prev.y-y)<=Math.max(2,h*0.45)){const gap=x-prev.end;if(gap>-h*0.3&&gap<h*0.12)sep='';}
    out+=sep+str;prev={y,end:x+(it.width||0),word:/\S$/.test(str)};
  });
  return out;
}
// PDF text items → lines, from their position on the page (a wide gap inside a line becomes 3 spaces)
function pdfLines(items){
  const its=items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||it.height||10}));
  its.sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of its){const ln=lines[lines.length-1];if(ln&&Math.abs(ln.y-it.y)<=Math.max(2,it.h*0.45))ln.items.push(it);else lines.push({y:it.y,items:[it]});}
  return lines.map(ln=>{ln.items.sort((a,b)=>a.x-b.x);let out='',end=null;
    for(const it of ln.items){if(end!==null){const gap=it.x-end;out+=gap>it.h*1.5?'   ':gap>it.h*0.15?' ':'';}out+=it.s;end=it.x+it.w;}
    return out.trim();}).join('\n');
}
// How much of a booking a reading gave (used to keep the better of two readings)
function parseScore(p){
  if(!p)return 0;let n=0;
  ['hotelName','date','dateTo','cost','pnr','flightNumber','departureTime','from','to'].forEach(k=>{if(p[k])n++;});
  (p.legs||[]).forEach(l=>['flightNumber','date','from','to','departureTime','arrivalTime'].forEach(k=>{if(l[k])n+=.5;}));
  return n;
}
function parseComplete(p){
  if(!p)return false;
  if(p.type==='hotel')return!!(p.hotelName&&p.date&&(p.dateTo||p.nights)&&p.cost);
  if(p.type==='flight'&&p.legs&&p.legs.length)return p.legs.every(l=>l.flightNumber&&l.date&&l.from&&l.to&&l.departureTime);
  // Activities and transport: what it is, when, and a reference or price
  return!!((p.title||p.provider||p.hotelName)&&p.date&&(p.cost||p.pnr));
}
// Read an image. Small text (desktop screenshots) is read again enlarged, which fixes misread letters and digits
// ("T5KQ8M" read as "TSKQ8M"); if key details are still missing, it's read again reduced, which recovers very
// large headline numbers. The reading that gives the most of the booking wins (ties go to the sharper one).
async function ocrImage(src,onStep){
  const bmp=await createImageBitmap(src);
  const pass=async sc=>{
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
    const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,c.width,c.height);
    const r=await Tesseract.recognize(c,'eng',{tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
    const hs=(r.data.words||[]).filter(w=>/[A-Za-z0-9]{2}/.test(w.text)).map(w=>w.bbox.y1-w.bbox.y0).sort((a,b)=>a-b);
    const text=ocrLayoutText(r.data)||r.data.text||'';let p=null;try{p=parseBookingText(text);}catch(e){}
    return{text,p,score:parseScore(p),h:hs.length?hs[hs.length>>1]:30};
  };
  let best=await pass(1);
  if(best.h<22&&bmp.width*bmp.height<6e6){
    if(onStep)onStep();
    const up=await pass(Math.min(3,30/best.h));
    if(up.score>=best.score)best=up;
  }
  if(!parseComplete(best.p)&&bmp.width>=900){
    if(onStep)onStep();

    if(down.score>best.score)best=down;
  }

async function runOCR(file,id){
  const p=document.getElementById('op-'+id),r=document.getElementById('or-'+id);
  loadScanRules();
  p.style.display='flex';p.innerHTML='<div class="spinner"></div> Processing…';r.style.display='none';
  try{
    let txt='';
    if(file.type==='application/pdf'){
      // Try PDF.js text extraction first (much more accurate than OCR)
      p.innerHTML='<div class="spinner"></div> Extracting text from PDF…';
      if(typeof pdfjsLib==='undefined'){initPdfJs();await new Promise(r2=>setTimeout(r2,1000));}
      if(typeof pdfjsLib!=='undefined'){
        const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
        let lined='';
        for(let i=1;i<=Math.min(pdf.numPages,10);i++){
          p.innerHTML=`<div class="spinner"></div> Reading page ${i}/${pdf.numPages}…`;
          const pg=await pdf.getPage(i);
          const tc=await pg.getTextContent();
          const pageTxt=pdfJoin(tc.items);
          txt+=pageTxt+'\n\n';lined+=pdfLines(tc.items)+'\n\n';
        }
        // The page as one run of text suits some layouts; the page's real lines suit others
        // ("Mar 07" above "Check In", a hotel name on its own line). Keep whichever reads more of the booking.
        // Both readings must agree on what kind of booking it is, unless only the lines give a complete one
        try{const a=parseBookingText(txt),b=parseBookingText(lined);
          if(a.type===b.type?parseScore(b)>parseScore(a):(!parseComplete(a)&&parseComplete(b)))txt=lined;}catch(e){}
        // If text extraction got very little, fall back to OCR
        if(txt.replace(/\s/g,'').length<30){
          txt='';
          p.innerHTML='<div class="spinner"></div> Text extraction sparse, trying OCR…';
          for(let i=1;i<=Math.min(pdf.numPages,10);i++){
            p.innerHTML=`<div class="spinner"></div> OCR page ${i}/${pdf.numPages}…`;
            const pg=await pdf.getPage(i),vp=pg.getViewport({scale:2.5}),cv=document.createElement('canvas');
            cv.width=vp.width;cv.height=vp.height;
            await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
            if(typeof Tesseract!=='undefined'){const r2=await Tesseract.recognize(cv,'eng',{tessedit_pageseg_mode:'6'});txt+=r2.data.text+'\n\n';}
          }
        }
      }else{txt='PDF.js not loaded. Try again in a moment.';}
    }else if(file.type.startsWith('image/')){
      p.innerHTML='<div class="spinner"></div> Running OCR on image…';
      if(typeof Tesseract!=='undefined'){
        // Use higher quality settings for screenshots
        txt=await ocrImage(file,()=>{p.innerHTML='<div class="spinner"></div> Reading again at a different size…';});
      }else{txt='Tesseract not loaded yet. Try again in a moment.';}
    }else{txt='Unsupported file type: '+file.type;}
    r.textContent=txt.trim()||'No text detected.';r.style.display='block';
    p.innerHTML='✓ Done — '+file.name;
    // Store for debugging
    window._lastOCRText=txt.trim();
    // Auto-fill form fields if inside a modal
    if(txt.trim())autoFillForm(txt.trim(),id);
    if(txt.trim()&&window._suDocHook)window._suDocHook(id,txt.trim(),file.name||'Pasted screenshot');
  }catch(e){p.innerHTML='Error: '+e.message;console.error('OCR error:',e);r.style.display='none';}
}

// Add Flight / Hotel / Activity / Transport scans work like Smart Upload: each document is read the same way

function autoFillForm(txt,dzId){

  const docs=m._scanDocs||(m._scanDocs=[]);const doc={name:'Scan',txt,parsed};docs.push(doc);

function formScanNote(m,dzId,html,warn){
  let el=m.querySelector('.su-ai.form-note');

const FORM_KIND={flight:'Add Flight',hotel:'Add Hotel',activity:'Add Activity',transport:'Add Transport'};
function formScanFill(m,dzId){
  const docs=m._scanDocs||[];const parsed=suMergeDocs(docs);if(!parsed)return;

  const other=parsed.type&&parsed.type!==kind&&parseScore(parsed)>=3&&(parsed.type==='flight'||parsed.type==='hotel'||kind==='flight'||kind==='hotel');
  if(other){formScanNote(m,dzId,`This looks like a <b>${parsed.type}</b> booking. Use <b>${FORM_KIND[parsed.type]}</b> or <b>Scan</b> (Smart Upload) to add it.`,true);return;}

// ===== SMART UPLOAD =====
const SU_LABELS={airline:'Airline',flightNumber:'Flight #',pnr:'PNR',seat:'Seat',from:'From',to:'To',date:'Date',dateTo:'End Date',departureTime:'Departure',arrivalTime:'Arrival',duration:'Duration',hotelName:'Hotel',name:'Name',bookingNumber:'Booking #',cost:'Cost',currency:'Currency',locations:'Locations'};
function suFieldHtml(k,v){
  const label=SU_LABELS[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase());
  const val=Array.isArray(v)?v.join(', '):String(v||'');
  const cls=val?'detected':'empty';
  return `<div class="su-field"><span class="k">${label}</span><span class="v ${cls}">${val?esc(val):'Not detected'}</span></div>`;
}
function suParsedHtml(parsed){
  let h='<h4><span style="color:var(--green)">✓</span> Extracted Data</h4>';
  if(parsed.multiLeg&&parsed.legs){
    h+=suFieldHtml('Type','Multi-segment flight ('+parsed.legs.length+' legs)');
    h+=suFieldHtml('pnr',parsed.pnr);h+=suFieldHtml('airline',parsed.airline);
    h+=suFieldHtml('date',(parsed.date||'')+' → '+(parsed.dateTo||parsed.date||''));
    parsed.legs.forEach((leg,i)=>{
      h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600;font-size:11px;color:var(--primary)">Leg ${i+1}: ${esc(leg.flightNumber||'')}</span></div>`;
      h+=suFieldHtml('Route',(leg.from||'?')+' → '+(leg.to||'?'));
      if(leg.date)h+=suFieldHtml('date',leg.date);
      if(leg.departureTime)h+=suFieldHtml('departureTime',leg.departureTime);
      if(leg.arrivalTime)h+=suFieldHtml('arrivalTime',leg.arrivalTime);
      if(leg.seat)h+=suFieldHtml('seat',leg.seat);
      if(leg.duration)h+=suFieldHtml('duration',leg.duration);
    });
  }else{
    const order=['airline','flightNumber','hotelName','name','from','to','date','dateTo','departureTime','arrivalTime','pnr','seat','duration','bookingNumber','cost','currency','locations'];
    const shown=new Set();
    order.forEach(k=>{if(parsed[k]){h+=suFieldHtml(k,parsed[k]);shown.add(k);}});
    Object.entries(parsed).filter(([k,v])=>v&&!shown.has(k)&&k!=='rawText'&&k!=='type'&&k!=='multiLeg'&&k!=='legs').forEach(([k,v])=>{h+=suFieldHtml(k,v);});
  }
  if(parsed.rawText)h+=`<button class="su-raw-toggle" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='none'?'block':'none';this.textContent=el.style.display==='none'?'Show raw text ▸':'Hide raw text ▾'">Show raw text ▸</button><div class="ocr-out" style="display:none;margin-top:4px">${esc(parsed.rawText)}</div>`;
  return h;
}
// Normalise "2:30 pm" / "9:05" / "14:30" → "HH:MM" (24h); '' if unparseable
function suTime24(t){
  const m=String(t||'').trim().match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);if(!m)return '';
  let h=parseInt(m[1]);const ap=(m[3]||'').toLowerCase();
  if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
  return h>23?'':String(h).padStart(2,'0')+':'+m[2];
}
// Flights detected in a parsed document → editable leg rows
function suLegsFromParsed(p){
  if(p.multiLeg&&p.legs&&p.legs.length)return p.legs.map(l=>({airline:l.airline||p.airline||'',duration:l.duration||'',fn:l.flightNumber||'',from:l.from||'',to:l.to||'',date:l.date||'',time:suTime24(l.departureTime),adate:l.arrivalDate||l.date||'',atime:suTime24(l.arrivalTime),seat:l.seat||'',pnr:l.pnr||'',cost:l.cost||'',currency:l.currency||''}));
  return [{airline:p.airline||'',fn:p.flightNumber||'',from:p.from||'',to:p.to||'',date:p.date||'',time:suTime24(p.departureTime),adate:p.dateTo||p.date||'',atime:suTime24(p.arrivalTime),seat:p.seat||''}];
}
// Suggested event name/locations: for round trips, the destination is where the longest stay happens
function suTripInfo(legs){
  const L=legs.filter(l=>l.from||l.to);if(!L.length)return{name:'',locations:[]};
  const home=L[0].from,round=L.length>=2&&home&&L[L.length-1].to===home;
  let dest=L[L.length-1].to||L[0].to;
  if(round){
    const ts=(d,t)=>d?new Date(d+'T'+(t||'00:00')).getTime():NaN;
    let best=-1;
    for(let i=0;i<L.length-1;i++){const gap=ts(L[i+1].date,L[i+1].time)-ts(L[i].adate||L[i].date,L[i].atime);if(gap>best){best=gap;dest=L[i].to;}}
  }
  const locs=[...new Set(L.flatMap(l=>[l.from,l.to]).filter(c=>c&&c!==home))];
  return{name:dest?dest+' Trip':'',locations:locs.length?locs:[dest].filter(Boolean)};
}
function suLegRowHtml(l){
  l=l||{};
  const f=(n,v,ph,type)=>`<label class="su-lf"><span>${ph}</span><input class="fc" ${type?`type="${type}"`:''} data-k="${n}" value="${esc(v||'')}"${n==='from'||n==='to'?' list="location-list" autocomplete="off"':''}></label>`;
  return `<div class="su-leg" data-airline="${esc(l.airline||'')}" data-duration="${esc(l.duration||'')}" data-pnr="${esc(l.pnr||'')}" data-cost="${esc(l.cost||'')}" data-currency="${esc(l.currency||'')}">
    <div class="su-leg-head"><span class="su-leg-n"></span><button type="button" class="btn btn-ghost su-leg-rm" title="Remove this flight">Remove</button></div>
    <div class="su-leg-grid">
      ${f('fn',l.fn,'Flight #')}${f('from',l.from,'From')}${f('to',l.to,'To')}${f('seat',l.seat,'Seat')}
      ${f('date',l.date,'Depart date','date')}${f('time',l.time,'Depart time','time')}${f('adate',l.adate,'Arrive date','date')}${f('atime',l.atime,'Arrive time','time')}
    </div>
  </div>`;
}
function suReadLegs(){
  return [...document.querySelectorAll('#su-legs .su-leg')].map(r=>{const o={airline:r.dataset.airline||'',duration:r.dataset.duration||'',pnr:r.dataset.pnr||'',cost:r.dataset.cost||'',currency:r.dataset.currency||''};r.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());return o;}).filter(l=>l.fn||l.from||l.to);
}
// Date span covered by the legs (or by a non-flight booking)
function suSpan(type,parsed){
  if(type==='flight'){
    const legs=suReadLegs(),ds=legs.map(l=>l.date).filter(Boolean).sort(),es=legs.map(l=>l.adate||l.date).filter(Boolean).sort();
    return{start:ds[0]||'',end:es[es.length-1]||ds[ds.length-1]||''};
  }
  return{start:parsed.date||'',end:parsed.dateTo||parsed.date||''};
}
// Pick the existing event whose dates best cover the booking (±3 days for positioning flights)
function suMatchEvent(start,end){
  if(!start)return null;
  const day=d=>new Date(d+'T00:00:00').getTime(),buf=3*864e5,bs=day(start),be=day(end||start);
  let best=null,bestScore=-Infinity;
  for(const ev of S.events){
    if(ev.source==='apple'||!ev.startDate)continue;
    const es=day(ev.startDate),ee=day(ev.endDate||ev.startDate);
    if(be<es-buf||bs>ee+buf)continue;
    const overlap=Math.min(be,ee)-Math.max(bs,es);// >0 = real overlap; negative = gap within buffer
    if(overlap>bestScore){bestScore=overlap;best=ev;}
  }
  return best;
}
function suRefresh(parsed,opts){

  hint.innerHTML=mev?`Dates match <b>${esc(mev.name)}</b> (${fmtS(mev.startDate)} – ${fmtS(mev.endDate)}). Choose “Create New Event” to keep it separate.`:'';
  hint.style.display=mev?'':'none';

  const nm=document.getElementById('su-ev-name'),sd=document.getElementById('su-ev-sd'),ed=document.getElementById('su-ev-ed');
  if(!sd.dataset.touched)sd.value=span.start;
  if(!ed.dataset.touched)ed.value=span.end;
  if(!nm.dataset.touched)nm.value=type==='flight'?(suTripInfo(suReadLegs()).name||parsed.name||'New Event'):(parsed.name||'New Event');
  const n=document.querySelectorAll('#su-legs .su-leg').length;
  document.querySelectorAll('#su-legs .su-leg-n').forEach((el,i)=>el.textContent=n>1?'Flight '+(i+1):'Flight');

}
function suShowResult(parsed){

function suRenderBody(parsed){
  const type=document.getElementById('su-type').value;

  if(type!=='flight'){box.innerHTML=suParsedHtml(parsed);return;}
  const legs=suLegsFromParsed(parsed);

    <div class="fg" style="margin-top:12px">
      <div class="fi"><label>Booking total</label><input class="fc" type="number" step="0.01" id="su-cost" value="${esc(cost)}"${perLeg.length?` placeholder="Per flight" disabled title="Each flight keeps its own cost: ${esc(perLeg.map(l=>l.fn+' '+(l.currency||'')+' '+l.cost).join(', '))}"`:''}></div>

// Several documents for one booking (e.g. OTA receipt + e-ticket) → one parsed result.
// Flights are matched by flight number; each document fills in what the others lack.
function suMergeDocs(docs){
  const ps=docs.map(d=>d.parsed).filter(Boolean);
  if(!ps.length)return null;
  const rawText=docs.map(d=>docs.length>1?`----- ${d.name} -----\n${d.txt}`:d.txt).join('\n\n');
  const flights=ps.filter(p=>p.type==='flight');
  // No flights (e.g. a hotel confirmation + its rate page): combine them, each document filling what the others lack
  if(!flights.length){
    if(ps.length===1)return{...ps[0],rawText};
    const kinds=ps.map(p=>p.type),type=['hotel','activity','transport'].find(k=>kinds.includes(k))||ps[0].type;
    const same=ps.filter(p=>p.type===type),rest=ps.filter(p=>p.type!==type),order=[...same,...rest];
    const out={type};
    for(const f of ['hotelName','bookingNumber','pnr','date','dateTo','roomType','nights','title','provider','transportType','departureTime','arrivalTime'])
      for(const p of order)if(p[f]&&!out[f]){out[f]=p[f];}
    out.locations=[...new Set(order.flatMap(p=>p.locations||[]))];
    // A real document name beats the fallbacks ("Hotel Booking", "Uploaded Booking")
    const fallback=/^(?:Hotel Booking|Uploaded Booking|.+ Hotel)$/;
    out.name=(order.find(p=>p.name&&!fallback.test(p.name))||order[0]).name;
    if(out.hotelName)out.name=out.hotelName;
    // The largest amount is the booking total (a rate page has per-night and total figures)
    const costed=ps.filter(p=>p.cost&&!isNaN(parseFloat(p.cost))).sort((a,b)=>parseFloat(b.cost)-parseFloat(a.cost));
    if(costed[0]){out.cost=costed[0].cost;out.currency=costed[0].currency;}
    if(!out.nights&&out.date&&out.dateTo)out.nights=Math.round((new Date(out.dateTo)-new Date(out.date))/864e5);
    return{...out,rawText};
  }
  const asLegs=p=>p.multiLeg&&p.legs?p.legs:[{airline:p.airline,flightNumber:p.flightNumber,from:p.from,to:p.to,date:p.date,departureTime:p.departureTime,arrivalDate:p.dateTo,arrivalTime:p.arrivalTime,seat:p.seat}];
  const key=l=>{const fn=(l.flightNumber||'').replace(/\s+/g,'').toUpperCase().replace(/^([A-Z0-9]{2})0+(?=\d)/,'$1');return fn||((l.from||'')+'>'+(l.to||'')+'@'+(l.date||''));};
  const byKey=new Map();
  for(const p of flights)for(const l of asLegs(p)){
    if(!l.flightNumber&&!l.from&&!l.to)continue;
    const k=key(l),cur=byKey.get(k);
    if(!cur){byKey.set(k,{...l});continue;}
    // A document with times is the more detailed schedule: take its date/time group together
    if(!cur.departureTime&&l.departureTime)Object.assign(cur,{date:l.date||cur.date,departureTime:l.departureTime,arrivalDate:l.arrivalDate||cur.arrivalDate,arrivalTime:l.arrivalTime||cur.arrivalTime});
    for(const f of ['airline','flightNumber','from','to','date','arrivalDate','arrivalTime','seat','duration','pnr'])if(!cur[f]&&l[f])cur[f]=l[f];
    if(/^\d+$/.test(cur.pnr||'')&&/[A-Z]/.test(l.pnr||''))cur.pnr=l.pnr;// airline PNR beats an OTA booking number
  }
  const legs=[...byKey.values()].sort((a,b)=>((a.date||'9')+(a.departureTime||'')).localeCompare((b.date||'9')+(b.departureTime||'')));
  // Airline PNR (letters+digits) beats an OTA's numeric booking number; the largest amount is the booking total
  const pnrs=ps.map(p=>p.pnr).filter(Boolean);
  const pnr=pnrs.find(x=>/^[A-Z0-9]{5,8}$/.test(x)&&/[A-Z]/.test(x))||pnrs[0]||'';
  const costed=ps.filter(p=>p.cost&&!isNaN(parseFloat(p.cost)));
  const best=costed.sort((a,b)=>parseFloat(b.cost)-parseFloat(a.cost))[0];
  const ds=legs.map(l=>l.date).filter(Boolean).sort(),es=legs.map(l=>l.arrivalDate||l.date).filter(Boolean).sort();
  const first=legs[0]||{},last=legs[legs.length-1]||{};
  return{type:'flight',multiLeg:true,legs,pnr,airline:first.airline||flights[0].airline||'',cost:best?best.cost:'',currency:best?best.currency:(flights[0].currency||''),
    date:ds[0]||'',dateTo:es[es.length-1]||'',from:first.from||'',to:last.to||'',locations:[...new Set(legs.flatMap(l=>[l.from,l.to]).filter(Boolean))],name:flights[0].name||'',rawText};
}
function suRenderDocs(){
  const box=document.getElementById('su-docs');if(!box)return;
  const docs=window._suDocs||[];
  box.innerHTML=docs.length?`<div class="su-docs-h">${docs.length} document${docs.length>1?'s':''} combined</div>`+docs.map((d,i)=>`<span class="su-doc">📄 ${esc(d.name)}<button type="button" class="su-doc-x" data-doc="${i}" title="Remove this document">×</button></span>`).join('')+`<div class="su-docs-tip">Booked through an agent? Add the e-ticket and the receipt — they're merged into one booking.</div>`:'';
}
function suAddDoc(name,txt){
  const parsed=parseBookingText(txt);if(!parsed)return;
  parsed.rawText=txt;
  const doc={name,txt,parsed};
  (window._suDocs=window._suDocs||[]).push(doc);
  suRefreshDocs();
  suMaybeAi(doc);
}
// Rules came up short (and the documents together don't complete the booking either): ask the AI
function suMaybeAi(doc){return scanAiForDoc(doc,window._suDocs||[],suAiNote,suRefreshDocs);}
// Shared by Smart Upload and the Add forms: if the rules (and the other documents) don't complete the booking, the AI reads this one
async function scanAiForDoc(doc,docs,note,done){
  if(parseComplete(doc.parsed)||parseComplete(suMergeDocs(docs)))return;
  if(!acctEnabled()||!_acct||!navigator.onLine)return;
  note('<span class="spinner"></span> Unfamiliar layout: reading it with AI…');
  const res=await aiRead(doc.txt);
  if(!docs.includes(doc))return;// removed meanwhile
  if(!res){note('');return;}
  if(res.error){note(esc(res.error),true);return;}
  doc.parsed={...mergeAiParsed(doc.parsed,res.parsed),rawText:doc.txt};doc.ai=true;
  done();
  note('✓ Read with AI'+(res.learned?'. This layout is now learned, so next time it\'s read without AI':'')+(res.remaining!=null?` · ${res.remaining} AI read${res.remaining===1?'':'s'} left today`:'')+'. Please check the details.');
}
function suAiNote(html,warn){
  let el=document.getElementById('su-ai');const box=document.getElementById('su-parsed');
  if(!el&&box){el=document.createElement('div');el.id='su-ai';el.className='su-ai';box.insertAdjacentElement('beforebegin',el);}
  if(!el)return;el.innerHTML=html;el.style.display=html?'':'none';el.classList.toggle('warn',!!warn);
}
function suRefreshDocs(){
  const docs=window._suDocs||[];
  suRenderDocs();
  const dzP=document.querySelector('#su-result')?.closest('.modal')?.querySelector('.dz p');
  if(dzP)dzP.textContent=docs.length?'Drop another document for this booking':'Drop files or paste a screenshot here';
  if(!docs.length){document.getElementById('su-result').style.display='none';window._suParsed=null;return;}
  suShowResult(suMergeDocs(docs));
}

function tzForPlace(city){
  if(!city)return '';

  const c=String(city).toLowerCase();
  for(const[code,name]of Object.entries(AIRPORTS))if(name.toLowerCase()===c&&AIRPORT_TZ[code])return AIRPORT_TZ[code];

}

}

function parseDate(str,yearHint){
  const curYear=yearHint||new Date().getFullYear();
  let m;
  // "26 May 2026" / "11 SEP 2026"
  if((m=str.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{4})/i)))
    return `${m[3]}-${MMAP[m[2].toLowerCase().slice(0,3)]}-${m[1].padStart(2,'0')}`;
  // "Mon, 25 May" / "FRIDAY 11 SEP"
  if((m=str.match(/(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*[,.]?\s*(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i))){
    const mm=MMAP[m[2].toLowerCase().slice(0,3)];
    let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
    return `${yr}-${mm}-${m[1].padStart(2,'0')}`;
  }
  // "27 Aug" / "01 Sep" / "27 Aug (Thu)" — day-first without year (common in intl bookings)
  if((m=str.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(?:\w*)?(?:\s*\(\w+\))?/i))&&!str.match(/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{4}/i)){
    const mm=MMAP[m[2].toLowerCase().slice(0,3)];
    let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m[1]));if(td2<new Date(Date.now()-90*864e5))yr++;
    return `${yr}-${mm}-${m[1].padStart(2,'0')}`;
  }
  // "May 26" / "Sep 23"
  if((m=str.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*[,.]?\s*(\d{1,2})/i))){
    const mm=MMAP[m[1].toLowerCase().slice(0,3)];
    let yr=curYear;const td2=new Date(yr,parseInt(mm)-1,parseInt(m[2]));if(td2<new Date(Date.now()-90*864e5))yr++;
    return `${yr}-${mm}-${m[2].padStart(2,'0')}`;
  }
  // "2026-09-11"
  if((m=str.match(/(\d{4})-(\d{2})-(\d{2})/)))return m[0];
  return null;
}

function findAirports(str){
  // Codes are printed in capitals: "you can" and "Add to calendar" aren't CAN and ADD
  const t=str,found=[];
  for(const[code,city]of Object.entries(AIRPORTS)){
    const re=new RegExp('\\b'+code+'\\b','g');let m;
    while((m=re.exec(t))!==null)found.push({code,city,pos:m.index});
  }
  return found.sort((a,b)=>a.pos-b.pos);
}

function _splitPositions(txt,pat){
  const positions=[];let m;
  while((m=pat.exec(txt))!==null)positions.push(m.index);
  return positions;
}
function _segmentsFromPositions(txt,positions){
  const segments=[];
  for(let i=0;i<positions.length;i++){
    const start=positions[i];
    const end=i+1<positions.length?positions[i+1]:txt.length;
    segments.push(txt.substring(start,end));
  }
  return segments;
}
const _FNCODES=Object.keys(AIRLINE_MAP).map(c=>c.replace(/([.*+?^${}()|[\]\\])/g,'\\$1')).join('|');
// Word-boundary airline name matching (prevents "MANAGE" matching "ANA" etc.)
function _matchAirlineName(text){
  const t=text.toUpperCase();
  for(const al of AIRLINE_NAMES){
    const esc=al.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
    if(new RegExp('\\b'+esc+'\\b').test(t))return al;
  }
  return '';
}
function _tryDirectExtract(txt){
  const routeLinePat=new RegExp('\\b('+_FNCODES+')\\s*(\\d{3,5})\\s+([A-Z]{3})\\s*[-–—]\\s*([A-Z]{3})\\b','g');
  const routeLines=[];let rlm;
  while((rlm=routeLinePat.exec(txt))!==null){
    const fn=(rlm[1]+rlm[2]).replace(/\s/g,'');
    if(AIRPORTS[rlm[3]]&&AIRPORTS[rlm[4]]&&!routeLines.some(r2=>r2.fn===fn)){
      const lineEnd=txt.indexOf('\n',rlm.index);
      const lineText=txt.substring(rlm.index,lineEnd>0?lineEnd:rlm.index+200);
      routeLines.push({fn,code:rlm[1],from:rlm[3],to:rlm[4],pos:rlm.index,lineText});
    }
  }
  if(routeLines.length<2)return null;
  let pnr2='';
  const pnrM2=txt.match(/(?:PNR|RESERVATION\s*CODE|Booking\s*(?:Ref(?:erence)?|No\.?|Number|ID|Code)|Confirmation\s*(?:Number|Code|#))\s*[:#]?\s*([A-Z0-9]{4,10})/i);
  if(pnrM2)pnr2=pnrM2[1];
  const ga=_matchAirlineName(txt);
  const yrM2=txt.match(/\b(20[2-3]\d)\b/);
  const yh=yrM2?parseInt(yrM2[1]):new Date().getFullYear();
  const directLegs=[];
  for(const rl of routeLines){
    const leg={};
    leg.flightNumber=rl.fn;
    leg.from=AIRPORTS[rl.from];leg.fromCode=rl.from;
    leg.to=AIRPORTS[rl.to];leg.toCode=rl.to;
    leg.airline=AIRLINE_MAP[rl.code]||ga;
    leg.pnr=pnr2;
    const seatM=rl.lineText.match(/\b(\d{1,3}[A-HJ-K])\b/);
    if(seatM)leg.seat=seatM[1];
    const bagM=rl.lineText.match(/(\d+)\s*kg/i);
    if(bagM)leg.baggage=bagM[1]+'kg';
    const depTimeAll=[];const arrTimeAll=[];
    const depRe=new RegExp('\\b'+rl.from+'\\s+(\\d{1,2}:\\d{2})','g');
    let dtm;while((dtm=depRe.exec(txt))!==null)depTimeAll.push(dtm[1]);
    const arrRe=new RegExp('\\b'+rl.to+'\\s+(\\d{1,2}:\\d{2})','g');
    while((dtm=arrRe.exec(txt))!==null)arrTimeAll.push(dtm[1]);
    const legIdx=directLegs.length;
    if(depTimeAll.length>legIdx)leg.departureTime=depTimeAll[legIdx];
    else if(depTimeAll.length>0)leg.departureTime=depTimeAll[0];
    if(arrTimeAll.length>legIdx)leg.arrivalTime=arrTimeAll[legIdx];
    else if(arrTimeAll.length>0)leg.arrivalTime=arrTimeAll[0];
    const datePatAll=[];
    const dpRe=/(\d{1,2})\s+(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\b/gi;
    let dpm;while((dpm=dpRe.exec(txt))!==null){const pd=parseDate(dpm[0],yh);if(pd)datePatAll.push(pd);}
    const uniqueDates=[...new Set(datePatAll)].sort();
    if(uniqueDates.length>0){
      if(legIdx===0)leg.date=uniqueDates[0];
      else if(uniqueDates.length>1){
        const laterDates=uniqueDates.filter(d=>d>directLegs[0].date);
        leg.date=laterDates.length>0?laterDates[0]:uniqueDates[uniqueDates.length-1];
      }else leg.date=uniqueDates[0];
    }
    if(leg.arrivalTime&&leg.departureTime&&leg.date){
      const depH=parseInt(leg.departureTime);const arrH=parseInt(leg.arrivalTime);
      if(arrH<depH){const laterDates=uniqueDates.filter(d=>d>leg.date);if(laterDates.length>0)leg.arrivalDate=laterDates[0];}
    }
    const durPats=[/(\d+)\s*h(?:(?:ou)?rs?)?\s*(\d+)\s*m(?:in)?s?/gi];
    for(const dp2 of durPats){
      const durAll=[];let dum;
      while((dum=dp2.exec(txt))!==null)durAll.push(dum[1]+'h '+dum[2]+'m');
      if(durAll.length>legIdx)leg.duration=durAll[legIdx];
      else if(durAll.length>0&&legIdx>0)leg.duration=durAll[durAll.length-1];
      else if(durAll.length>0)leg.duration=durAll[0];
    }
    leg.name=`${leg.airline||''} ${leg.flightNumber}`.trim()+` (${leg.fromCode} → ${leg.toCode})`;
    directLegs.push(leg);
  }
  return directLegs.length>=2?directLegs:null;

function dedupeLines(txt){
  // Times like "10 ∶ 20" (ratio sign) in some OTA PDFs
  txt=txt.replace(/\u0000/g,'').replace(/(\d{1,2})\s*[∶꞉]\s*(\d{2})/g,'$1:$2');
  // Some PDF extractors (e.g. Malaysia Airlines) repeat each phrase 3-4x on one line: "14:35 14:35 14:35 14:35"
  txt=txt.replace(/(\S(?:[^\n]{0,80}?\S)?)(?:[ \t]+\1){2,}(?=\s|$)/g,'$1');
  // …or repeat each line 2-4x
  const lines=txt.split('\n');const out=[];
  for(let i=0;i<lines.length;i++){

    }
    // ISO dates
    const dp4=/(\d{4})-(\d{2})-(\d{2})/g;
    while((m2=dp4.exec(dateSrc))!==null){const ds=m2[0];if(!foundDates.includes(ds))foundDates.push(ds);}
    // "10 AUG , 2026" format (with comma between month and year)
    const dp5=/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s*,?\s*(\d{4})/gi;
    while((m2=dp5.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){const ds=`${m2[3]}-${mm}-${m2[1].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}
    const uniqueDates=[...new Set(foundDates)].sort();
    if(uniqueDates.length>=1)r.date=uniqueDates[0];
    if(uniqueDates.length>=2&&!r.dateTo)r.dateTo=uniqueDates[uniqueDates.length-1];
    // "Oct 10, 2026" style, ignoring booking/payment/issue dates
    if(!r.date){
      const clean=dateSrc.replace(/(?:Booking\s*(?:on|date)|Booked\s*on|Payment\s*(?:received|date)|(?:E-?receipt\s*)?issued|Issue\s*date|Date\s*of\s*issue|Order\s*date)\s*[:：]?\s*[^\n]{0,30}?\d{4}/gi,' ');
      const ds=_findDates(clean);if(ds[0])r.date=ds[0].date;
    }
  }

  // ===== 9. Times (flights only) =====
  if(r.type==='flight'){
    // Try structured patterns first
    const depTimeM=txt.match(/(?:Depart(?:ing|ure)?\s*(?:At|Time)?\s*[:#]?\s*|DEPARTING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    const arrTimeM=txt.match(/(?:Arriv(?:al|ing)\s*(?:At|Time)?\s*[:#]?\s*|ARRIVING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    if(depTimeM)r.departureTime=depTimeM[1].trim();
    if(arrTimeM)r.arrivalTime=arrTimeM[1].trim();
    // Airport-code-prefixed times: "DPS 12:10" / "SIN 14:55" (SQ e-ticket format)
    if(!r.departureTime&&r.fromCode){const acM=txt.match(new RegExp(r.fromCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)r.departureTime=acM[1];}
    if(!r.arrivalTime&&r.toCode){const acM=txt.match(new RegExp(r.toCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)r.arrivalTime=acM[1];}
    // Fallback: first two times in text
    if(!r.departureTime){
      const times=[];const seenT=new Set();let m2;
      const tp=/\b(\d{1,2}:\d{2}\s*(?:am|pm)?)\b/gi;
      while((m2=tp.exec(txt))!==null){const v=m2[1].trim();const h=parseInt(v);if(h>=0&&h<=23&&!seenT.has(v)){times.push(v);seenT.add(v);}}
      if(times.length>=1)r.departureTime=times[0];
      if(times.length>=2)r.arrivalTime=times[1];
    }
  }

  // ===== 10. Cost — with currency symbol mapping =====
  _extractCost(txt.replace(/\$\$(?=\s?\d)/g,'S$'),r);

  if(!r.cost)_totalFallback(txt,r);
  _yenOrYuan(txt,r);
  ['date','dateTo'].forEach(k=>{if(r[k]&&/-00$|-00-/.test(r[k]))delete r[k];});

  // ===== 11. Hotel extras: room type, nights =====
  if(r.type==='hotel'){
    const nightsM=txt.match(/(\d+)\s*nights?\b/i);if(nightsM)r.nights=parseInt(nightsM[1]);
    const roomM=txt.match(/\d+\s*nights?,\s*(.+?)(?:\n|$)/i);if(roomM)r.roomType=roomM[1].trim().slice(0,60);
    if(!r.roomType){const lt=txt.match(/(?:^|\n|\s{2,})Room\s*[Tt]ype\s*[:：]?\s+([A-Z][^\n]{2,60}?)(?:\s{2,}|\n|$)/);if(lt)r.roomType=lt[1].trim();}
    if(!r.roomType){const rt=txt.match(/\b((?:Deluxe|Superior|Standard|Classic|Premier|Executive|Family|Double|Twin|Single|Triple|Quad|King|Queen|Budget|Economy|Garden|Pool|Ocean|Sea)(?:[ \t]+[A-Z][a-z]+){0,3}[ \t]+(?:Room|Suite|Villa|Bungalow|Studio|Cabin|Dorm))\b/);if(rt)r.roomType=rt[1];}
    // Check-in and check-out decide the nights (a stray number near "Nights", like "Mar 11", doesn't)
    if(r.date&&r.dateTo){const n=Math.round((new Date(r.dateTo)-new Date(r.date))/864e5);if(n>0&&n<90)r.nights=n;}
  }

  // ===== 12. Flight duration =====
  if(r.type==='flight'){const durM=txt.match(/(?:Duration|Non-stop)\s*[,:.]?\s*(\d+)\s*h(?:rs?|ours?)?\s*(\d+)\s*m(?:in)?/i);
    if(durM)r.duration=durM[1]+'h '+durM[2]+'m';}

  // ===== 13. Build display name =====
  if(r.type==='flight')r.name=r.airline?`${r.airline} ${r.flightNumber||'Flight'}`+(r.from&&r.to?` (${r.from} → ${r.to})`:''):(r.from&&r.to?`${r.from} → ${r.to}`:'Flight');
  else if(r.type==='hotel')r.name=r.hotelName||(r.locations.length?r.locations[0]+' Hotel':'Hotel Booking');
  else if(r.type==='transport')r.name=r.provider||r.title||r.locations.join(' → ')||'Uploaded Booking';
  else r.name=r.title||r.locations.join(' → ')||'Uploaded Booking';
  return r;
}

// A date field's change handler that waits until the picker is closed on touch screens
function whenPicked(el,fn){
  if(!/^(date|time|datetime-local|month)$/.test(el.type)||!matchMedia('(pointer:coarse)').matches)return fn;
  let pending=false;
  el.addEventListener('blur',()=>{if(pending){pending=false;fn();}});
  return()=>{if(document.activeElement===el)pending=true;else fn();};
}
