// A. Trip.com-style blocks (Batik Air, Citilink, Lion group…)
function _layoutTripBlocks(txt){
  const re=/([A-Z][A-Za-z .'()]{1,45}?)\s+-\s+([A-Z][A-Za-z .'()]{1,30}?)(?:\s+\d{1,2})?\s+Departure\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?),\s*([A-Za-z]+\s+\d{1,2},\s*\d{4}),\s*([\s\S]*?)\s+Arrival\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?),\s*([A-Za-z]+\s+\d{1,2},\s*\d{4}),\s*([\s\S]*?)\s+(?:\d\s+)?Airline\s+([A-Za-z .]+?)\s+([A-Z0-9]{2})\s?(\d{1,4})\b/g;
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    const leg={fromCode:_cityCode(m[5])||_cityCode(m[1]),toCode:_cityCode(m[8])||_cityCode(m[2]),departureTime:_hhmm(m[3]),arrivalTime:_hhmm(m[6])};
    if(!leg.fromCode)leg.from=m[1].trim().split(/\s+/).slice(-1)[0];
    if(!leg.toCode)leg.to=m[2].trim();
    const dd=_findDates(m[4]),ad=_findDates(m[7]);
    if(dd[0])leg.date=dd[0].date;if(ad[0])leg.arrivalDate=ad[0].date;
    leg.airline=_matchAirlineName(m[9])||m[9].trim();
    legs.push(_finishLeg(leg,{code:m[10],num:m[11]}));
  }
  return legs;
}
// B. "SIN 07:50 > SUB 09:10" route lines (Singapore Airlines e-ticket / PDF / email)
function _layoutCodeTime(txt){
  const re=/\b([A-Z]{3})\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\s*(?:>|→|-|–|—)?\s*(?:[A-Z][a-z]+\s+){0,3}([A-Z]{3})\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/g;
  const hits=[];let m;
  while((m=re.exec(txt))!==null)if(_isAp(m[1])&&_isAp(m[3])&&m[1]!==m[3])hits.push({m,pos:m.index,end:m.index+m[0].length});
  const al=_docAirlineCode(txt),legs=[];
  hits.forEach((h,i)=>{
    const prevEnd=i?hits[i-1].end:0,nextPos=i+1<hits.length?hits[i+1].pos:txt.length;
    const before=txt.substring(Math.max(prevEnd,h.pos-160),h.pos),after=txt.substring(h.end,Math.min(nextPos,h.end+260));
    const leg={fromCode:h.m[1],toCode:h.m[3],departureTime:_hhmm(h.m[2]),arrivalTime:_hhmm(h.m[4])};
    // Flight number: right before ("SQ 638 SIN 23:55…"), on the same line after, or the "1. SQ922 - …" header
    const lineAfter=after.split('\n')[0];
    const fnBefore=before.match(new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\s*$','i'));
    let fn=fnBefore?{code:fnBefore[1].toUpperCase(),num:fnBefore[2]}:_fnNear(lineAfter,al);
    if(!fn){const hdr=before.match(/\d\s*\.\s*([A-Z$5]{1,2}[A-Z0-9]?\s?[0-9OTIlSBZG]{2,4})\s*[-·.]/);if(hdr)fn=_fnNear(' '+hdr[1],al);}
    // Text after the route line that starts with another flight number belongs to the next flight
    const restAfter=after.substring(lineAfter.length);
    const nextFnAt=restAfter.search(new RegExp('\\b('+_FNCODES+')\\s{0,3}\\d{1,4}\\b'));
    const ownAfter=nextFnAt>=0?lineAfter+restAfter.substring(0,nextFnAt):after;
    if(!fn){const all=[...before.matchAll(new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g'))].filter(x=>!legs.some(l=>l.flightNumber===x[1]+x[2]));if(all.length){const l=all[all.length-1];fn={code:l[1],num:l[2]};}}
    if(!fn)fn=_fnNear(ownAfter,al);
    const ds=_findDates(ownAfter);
    if(ds[0]){leg.date=ds[0].date;if(ds[1])leg.arrivalDate=ds[1].date;}
    else{const db=_findDates(before);if(db.length)leg.date=db[db.length-1].date;}
    const dur=before.match(/(\d{1,2})\s*h(?:rs?|ours?)?\s*(\d{1,2})\s*min/i);if(dur)leg.duration=dur[1]+'h '+dur[2]+'m';
    legs.push(_finishLeg(leg,fn));
  });
  return legs;
}
// C. Scoot app/email card: "SIN CGK" / "18:15 > 19:15" / "Wed, 1 Jul Wed, 1 Jul"
function _layoutScootCard(txt){
  const re=/\b([A-Z]{3})\s+([A-Z]{3})[ \t]*\n[^\n]*?(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)[^\n]*?(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/g;
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    if(!_isAp(m[1])||!_isAp(m[2]))continue;
    const after=txt.substring(m.index+m[0].length,m.index+m[0].length+300);
    const leg={fromCode:m[1],toCode:m[2],departureTime:_hhmm(m[3]),arrivalTime:_hhmm(m[4])};
    const ds=_findDates(after);if(ds[0])leg.date=ds[0].date;if(ds[1])leg.arrivalDate=ds[1].date;
    const dur=after.match(/Duration\s*(\d{1,2})\s*h\s*(\d{1,2}|O)\s*m/i);if(dur)leg.duration=dur[1]+'h '+dur[2].replace('O','0').padStart(2,'0')+'m';
    legs.push(_finishLeg(leg,_fnNear(after)));
  }
  return legs;
}
// D. Time-then-code (Malaysia Airlines, Firefly, AirAsia): "14:35 KUL (T1) Non-Stop 2h 55min 17:30 TWU"
function _layoutTimeCode(txt){
  const re=/(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\s*=?\s*([A-Z]{3})\b([\s\S]{0,220}?)(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\s*=?\s*([A-Z]{3})\b/g;
  const hits=[];let m;
  while((m=re.exec(txt))!==null)if(_isAp(m[2])&&_isAp(m[5])&&m[2]!==m[5])hits.push({m,pos:m.index,end:m.index+m[0].length});
  const legs=[];
  hits.forEach((h,i)=>{
    const prevEnd=i?hits[i-1].end:0,nextPos=i+1<hits.length?hits[i+1].pos:txt.length;
    const before=txt.substring(Math.max(prevEnd,h.pos-450),h.pos),after=txt.substring(h.end,Math.min(nextPos,h.end+300));
    const leg={fromCode:h.m[2],toCode:h.m[5],departureTime:_hhmm(h.m[1]),arrivalTime:_hhmm(h.m[4])};
    let fn=_fnNear(h.m[3]);
    if(!fn){const all=[...before.matchAll(new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g'))];if(all.length){const l=all[all.length-1];fn={code:l[1],num:l[2]};}}
    if(!fn)fn=_fnNear(after.substring(0,120));
    // Date: nearest one before the times (skipping booking/issue dates), else the first after
    const cleanBefore=before.replace(/(?:Booking|Issue|Issued|Purchase)\s*date\s*:?[^\n]{0,30}/gi,m2=>' '.repeat(m2.length));
    const db=_findDates(cleanBefore),da=_findDates(after);
    if(db.length)leg.date=db[db.length-1].date;else if(da.length)leg.date=da[0].date;
    const dur=h.m[3].match(/(\d{1,2})\s*h\s*(\d{1,2})\s*m/i);if(dur)leg.duration=dur[1]+'h '+dur[2].padStart(2,'0')+'m';
    legs.push(_finishLeg(leg,fn));
  });
  return legs;
}
// E. GDS e-ticket table (Garuda and most full-service e-tickets): "GA0426 Y 08Jul 18:30 21:30"
function _layoutGdsTable(txt){
  const re=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\s+[A-Z]\\s+(\\d{1,2})\\s?('+_MON+')(?:\\s?(\\d{2,4}))?\\s+(\\d{1,2}:\\d{2}(?:\\s*[AaPp]\\.?[Mm]\\b\\.?)?)\\s+(\\d{1,2}:\\d{2}(?:\\s*[AaPp]\\.?[Mm]\\b\\.?)?)','gi');
  const legs=[];let m,prevEnd=0;
  while((m=re.exec(txt))!==null){
    const before=txt.substring(Math.max(prevEnd,m.index-300),m.index);prevEnd=m.index+m[0].length;
    let codes=_aliasCodesInOrder(before);
    // Airport names not in the alias list: "SORONG DOMINE EDUARD OSOK" starts with the city
    if(codes.length<2)codes=_placeCodesInOrder(before);
    if(codes.length<2)codes=[...before.matchAll(/\b([A-Z]{3})\b/g)].map(x=>x[1]).filter(_isAp);
    const leg={fromCode:codes[codes.length-2]||'',toCode:codes[codes.length-1]||'',departureTime:_hhmm(m[6]),arrivalTime:_hhmm(m[7])};
    const ds=_findDates(m[3]+' '+m[4]+(m[5]?' '+m[5]:''));if(ds[0])leg.date=ds[0].date;
    legs.push(_finishLeg(leg,{code:m[1].toUpperCase(),num:m[2]}));
  }
  return legs;
}
// F. "City (CODE)" layouts (Emirates, Qatar Airways, most OTAs): flight number, then two bracketed airports
function _layoutBracketCodes(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[],seen=new Set();
  fns.forEach((f,i)=>{
    const nextPos=i+1<fns.length?fns[i+1].pos:txt.length;
    const win=txt.substring(f.end,Math.min(nextPos,f.end+400));
    // Unknown codes still count when a place name precedes them: "DILI, TIMOR LESTE (DIL)"
    const aps=[...win.matchAll(/\(([A-Z]{3})\)/g)].filter(x=>{
      if(_isAp(x[1]))return true;
      const nm=win.substring(Math.max(0,x.index-60),x.index).split(/\s{2,}|\n/).pop().trim();
      const city=nm.split(',')[0].trim();
      if(!/^[A-Za-z][A-Za-z .'-]{2,30}$/.test(city))return false;
      AIRPORTS[x[1]]=city.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());// learn it for this session
      return true;
    });
    if(aps.length<2||aps[0][1]===aps[1][1])return;
    const key=f.code+f.num;if(seen.has(key))return;seen.add(key);
    const a1=aps[0].index,a2=aps[1].index;
    const leg={fromCode:aps[0][1],toCode:aps[1][1]};
    const depL=win.match(/Depart\w*\b[^\n]*/i),arrL=win.match(/Arriv\w*\b[^\n]*/i);
    let depZone,arrZone;
    if(depL&&arrL&&/\d{1,2}:\d{2}/.test(depL[0])&&/\d{1,2}:\d{2}/.test(arrL[0])){depZone=depL[0];arrZone=arrL[0];}
    else{
      const lineOf=pos=>{const st=win.lastIndexOf('\n',pos)+1,en=win.indexOf('\n',pos);return[st,en<0?win.length:en];};
      const[l1s,l1e]=lineOf(a1),[l2s]=lineOf(a2);
      if(l1s!==l2s){depZone=win.substring(0,l1e);arrZone=win.substring(l2s);}// one airport per line
      else{depZone=win.substring(0,a2);arrZone=win.substring(a2);}// both on one line: info follows each airport
      if(!/\d{1,2}:\d{2}/.test(win.substring(a1,a2))&&l1s===l2s){depZone=win.substring(a2);arrZone=win.substring(a2).replace(/^[\s\S]*?\d{1,2}:\d{2}/,'');}
    }
    const t1=depZone.match(/(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/),t2=arrZone.match(/(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/);
    leg.departureTime=t1?_hhmm(t1[1]):'';leg.arrivalTime=t2?_hhmm(t2[1]):'';
    const d1=_findDates(depZone),d2=_findDates(arrZone);
    if(d1.length)leg.date=d1[0].date;if(d2.length)leg.arrivalDate=d2[0].date;
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// H. Endpoint cards (Agoda/Trip.com e-tickets): "SQ 948 … SIN 09:30PM Fri, Feb 12, 2027 … DPS 12:25AM Sat, Feb 13, 2027"
function _layoutEndpoints(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[];
  fns.forEach((f,i)=>{
    const win=txt.substring(f.end,Math.min(i+1<fns.length?fns[i+1].pos:txt.length,f.end+500));
    const eps=[...win.matchAll(/\b([A-Z]{3})\s+(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/g)].filter(x=>_isAp(x[1]));
    if(eps.length<2||eps[0][1]===eps[1][1])return;
    const leg={fromCode:eps[0][1],toCode:eps[1][1],departureTime:_hhmm(eps[0][2]),arrivalTime:_hhmm(eps[1][2])};
    const d1=_findDates(win.substring(eps[0].index,eps[1].index)),d2=_findDates(win.substring(eps[1].index,eps[1].index+90));
    if(d1[0])leg.date=d1[0].date;if(d2[0])leg.arrivalDate=d2[0].date;
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// I. "Travel Reservation" layouts (Sabre-style, many airlines/agents): "DEPARTURE: FRIDAY 20 NOV … OD 0372 … KUL … DIL …
//    Departing At: 02:15 … Arriving At: 07:30"
function _layoutLabelledTimes(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[];
  fns.forEach((f,i)=>{
    const win=txt.substring(f.end,Math.min(i+1<fns.length?fns[i+1].pos:txt.length,f.end+700));
    const dep=win.match(/Depart\w*\s*(?:At|Time)?\s*[:：]?\s*(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/i),arr=win.match(/Arriv\w*\s*(?:At|Time)?\s*[:：]?\s*(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)/i);
    if(!dep||!arr)return;
    const codes=[...win.substring(0,dep.index).matchAll(/\b([A-Z]{3})\b/g)].map(x=>x[1]).filter(_isAp).filter((c,k,a)=>!k||c!==a[k-1]);
    if(codes.length<2)return;
    const leg={fromCode:codes[0],toCode:codes[1],departureTime:_hhmm(dep[1]),arrivalTime:_hhmm(arr[1])};
    const prevEnd=i?fns[i-1].end:0;
    const db=_findDates(txt.substring(Math.max(prevEnd,f.pos-200),f.pos)),dw=_findDates(win.substring(0,dep.index+dep[0].length+60));
    if(dw.length)leg.date=dw[0].date;else if(db.length)leg.date=db[db.length-1].date;
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// G. OTA receipts with airport names (Agoda…): "EQEO68 SQ 948 Singapore Changi Airport - Ngurah Rai International Airport Fri, Feb 12, 2027"
function _layoutAirportNames(txt){
  const fnRe=new RegExp('\\b('+_FNCODES+')\\s{0,3}(\\d{1,4})\\b','g');
  const fns=[];let m;
  while((m=fnRe.exec(txt))!==null)fns.push({code:m[1],num:m[2],pos:m.index,end:m.index+m[0].length});
  const legs=[];
  fns.forEach((f,i)=>{
    const win=txt.substring(f.end,Math.min(i+1<fns.length?fns[i+1].pos:txt.length,f.end+300));
    const dash=win.search(/\s[-–—]\s/);if(dash<0)return;
    const ds=_findDates(win);const d=ds.find(x=>x.pos>dash);
    const left=win.substring(0,dash),right=win.substring(dash+3,d?d.pos:Math.min(win.length,dash+90));
    const leg={fromCode:_cityCode(left),toCode:_cityCode(right)};
    if(!leg.fromCode||!leg.toCode||leg.fromCode===leg.toCode)return;
    if(d)leg.date=d.date;
    const ts=[...win.matchAll(/\b(\d{1,2}:\d{2}(?:\s*[AaPp]\.?[Mm]\b\.?)?)\b/g)];if(ts[0])leg.departureTime=_hhmm(ts[0][1]);if(ts[1])leg.arrivalTime=_hhmm(ts[1][1]);
    // Airline booking reference printed just before the flight number
    const ref=txt.substring(Math.max(0,f.pos-30),f.pos).match(/\b([A-Z0-9]{6})\s*$/);
    if(ref&&/[A-Z]/.test(ref[1])&&/^[A-Z0-9]+$/.test(ref[1]))leg.pnr=ref[1];
    legs.push(_finishLeg(leg,f));
  });
  return legs;
}
// J. Route list without times (Trip.com receipts): "Singapore - Kuala Lumpur  Malaysia Airlines MH614  August 5, 2026"
function _layoutRouteList(txt){
  const re=new RegExp("([A-Z][A-Za-z .']{1,30}?)\\s+[-–]\\s+([A-Z][A-Za-z .' ]{1,60}?)\\s+("+_FNCODES+")\\s?(\\d{1,4})\\s+((?:"+_MON+")\\.?\\s+\\d{1,2},?\\s+\\d{4}|\\d{1,2}\\s+(?:"+_MON+")\\.?\\s+\\d{4})",'g');
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    // "Kuala Lumpur  Malaysia Airlines": the destination is the longest leading run of words that names a city
    const w=m[2].trim().split(/\s+/);let toCode='';
    for(let k=Math.min(3,w.length);k>=1&&!toCode;k--)toCode=_cityCode(w.slice(0,k).join(' '));
    const leg={fromCode:_cityCode(m[1]),toCode};
    if(!leg.fromCode||!leg.toCode||leg.fromCode===leg.toCode)continue;
    const ds=_findDates(m[5]);if(ds[0])leg.date=ds[0].date;
    legs.push(_finishLeg(leg,{code:m[3],num:m[4]}));
  }
  return legs;
}
// K. Flight number, then date and times in a table row (t'way, Air Seoul, Air India…):
//    "TW171 A330-300 2022-12-31(Sat) 19:35 01:00 +1 06h25m", "RS922 22Dec22 (Thu) 10:05 11:15", "AI2106 10:30 05Nov2025 14:05 05Nov2025"
function _layoutFnDateTimes(txt){
  const D="(?:20\\d{2}-\\d{2}-\\d{2}|\\d{1,2}\\s?(?:"+_MON+")\\s?(?:\\d{4}|\\d{2})?)(?:\\s*\\([A-Za-z]{2,3}\\))?",T="\\d{1,2}:\\d{2}";
  const re=new RegExp("\\b("+_FNCODES+")\\s?(\\d{1,4})\\s+(?:[A-Z0-9-]{3,10}\\s+)?(?:("+D+")\\s+("+T+")\\s+("+T+")|("+T+")\\s+("+D+")\\s+("+T+")(?:\\s+("+D+"))?)",'g');
  const legs=[];let m,prevEnd=0;
  while((m=re.exec(txt))!==null){
    const before=txt.substring(Math.max(prevEnd,m.index-300),m.index).replace(/\(([A-Z])\s*([A-Z])\s*([A-Z])\)/g,' $1$2$3 ');// "(G  MP)" → GMP
    prevEnd=m.index+m[0].length;
    let codes=[...before.matchAll(/\b([A-Z]{3})\b/g)].map(x=>x[1]).filter(_isAp).filter((c,k,a)=>!k||c!==a[k-1]);
    if(codes.length<2)codes=_placeCodesInOrder(before);
    if(codes.length<2)continue;
    const leg={fromCode:codes[codes.length-2],toCode:codes[codes.length-1]};
    if(m[3]){leg.departureTime=m[4];leg.arrivalTime=m[5];const d=_findDates(m[3]);if(d[0])leg.date=d[0].date;}
    else{leg.departureTime=m[6];leg.arrivalTime=m[8];const d=_findDates(m[7]),a=m[9]?_findDates(m[9]):[];if(d[0])leg.date=d[0].date;if(a[0])leg.arrivalDate=a[0].date;}
    legs.push(_finishLeg(leg,{code:m[1],num:m[2]}));
  }
  return legs;
}
// L. This app's own itinerary PDF ("Generated by The Planner", formerly "Holiday Tracker"): "Day 1 — Wednesday, 1 July 2026 … FLIGHT Scoot TR278
//    Route: Singapore to Jakarta Depart: 6:15 pm Arrive: 7:15 pm PNR: MGH6MH Cost: SGD 175.2"
function _layoutTrackerExport(txt){
  if(!/Generated by (?:Holiday Tracker|The Planner)\b/.test(txt))return [];
  // Older exports drew "→" as "!’" and letter-spaced the route: "S i n g a p o r e  !’    J a k a r t a"
  const unspace=x=>x.replace(/!’|!'/g,' to ').split(/\s{2,}/).map(w=>/^(?:\S )+\S$/.test(w.trim())?w.trim().replace(/ /g,''):w).join(' ').replace(/\s+/g,' ').trim();
  const days=[...txt.matchAll(/Day\s+\d+\s+—\s+\w+,\s+(\d{1,2}\s+\w+\s+\d{4})/g)].map(x=>({pos:x.index,date:(_findDates(x[1])[0]||{}).date}));
  const re=/FLIGHT\s+(.{0,40}?)\b([A-Z0-9]{2})\s?(\d{1,4})\s+Route:\s+([\s\S]{1,120}?)\s+Depart:\s+([\d:]+\s*[ap]m)?\s*(?:Arrive:\s+([\d:]+\s*[ap]m))?([\s\S]*?)(?=FLIGHT\s|ACTIVITY\s|HOTEL\s|TRANSPORT\s|Day\s+\d+\s+—|Cost Summary|$)/g;
  const legs=[];let m;
  while((m=re.exec(txt))!==null){
    const route=unspace(m[4]).split(/\s+to\s+|\s*→\s*/);if(route.length<2)continue;
    const leg={from:route[0].trim(),to:route[1].trim(),departureTime:m[5]?_hhmm(m[5]):'',arrivalTime:m[6]?_hhmm(m[6]):''};

function parseFlightSegments(txt){

function dedupeLines(txt){
  // Times like "10 ∶ 20" (ratio sign) in some OTA PDFs
  txt=txt.replace(/\u0000/g,'').replace(/(\d{1,2})\s*[∶꞉]\s*(\d{2})/g,'$1:$2');
  // Some PDF extractors (e.g. Malaysia Airlines) repeat each phrase 3-4x on one line: "14:35 14:35 14:35 14:35"
  txt=txt.replace(/(\S(?:[^\n]{0,80}?\S)?)(?:[ \t]+\1){2,}(?=\s|$)/g,'$1');
  // …or repeat each line 2-4x
  const lines=txt.split('\n');const out=[];
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim();
    if(!l){out.push('');continue;}
    // Skip if same as previous non-empty line
    if(out.length&&out[out.length-1].trim()===l)continue;
    out.push(lines[i]);
  }
  return out.join('\n');
}

// Booking total + currency (sets r.cost / r.currency)
function _extractCost(txt,r){
  const costPats=[
    /Grand\s*total\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW|INR|JPY|HKD)\s*([\d,]+\.?\d*)/i,
    /Total\s*\([^)]{1,25}\)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW|INR|JPY|HKD)\s*([\d,]+\.?\d*)/i,
    // "Grand total: IDR 2,320,000"
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?|TOTAL)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW)\s*([\d,]+\.?\d*)/i,
    // "Total S$ 79.10" or "Total Rp 3,106,856"
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?|TOTAL)\s*[:#]?\s*(?:Rp\.?|RM|S\$|A\$|₱|¥|฿|€|£|\$)\s*([\d,]+\.?\d*)/i,
    // "SGD235.20" (no space)
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?|TOTAL)\s*[:#]?\s*(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY)([\d,]+\.?\d*)/i,
    // "Total 3,106,856" (amount only)
    /(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?)\s*[:#]?\s*[\$]?\s*([\d,]+\.?\d{0,2})\b/i,
  ];
  const ISO='SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD|CNY|MVR|EGP|TWD|KRW|INR|JPY|HKD|NZD|CHF|CAD|VND|LKR|AED|QAR|TZS|KES';
  const firstFound=costPats.slice(0,5).some(p=>p.test(txt));

    const tl=[...txt.matchAll(new RegExp('^[^\\n]*\\btotal\\b[^\\n]*?([\\d][\\d,]*(?:\\.\\d{1,2})?)\\s*('+ISO+')\\b','gim'))].map(m=>({v:parseFloat(m[1].replace(/,/g,'')),c:m[2].toUpperCase(),raw:m[1]}));

  }

    if(m[2]){
      if(/^[A-Z]{3}$/.test(m[1])){r.currency=m[1].toUpperCase();r.cost=m[2].replace(/,/g,'');}
      else{r.cost=m[1].replace(/,/g,'');if(/^[A-Z]{3}$/.test(m[2]))r.currency=m[2].toUpperCase();}
    }else{r.cost=m[1].replace(/,/g,'');}
    break;
  }}
  // Detect currency from context near total
  if(r.cost&&!r.currency){
    const totalCtx=txt.match(/(?:Grand\s*total|Total\s*(?:Amount|Price|Cost|Fare|Charge[ds]?|Paid|Due|Payable)?)\s*[:#]?\s*(.{0,30})/i);
    if(totalCtx){const ctx=totalCtx[1].toLowerCase();
      for(const[sym,iso]of Object.entries(CURRENCY_SYMBOLS).sort((a,b)=>b[0].length-a[0].length)){if(ctx.includes(sym)){r.currency=iso;break;}}}
  }
  // Fallback: any "MYR 95.04" or "IDR 2,320,000" pattern
  if(!r.cost){const cm=txt.match(/(SGD|USD|MYR|IDR|EUR|GBP|THB|PHP|AUD)\s*([\d,]+\.?\d*)/i);if(cm){r.currency=cm[1].toUpperCase();r.cost=cm[2].replace(/,/g,'');}}

    if(symCost){r.cost=symCost[2].replace(/,/g,'');const sym=symCost[1].toLowerCase().replace(/\.$/,'');r.currency=CURRENCY_SYMBOLS[sym]||baseCur();}}
}

function parseBookingText(rawTxt){

    }
    // ISO dates
    const dp4=/(\d{4})-(\d{2})-(\d{2})/g;
    while((m2=dp4.exec(dateSrc))!==null){const ds=m2[0];if(!foundDates.includes(ds))foundDates.push(ds);}
    // "10 AUG , 2026" format (with comma between month and year)
    const dp5=/(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s*,?\s*(\d{4})/gi;
    while((m2=dp5.exec(dateSrc))!==null){const mm=MMAP[m2[2].toLowerCase().slice(0,3)];if(mm){const ds=`${m2[3]}-${mm}-${m2[1].padStart(2,'0')}`;if(!foundDates.includes(ds))foundDates.push(ds);}}
    const uniqueDates=[...new Set(foundDates)].sort();
    if(uniqueDates.length>=1)r.date=uniqueDates[0];
    if(uniqueDates.length>=2&&!r.dateTo)r.dateTo=uniqueDates[uniqueDates.length-1];
    // "Oct 10, 2026" style, ignoring booking/payment/issue dates
    if(!r.date){
      const clean=dateSrc.replace(/(?:Booking\s*(?:on|date)|Booked\s*on|Payment\s*(?:received|date)|(?:E-?receipt\s*)?issued|Issue\s*date|Date\s*of\s*issue|Order\s*date)\s*[:：]?\s*[^\n]{0,30}?\d{4}/gi,' ');
      const ds=_findDates(clean);if(ds[0])r.date=ds[0].date;
    }
  }

  // ===== 9. Times (flights only) =====
  if(r.type==='flight'){
    // Try structured patterns first
    const depTimeM=txt.match(/(?:Depart(?:ing|ure)?\s*(?:At|Time)?\s*[:#]?\s*|DEPARTING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    const arrTimeM=txt.match(/(?:Arriv(?:al|ing)\s*(?:At|Time)?\s*[:#]?\s*|ARRIVING\s*\n?\s*)(\d{1,2}:\d{2}\s*(?:am|pm)?)/i);
    if(depTimeM)r.departureTime=depTimeM[1].trim();
    if(arrTimeM)r.arrivalTime=arrTimeM[1].trim();
    // Airport-code-prefixed times: "DPS 12:10" / "SIN 14:55" (SQ e-ticket format)
    if(!r.departureTime&&r.fromCode){const acM=txt.match(new RegExp(r.fromCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)r.departureTime=acM[1];}
    if(!r.arrivalTime&&r.toCode){const acM=txt.match(new RegExp(r.toCode+'\\s+(\\d{1,2}:\\d{2})'));if(acM)r.arrivalTime=acM[1];}
    // Fallback: first two times in text
    if(!r.departureTime){
      const times=[];const seenT=new Set();let m2;
      const tp=/\b(\d{1,2}:\d{2}\s*(?:am|pm)?)\b/gi;
      while((m2=tp.exec(txt))!==null){const v=m2[1].trim();const h=parseInt(v);if(h>=0&&h<=23&&!seenT.has(v)){times.push(v);seenT.add(v);}}
      if(times.length>=1)r.departureTime=times[0];
      if(times.length>=2)r.arrivalTime=times[1];
    }
  }

  // ===== 10. Cost — with currency symbol mapping =====
  _extractCost(txt,r);

  // ===== 11. Hotel extras: room type, nights =====
  if(r.type==='hotel'){
    const nightsM=txt.match(/(\d+)\s*nights?\b/i);if(nightsM)r.nights=parseInt(nightsM[1]);
    const roomM=txt.match(/\d+\s*nights?,\s*(.+?)(?:\n|$)/i);if(roomM)r.roomType=roomM[1].trim().slice(0,60);
    if(!r.roomType){const lt=txt.match(/(?:^|\n|\s{2,})Room\s*[Tt]ype\s*[:：]?\s+([A-Z][^\n]{2,60}?)(?:\s{2,}|\n|$)/);if(lt)r.roomType=lt[1].trim();}
    if(!r.roomType){const rt=txt.match(/\b((?:Deluxe|Superior|Standard|Classic|Premier|Executive|Family|Double|Twin|Single|Triple|Quad|King|Queen|Budget|Economy|Garden|Pool|Ocean|Sea)(?:[ \t]+[A-Z][a-z]+){0,3}[ \t]+(?:Room|Suite|Villa|Bungalow|Studio|Cabin|Dorm))\b/);if(rt)r.roomType=rt[1];}
    if(!r.nights&&r.date&&r.dateTo)r.nights=Math.round((new Date(r.dateTo)-new Date(r.date))/864e5);
  }

  // ===== 12. Flight duration =====
  if(r.type==='flight'){const durM=txt.match(/(?:Duration|Non-stop)\s*[,:.]?\s*(\d+)\s*h(?:rs?|ours?)?\s*(\d+)\s*m(?:in)?/i);
    if(durM)r.duration=durM[1]+'h '+durM[2]+'m';}

  // ===== 13. Build display name =====
  if(r.type==='flight')r.name=r.airline?`${r.airline} ${r.flightNumber||'Flight'}`+(r.from&&r.to?` (${r.from} → ${r.to})`:''):(r.from&&r.to?`${r.from} → ${r.to}`:'Flight');
  else if(r.type==='hotel')r.name=r.hotelName||(r.locations.length?r.locations[0]+' Hotel':'Hotel Booking');
  else if(r.type==='transport')r.name=r.provider||r.title||r.locations.join(' → ')||'Uploaded Booking';
  else r.name=r.title||r.locations.join(' → ')||'Uploaded Booking';
  return r;
}

// A date field's change handler that waits until the picker is closed on touch screens
function whenPicked(el,fn){
  if(!/^(date|time|datetime-local|month)$/.test(el.type)||!matchMedia('(pointer:coarse)').matches)return fn;
  let pending=false;
  el.addEventListener('blur',()=>{if(pending){pending=false;fn();}});
  return()=>{if(document.activeElement===el)pending=true;else fn();};
}

        csvRows.push([csvEsc(t2.name),t2.startDate,t2.endDate,csvEsc(t2.locations.join('; ')),d2,(t2.flights||[]).length,(t2.hotels||[]).length,(t2.activities||[]).length,(t2.transport||[]).length,eCost(t2).toFixed(2)]);
      });
      const csvStr=csvRows.map(r=>r.join(',')).join('\n');
      const b3=new Blob([csvStr],{type:'text/csv'});const a3=document.createElement('a');a3.href=URL.createObjectURL(b3);a3.download='holiday-tracker-events.csv';a3.click();toast('CSV exported');break;}
    case 'import':document.getElementById('imp-f').click();break;
    case 'restore-backup':{const bk=localStorage.getItem('htV5_backup');const bkTs=localStorage.getItem('htV5_backup_ts')||'unknown';if(bk&&confirm('Restore backup from '+bkTs+'? This will merge backup events with current data.')){try{const bd=JSON.parse(bk);if(bd.events){S.events=mergeEvents(S.events||[],bd.events);S.lastModified=Date.now();saveS();render();pushToGist();toast('Restored '+(bd.events||[]).length+' events from backup');}}catch(e2){toast('Backup corrupted');}}break;}
    case 'reset':if(confirm('Reset ALL data? This cannot be undone.')){localStorage.removeItem('htV4');localStorage.removeItem('htV5');S=defS();saveS();render();toast('Data reset');}break;
    case 'sync-connect':connectSync();break;
    case 'dash-sync-connect':connectSyncFromDash();break;
    case 'sync-disconnect':disconnectSync();break;
    case 'sync-now':cloudFullSync();break;
    case 'acct-signin':acctSignIn();break;
    case 'acct-google':acctGoogle();break;
    case 'ld-theme':toggleTheme();render();break;
    case 'go-rates':e.preventDefault();nav('settings');setTimeout(()=>[...document.querySelectorAll('.card h3')].find(h=>/Exchange/.test(h.textContent))?.scrollIntoView({behavior:'smooth'}),50);break;
    case 'go-prefs':e.preventDefault();nav('settings');setTimeout(()=>document.getElementById('prefs-card')?.scrollIntoView({behavior:'smooth'}),50);break;
    case 'ph-cal-rm':{const p=S.prefs=JSON.parse(JSON.stringify(P()));p.holidays=(p.holidays||[]).filter(c=>c!==el.dataset.cc);if(p.workHolidays===el.dataset.cc){p.workHolidays=p.holidays[0]||'';p.region='';}saveS();render();break;}
    case 'ph-del':{const p=S.prefs=JSON.parse(JSON.stringify(P()));p.customHolidays=(p.customHolidays||[]).filter(h=>!(h.d===el.dataset.d&&h.n===el.dataset.n));saveS();render();break;}
    case 'ph-import':{let f=document.getElementById('ph-ics-f');if(!f){f=document.createElement('input');f.type='file';f.id='ph-ics-f';f.accept='.ics,text/calendar';f.style.display='none';document.body.appendChild(f);}f.click();break;}
    case 'ph-add':modal('Add a holiday',`<div class="fg"><div class="fi"><label>Date</label><input class="fc" type="date" id="ph-new-d"></div><div class="fi"><label>Name</label><input class="fc" id="ph-new-n" placeholder="e.g. Company day off"></div><div class="fi"><label>Repeat</label><select class="fc" id="ph-new-r"><option value="1">Just this date</option><option value="5">Same date for the next 5 years</option></select></div></div>`,()=>{
        const d=document.getElementById('ph-new-d').value,n=document.getElementById('ph-new-n').value.trim()||'Holiday',rep=parseInt(document.getElementById('ph-new-r').value);
        if(!d){toast('Pick a date');return false;}
        const p=S.prefs=JSON.parse(JSON.stringify(P()));p.customHolidays=p.customHolidays||[];
        for(let k=0;k<rep;k++){const dd=(parseInt(d.slice(0,4))+k)+d.slice(4);if(!p.customHolidays.some(h=>h.d===dd&&h.n===n))p.customHolidays.push({d:dd,n});}
        saveS();render();toast('Holiday added');
      },{saveLabel:'Add'});break;
    case 'acct-forgot':e.preventDefault();acctForgot();break;
    case 'acct-signout':acctSignOut();break;
    case 'acct-delete':acctDelete();break;
    case 'acct-change-pw':acctShowNewPassword();break;
    case 'open-guide':nav('guide');break;
    case 'go-account':nav('settings');setTimeout(()=>{const g=document.getElementById('acct-card');if(g){g.scrollIntoView({behavior:'smooth'});document.getElementById('acct-email')?.focus();}},50);break;
    case 'link-device':linkDevice();break;
    case 'sync-push':pushToGist().then(()=>toast('Pushed to cloud'));break;
    case 'sync-pull':pullFromGist().then(pulled=>{if(pulled)toast('Pulled from cloud');else toast('Already up to date');});break;
    case 'entry-sort-dir':sortDir=sortDir==='asc'?'desc':'asc';render();break;
    case 'event-sort-dir':eventSortDir=eventSortDir==='asc'?'desc':'asc';render();break;
    case 'show-clash':e.stopPropagation();showClashModal(el.dataset.id);break;
    case 'show-all-clashes':e.stopPropagation();showClashModal();break;
    case 'c-tab':S._cTab=el.dataset.t;saveUI();render();break;
    case 'ph-open':case 'ph-all':{e.preventDefault();const k=a==='ph-open'?'_phOpen':'_phAll';window[k]=window[k]||{};window[k][el.dataset.cc]=!window[k][el.dataset.cc];render();break;}
    case 'lw-max':S._lwMax=+el.dataset.n;S._lwAll=false;render();break;
    case 'lw-all':e.preventDefault();S._lwAll=!S._lwAll;render();break;
    case 'lw-plan':{const f=el.dataset.from,t=el.dataset.to;fEvent();setTimeout(()=>{const m=document.querySelector('.modal');if(!m)return;const set=(n,v)=>{const i=m.querySelector('[name="'+n+'"]');if(i){i.value=v;i.dispatchEvent(new Event('change',{bubbles:true}));}};set('sd',f);set('ed',t);const nm=m.querySelector('[name="name"]');if(nm)nm.focus();},60);break;}
    case 'doc-add':fDoc();break;
    case 'doc-edit':fDoc((S.docs||[]).find(d=>d.id===el.dataset.id));break;
    case 'doc-del':{const d=(S.docs||[]).find(x=>x.id===el.dataset.id);if(!d)break;acctAsk({title:'Delete this document?',body:esc(docName(d))+' will be removed from your account and your devices.',yes:'Delete',no:'Cancel'}).then(ok=>{if(!ok)return;S.docs=S.docs.filter(x=>x.id!==d.id);saveS();render();toast('Document deleted');});break;}
    case 'share-trip':showShareTrip(el.dataset.id);break;
    case 'sh-create':case 'sh-save':{const m=document.querySelector('#mbg .modal');if(m&&m.dataset.shareTid)shareSave(m.dataset.shareTid,a==='sh-create');break;}
    case 'sh-stop':{const m=document.querySelector('#mbg .modal');if(m&&m.dataset.shareTid)shareStop(m.dataset.shareTid);break;}
    case 'sh-copy':{const i=document.getElementById('sh-url');if(i){navigator.clipboard.writeText(i.value).then(()=>toast('Link copied')).catch(()=>{i.select();document.execCommand('copy');toast('Link copied');});}break;}
    case 'sh-native':{const i=document.getElementById('sh-url'),m=document.querySelector('#mbg .modal'),t=m&&S.events.find(x=>x.id===m.dataset.shareTid);if(i&&navigator.share)navigator.share({title:t?t.name:'Trip',text:t?t.name+' itinerary':'Trip itinerary',url:i.value}).catch(()=>{});break;}
    case 'toggle-country':{
      const cid=el.dataset.cid;
      if(!S.visitedCountries)S.visitedCountries=[];
      const idx=S.visitedCountries.indexOf(cid);
      if(idx>=0)S.visitedCountries.splice(idx,1);
      else S.visitedCountries.push(cid);
      saveS();render();
      break;
    }

    case 'add-attach-link':{if(ev){
      modal('Add Link Attachment',`<div class="fg">
        <div class="fi full"><label>Name</label><input class="fc" name="att-name" placeholder="e.g. Hotel confirmation"></div>
        <div class="fi full"><label>URL</label><input class="fc" name="att-url" placeholder="https://..."></div>
      </div>`,()=>{
        const m=document.querySelector('.modal');
        const name=m.querySelector('[name="att-name"]').value;
        const url=m.querySelector('[name="att-url"]').value;
        if(!url){toast('URL required');return false;}
        if(!ev.attachments)ev.attachments=[];
        ev.attachments.push({id:uid(),name:name||url,url,type:'link',addedAt:new Date().toISOString()});
        saveS();render();toast('Link added');
      });}break;}
    case 'add-attach-img':{if(ev){
      const fid='att-'+uid();
      modal('Upload Image',`<div class="fg">
        <div class="fi full"><label>Name</label><input class="fc" name="att-name" placeholder="e.g. Booking screenshot"></div>
        <div class="fi full"><label>Image</label><input type="file" accept="image/*" id="${fid}" class="fc"></div>
        <div class="fi full"><label>Link (optional)</label><input class="fc" name="att-url" placeholder="https://..."></div>
      </div>`,()=>{
        const m=document.querySelector('.modal');
        const name=m.querySelector('[name="att-name"]').value;
        const url=m.querySelector('[name="att-url"]').value;
        const fi=document.getElementById(fid);
        const pendingFile=fi?fi._pendingThumb:null;
        if(!pendingFile&&!url){toast('Image or URL required');return false;}
        if(!ev.attachments)ev.attachments=[];
        ev.attachments.push({id:uid(),name:name||'Image',thumbData:pendingFile||'',url:url||'',type:pendingFile?'image':'link',addedAt:new Date().toISOString()});
        saveS();render();toast('Attachment added');
      });
      setTimeout(()=>{
        const fi=document.getElementById(fid);
        if(fi)fi.addEventListener('change',e2=>{
          const file=e2.target.files[0];
          if(!file)return;
          const reader=new FileReader();
          reader.onload=()=>{
            const img=new Image();
            img.onload=()=>{
              const canvas=document.createElement('canvas');
              const maxW=300,maxH=300;
              let w=img.width,h=img.height;
              if(w>maxW){h=h*(maxW/w);w=maxW;}
              if(h>maxH){w=w*(maxH/h);h=maxH;}
              canvas.width=w;canvas.height=h;
              const ctx=canvas.getContext('2d');
              ctx.drawImage(img,0,0,w,h);
              fi._pendingThumb=canvas.toDataURL('image/jpeg',0.6);
              toast('Image ready');
            };
            img.src=reader.result;
          };
          reader.readAsDataURL(file);
        });
      },100);
      }break;}
    case 'del-attach':{if(ev){
      const aid=el.dataset.aid;
      const idx=(ev.attachments||[]).findIndex(a=>a.id===aid);
      if(idx>=0){const entry=ev.attachments[idx];ev.attachments.splice(idx,1);saveS();render();
        toastUndo('Attachment deleted',()=>{ev.attachments.splice(idx,0,entry);saveS();render();});}
      }break;}
  }
});

document.addEventListener('change',e=>{
  if(e.target.matches('[data-action="entry-sort-key"]')){sortKey=e.target.value;render();}
  if(e.target.matches('[data-action="event-sort-key"]')){eventSortKey=e.target.value;render();}
  if(e.target.matches('[data-action="tp-change"]')){S._tp=e.target.value;saveS();render();}
  if(e.target.matches('[data-action="tp-from"],[data-action="tp-to"]')){const el=e.target;whenPicked(el,()=>{if(el.dataset.action==='tp-from')S._tpFrom=el.value;else S._tpTo=el.value;saveS();render();})();}
});

document.addEventListener('input',e=>{if(e.target&&e.target.id==='gsearch')renderSearchResults();});
// Countries: remember which regions are open across redraws
document.addEventListener('toggle',e=>{const d=e.target;if(d instanceof HTMLDetailsElement&&d.classList.contains('c-region')){const o=window._cOpen||(window._cOpen=new Set());d.open?o.add(d.dataset.region):o.delete(d.dataset.region);}},true);
document.addEventListener('toggle',e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.open||!d.classList.contains('guide-sec'))return;
  document.querySelectorAll('details.guide-sec[open]').forEach(o=>{if(o!==d)o.removeAttribute('open');});},true);
document.addEventListener('keydown',e=>{
  const inp=document.getElementById('gsearch');if(!inp||e.target!==inp)return;
  const items=[...document.querySelectorAll('#gs-results .gs-item')],cur=items.findIndex(x=>x.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;const n=(cur+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('sel',i===n));}
  else if(e.key==='Enter'){const sel=items[cur>=0?cur:0];if(sel)sel.click();}
  else if(e.key==='Escape'){inp.value='';renderSearchResults();inp.blur();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.cp'))document.querySelectorAll('.cp.open').forEach(x=>x.classList.remove('open'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.cp.open').forEach(x=>x.classList.remove('open'));});
document.addEventListener('click',e=>{const box=document.getElementById('gs-results');if(box&&!e.target.closest('.tb-search'))box.classList.remove('on');});
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='gsearch'&&e.target.value.trim().length>=2)renderSearchResults();});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.action==='ev-cat'){S._catFilter=t.value;saveUI();render();return;}
  if(t.dataset&&t.dataset.action==='ev-year'){S.tfY=t.value?parseInt(t.value):null;saveUI();render();return;}
  if(t.dataset&&t.dataset.action==='ev-apple'){setListUI({apple:t.checked});render();return;}
  if(t.dataset&&t.dataset.pref!==undefined){setPref(t.dataset.pref,t.value);return;}
  if(t.dataset&&t.dataset.prefWeekend!==undefined){setWeekend(parseInt(t.dataset.prefWeekend),t.checked);return;}
  if(t.id==='ph-ics-f'&&t.files.length){
    // Holiday calendar file (.ics) → My holidays: all-day events by date and title
    const r=new FileReader();r.onload=()=>{
      const p=S.prefs=JSON.parse(JSON.stringify(P()));const have=new Set((p.customHolidays||[]).map(h=>h.d+'|'+h.n));let added=0;
      String(r.result).replace(/\r?\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1).forEach(b=>{
        const dm=b.match(/DTSTART[^:\n]*:(\d{4})(\d{2})(\d{2})/),sm=b.match(/SUMMARY[^:\n]*:(.*)/);
        if(!dm)return;const d=`${dm[1]}-${dm[2]}-${dm[3]}`,n=(sm?sm[1]:'Holiday').replace(/\\([,;\\])/g,'$1').replace(/\\n/gi,' ').trim().slice(0,80);
        if(!have.has(d+'|'+n)){(p.customHolidays=p.customHolidays||[]).push({d,n});have.add(d+'|'+n);added++;}
      });
      saveS();render();toast(added?`Added ${added} holiday${added>1?'s':''}`:'No new holidays found in that file');
    };r.readAsText(t.files[0]);t.value='';return;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='imp-f'&&e.target.files.length){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.events||d.trips){if(d.trips&&!d.events){d.events=d.trips.map(t=>({...t,category:'trip',requiresLeave:true}));delete d.trips;}S=d;saveS();render();toast('Imported');}}catch(e2){toast('Error');}};r.readAsText(e.target.files[0]);}});
// Search input handler
document.addEventListener('input',e=>{
  if(e.target.matches('[data-action="search-events"]')){S._searchQ=e.target.value;render();
    // Re-focus after render
    setTimeout(()=>{const inp=document.querySelector('[data-action="search-events"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
  if(e.target.matches('[data-action="dash-search"]')){S._dashSearch=e.target.value;render();
    setTimeout(()=>{const inp=document.querySelector('[data-action="dash-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
  if(e.target.matches('[data-action="stat-year"]')){S._statY=e.target.value;render();return;}
  if(e.target.matches('[data-action="country-search"]')){S._countrySearch=e.target.value;render();
    setTimeout(()=>{const inp=document.querySelector('[data-action="country-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}},10);
  }
});

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){xm();closeMobileMenu();}
  // Don't trigger shortcuts when typing in inputs
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  if(e.key==='1')nav('dashboard');
  else if(e.key==='2')nav('events');
  else if(e.key==='3')nav('calendar');
  else if(e.key==='4')nav('leave');
  else if(e.key==='5')nav('budget');
  else if(e.key==='6')nav('settings');
  else if(e.key==='n'&&!e.ctrlKey&&!e.metaKey)fEvent();
  else if(e.key==='u'&&!e.ctrlKey&&!e.metaKey)showSmartUpload();
  else if(e.key==='/'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();const si=document.getElementById('gsearch');if(si)si.focus();}
});

// Hamburger
document.getElementById('hamburger').onclick=toggleMobileMenu;
document.getElementById('sidebar-overlay').onclick=closeMobileMenu;
// Close mobile menu when navigating
const origNav=nav;
nav=function(v,x){closeMobileMenu();origNav(v,x);};

// FAB
document.getElementById('fab').onclick=()=>showSmartUpload();

// Tesseract lazy load
(function(){if(typeof Tesseract==='undefined'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.head.appendChild(s);}})();

// Build datalists for airline and location autocomplete
(function(){
  const alDl=document.createElement('datalist');alDl.id='airline-list';
  AIRLINE_NAMES.forEach(a=>{const o=document.createElement('option');o.value=a;alDl.appendChild(o);});
  document.body.appendChild(alDl);
  const locDl=document.createElement('datalist');locDl.id='location-list';
  const locSet=new Set();
  Object.entries(AIRPORTS).forEach(([code,city])=>{locSet.add(city);locSet.add(city+' ('+code+')');});
  CITIES.forEach(c=>locSet.add(c));
  [...locSet].sort().forEach(l=>{const o=document.createElement('option');o.value=l;locDl.appendChild(o);});
  document.body.appendChild(locDl);
})();

// Init
try{render();
  setTimeout(()=>{try{if(gateState()==='open')maybeAskRegion();}catch(e){}},1500);
  // Auto-sync on load
  const _initConf=getSyncConfig();
  if(acctEnabled()){acctInit().then(()=>{if(!_acct&&cloudMode()==='gist')fullSync();});}
  else if(_initConf.token){setTimeout(()=>fullSync(),800);}
  else if(_initConf.gistId){
    // Arrived via link — pull data anonymously (read-only, no token needed)
    setTimeout(()=>pullGistAnon(_initConf.gistId),500);
  }
}catch(e){console.error('Render error:',e);document.getElementById('app').innerHTML='<div style="padding:40px;color:#ff6b6b"><h2>Error loading app</h2><pre style="margin-top:12px;font-size:12px;white-space:pre-wrap;color:#e8e9ed">'+e.message+'\n\n'+e.stack+'</pre><button onclick="localStorage.removeItem(\'htV4\');localStorage.removeItem(\'htV3\');location.reload()" style="margin-top:16px;padding:8px 16px;background:#6c8cff;color:#fff;border:none;border-radius:8px;cursor:pointer">Reset &amp; Reload</button></div>';}

// Near-realtime sync: poll + visibility
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const vc=getSyncConfig();
    if(cloudMode())cloudFullSync();
    else if(vc.gistId&&!acctEnabled())pullGistAnon(vc.gistId);
  }
});
window.addEventListener('focus',()=>{
  const fc=getSyncConfig();
  if(cloudMode())cloudPull().then(pulled=>{if(pulled){render();toast('Synced from cloud');}});
  else if(fc.gistId&&!acctEnabled())pullGistAnon(fc.gistId);
});
window.addEventListener('beforeunload',()=>{
  if(_syncTimer){clearTimeout(_syncTimer);cloudPush();}
});
startSyncPolling();
setInterval(()=>{try{renderSidebar();}catch(e){}},60000);

// Offline detection
const _ob=document.createElement('div');_ob.className='offline-banner';_ob.textContent='You are offline — changes will sync when reconnected';document.body.appendChild(_ob);
window.addEventListener('online',()=>{_ob.classList.remove('show');if(cloudMode())cloudPush();});
window.addEventListener('offline',()=>_ob.classList.add('show'));
if(!navigator.onLine)_ob.classList.add('show');
