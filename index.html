<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<script>
// The Planner lives at theplanner.pages.dev; the old GitHub Pages address forwards there (sign-in links keep their #… part)
if(location.hostname==='irnw.github.io')location.replace('https://theplanner.pages.dev/'+location.search+location.hash);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f6f3">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>The Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ========== THEME VARIABLES ========== */
[data-theme="dark"]{
  /* Surface Interval palette (dark) */
  --bg:#0f1014;--bg2:#14161c;--card:#14161c;--card-hover:#191c24;--surface-2:#191c24;
  --sidebar-bg:#0f1014;--sidebar-hover:rgba(168,156,255,.08);--sidebar-active:rgba(168,156,255,.14);
  --primary:#a89cff;--primary-deep:#c1b8ff;--primary-dim:rgba(168,156,255,.14);--primary-glow:rgba(168,156,255,.28);--on-primary:#0f1014;
  --accent:#ff7b7b;--accent-dim:rgba(255,123,123,.12);--green:#5fd38a;--green-dim:rgba(95,211,138,.12);
  --orange:#f2a65a;--orange-dim:rgba(242,166,90,.12);--purple:#a89cff;--purple-dim:rgba(168,156,255,.14);
  --text:#f2f1ed;--text2:#a4a7b4;--text3:#8b90a0;--line:#2a2e3a;--line-strong:#4d4578;--border:#2a2e3a;--border2:#4d4578;
  --input-bg:#191c24;--radius:0px;--radius-lg:0px;--shadow:none;--shadow2:0 30px 80px rgba(0,0,0,.5);
  --header-bg:rgba(15,16,20,.92);--overlay:rgba(5,6,10,.62);
  --sg:#7fa8ff;--sg-dim:rgba(127,168,255,.15);--leave:#f28fb0;--leave-dim:rgba(242,143,176,.15);--synced:#8fdcae;--my:#f2a65a;--my-dim:rgba(242,166,90,.14);
  --glass:rgba(255,255,255,.03);--glass-border:#2a2e3a;--fill:rgba(168,156,255,.1);--fill2:rgba(168,156,255,.06);--sep:#2a2e3a;
  --glow-1:#a89cff;--glow-2:#c1b8ff;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
[data-theme="light"]{
  /* Surface Interval palette (light) */
  --bg:#f7f6f3;--bg2:#fbfaf8;--card:#fbfaf8;--card-hover:#ffffff;--surface-2:#ffffff;
  --sidebar-bg:#f7f6f3;--sidebar-hover:rgba(138,127,232,.06);--sidebar-active:#f1efff;
  --primary:#8a7fe8;--primary-deep:#5f52d6;--primary-dim:#f1efff;--primary-glow:rgba(138,127,232,.25);--on-primary:#ffffff;
  --accent:#d65050;--accent-dim:rgba(214,80,80,.07);--green:#2f9e5b;--green-dim:rgba(47,158,91,.08);
  --orange:#c97a2b;--orange-dim:rgba(201,122,43,.08);--purple:#8a7fe8;--purple-dim:#f1efff;
  --text:#111111;--text2:#6f6f78;--text3:#7c7c86;--line:#e7e3ef;--line-strong:#ddd6f3;--border:#e7e3ef;--border2:#ddd6f3;
  --input-bg:#ffffff;--radius:0px;--radius-lg:0px;--shadow:none;--shadow2:0 30px 80px rgba(17,17,17,.14);
  --header-bg:rgba(247,246,243,.92);--overlay:rgba(17,17,17,.28);
  --sg:#3d7ad6;--sg-dim:rgba(61,122,214,.1);--leave:#d6608a;--leave-dim:rgba(214,96,138,.1);--synced:#4fae73;--my:#c97a2b;--my-dim:rgba(201,122,43,.1);
  --glass:rgba(0,0,0,.02);--glass-border:#e7e3ef;--fill:#f1efff;--fill2:rgba(138,127,232,.06);--sep:#e7e3ef;
  --glow-1:#8a7fe8;--glow-2:#5f52d6;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}

body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--primary);text-decoration:none}

/* ========== SIDEBAR ========== */
.sidebar{width:220px;background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;border-right:1px solid var(--glass-border)}
.sidebar-brand{padding:24px 16px 20px;display:flex;align-items:center;gap:10px}
.sidebar-brand .logo{width:32px;height:32px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center}
.sidebar-brand .logo svg{width:18px;height:18px;color:#fff}
.sidebar-brand h1{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:2px;text-transform:uppercase}
.nav{flex:1;padding:8px}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.25);padding:20px 12px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;transition:all .15s;font-size:13px;border-radius:8px;color:rgba(255,255,255,.45);margin-bottom:2px;font-weight:400}
.nav-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.75)}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.6}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06)}
.theme-toggle{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-radius:8px;font-size:12px;color:rgba(255,255,255,.4);transition:all .15s}
.theme-toggle:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.7)}
.theme-toggle svg{width:16px;height:16px}

/* ========== MAIN ========== */
.main{margin-left:220px;flex:1;min-height:100vh}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .sidebar-brand h1{display:none}
.sidebar.collapsed .sidebar-brand{padding:16px 12px;justify-content:center}
.sidebar.collapsed .nav-item span{display:none}
.sidebar.collapsed .nav-item .kbd{display:none}
.sidebar.collapsed .nav-item{padding:10px 0;justify-content:center}
.sidebar.collapsed .nav-section{font-size:0;height:8px}
.sidebar.collapsed .sidebar-footer{padding:8px 4px}
.sidebar.collapsed .theme-toggle span,.sidebar.collapsed .theme-toggle svg+text,.sidebar.collapsed .sync-dot{font-size:0;overflow:hidden;white-space:nowrap;width:28px}
.sidebar.collapsed+.main,.main.sidebar-collapsed{margin-left:56px}
.sidebar-collapse-btn{position:absolute;top:50%;right:-12px;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--sidebar-bg);border:1px solid var(--glass-border);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:101;font-size:11px;transition:transform .2s}
.sidebar-collapse-btn:hover{color:var(--text);background:var(--bg2)}
.sidebar.collapsed .sidebar-collapse-btn{transform:translateY(-50%) rotate(180deg)}
.page-header{padding:24px 32px 20px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.page-header h2{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.2px}
.page-header .subtitle{color:var(--text3);font-size:12px;margin-top:4px;font-weight:400;letter-spacing:.2px}
.page-content{padding:24px 32px 48px}

/* ========== CARDS ========== */
.card{background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--glass-border);transition:background .3s}
.card-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:-.1px}
.card-body{padding:20px}

#app{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ========== STATS ========== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--glass-border);position:relative;overflow:hidden}
.stat .s-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
.stat .s-val{font-family:var(--serif);font-size:28px;font-weight:400;margin-top:6px;line-height:1.1;letter-spacing:-.3px}
.stat .s-sub{font-size:11px;color:var(--text2);margin-top:6px}
.stat.blue .s-val{color:var(--primary)}.stat.green .s-val{color:var(--green)}.stat.orange .s-val{color:var(--orange)}.stat.red .s-val{color:var(--accent)}.stat.purple .s-val{color:var(--purple)}

/* ========== TRIPS ========== */
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.trip-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--glass-border);cursor:pointer;transition:all .25s;overflow:hidden;position:relative}
.trip-card:hover{border-color:var(--primary);transform:translateY(-1px)}
.trip-accent{height:2px;background:var(--primary);opacity:.5}
.trip-body{padding:20px 22px}
.trip-name{font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:6px;letter-spacing:-.1px}
.trip-dates{font-size:12px;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.trip-locs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.loc{background:var(--primary-dim);color:var(--primary);font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.trip-foot{display:flex;gap:14px;font-size:11px;color:var(--text3)}
.trip-foot b{color:var(--text);font-weight:500}

/* ========== BUTTONS ========== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;font-family:inherit;letter-spacing:.2px}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-p:hover{filter:brightness(1.1)}
.btn-s{background:transparent;color:var(--text);border-color:var(--glass-border)}.btn-s:hover{border-color:var(--text3);background:var(--input-bg)}
.btn-d{background:var(--accent-dim);color:var(--accent);border-color:transparent}.btn-d:hover{background:rgba(232,112,112,.12)}
.btn-ghost{background:none;color:var(--text3);border:none;padding:6px 10px}.btn-ghost:hover{color:var(--text);background:var(--primary-dim)}

/* ========== FORMS ========== */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fi{display:flex;flex-direction:column;gap:3px}
.fi.full{grid-column:1/-1}
.fi label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px}
input.fc,select.fc,textarea.fc{padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--input-bg);color:var(--text);transition:border .15s;outline:none}
input.fc:focus,select.fc:focus,textarea.fc:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-glow)}
textarea.fc{resize:vertical;min-height:50px}

/* ========== TABS ========== */
.tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--bg2);border-radius:12px;padding:3px;border:1px solid var(--glass-border)}
.tab{padding:8px 16px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:10px;transition:all .15s;text-align:center;flex:1;letter-spacing:.2px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--primary);box-shadow:0 0 0 1px var(--glass-border)}

/* ========== ENTRY CARDS ========== */
.entry{background:var(--card);border:1px solid var(--glass-border);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:all .2s}
.entry:hover{border-color:var(--primary)}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.entry-top h4{font-size:13px;font-weight:600}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:12px}
.eg{display:flex;flex-direction:column;gap:1px}
.eg .ek{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.eg .ev{font-weight:500;color:var(--text)}

/* ========== MODAL ========== */
.modal-bg{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius-lg);width:100%;max-width:600px;box-shadow:0 24px 80px rgba(0,0,0,.4);border:1px solid var(--glass-border);animation:mIn .25s}
@keyframes mIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:var(--serif);font-size:17px;font-weight:500}
.modal-x{width:28px;height:28px;border:none;background:none;cursor:pointer;color:var(--text3);font-size:18px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg2)}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ========== DROPZONE ========== */
.dz{border:2px dashed var(--border);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.dz:hover,.dz.over{border-color:var(--primary);background:var(--primary-dim)}
.dz p{font-size:12px;color:var(--text2)}.dz .sm{font-size:11px;color:var(--text3);margin-top:3px}
.dz-icon{width:36px;height:36px;margin:0 auto 8px;background:var(--primary-dim);border-radius:10px;display:flex;align-items:center;justify-content:center}
.dz-icon svg{width:18px;height:18px;color:var(--primary)}
.ocr-prog{margin-top:8px;font-size:11px;color:var(--primary);display:flex;align-items:center;gap:6px}
.ocr-prog .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ocr-out{margin-top:8px;padding:8px 10px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;font-size:11px;max-height:120px;overflow-y:auto;white-space:pre-wrap;color:var(--text2);font-family:'SF Mono',Monaco,monospace}

/* ========== CALENDAR ========== */
.cal-nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:16px}
@media(max-width:480px){.cal-nav{gap:8px}.cal-nav h3{flex:1 1 100%;order:-1}}
.cal-nav h3{font-family:var(--serif);font-size:17px;font-weight:500;min-width:180px;letter-spacing:-.1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;border:1px solid var(--glass-border)}
.cal-head{background:var(--bg2);padding:8px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.cal-day{background:var(--bg);min-height:80px;min-width:0;padding:4px 6px;font-size:11px;position:relative;cursor:pointer;transition:background .15s;overflow-wrap:break-word}
.cal-day:hover{background:var(--card-hover)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-day.other{opacity:.2}
.cal-day .d-num{font-weight:600;margin-bottom:2px;font-size:12px}
.cal-day .d-num.weekend{color:var(--accent)}
.cal-day .d-ph{font-size:10px;font-weight:600;margin-bottom:1px;padding:1px 4px;border-radius:3px;display:inline-block;max-width:100%;line-height:1.25;white-space:normal;overflow-wrap:break-word}
.cal-day .d-ph.ph-sg,.d-ph.ph-c0{background:var(--sg-dim);color:var(--sg)}
.cal-day .d-ph.ph-my,.d-ph.ph-c1{background:var(--my-dim);color:var(--my)}
.d-ph.ph-c2{background:rgba(245,158,11,.15);color:#f59e0b}.d-ph.ph-c3{background:rgba(34,197,94,.15);color:#22c55e}.d-ph.ph-c4,.d-ph.ph-c5{background:rgba(148,163,184,.18);color:var(--text2)}.d-ph.ph-c9{background:rgba(236,72,153,.15);color:#ec4899}
.cal-trip{font-size:10.5px;padding:1px 4px;border-radius:3px;margin-bottom:1px;line-height:1.3;white-space:normal;overflow-wrap:break-word;hyphens:manual;cursor:pointer;font-weight:500;color:#fff}

/* ========== LEAVE ========== */
.leave-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
.lb{padding:20px 16px;border-radius:var(--radius);text-align:center;border:1px solid var(--glass-border);position:relative;overflow:hidden}
.lb .lv{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.3px}
.lb .ll{font-size:10.5px;color:var(--text2);margin-top:6px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500}
.lb.t-total{background:var(--primary-dim);color:var(--primary)}
.lb.t-taken{background:var(--accent-dim);color:var(--accent)}
.lb.t-bal{background:var(--green-dim);color:var(--green)}
.lb.t-ot{background:var(--orange-dim);color:var(--orange)}
.lb.t-al{background:var(--purple-dim);color:var(--purple)}
.lb.t-req{background:rgba(244,63,94,.06);color:var(--accent);border-color:rgba(244,63,94,.15)}
.lb.t-applied{background:rgba(16,185,129,.06);color:var(--green);border-color:rgba(16,185,129,.15)}

/* ========== BUDGET ========== */
.b-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.b-row:last-child{border:none}
.b-total{background:var(--primary-dim);padding:12px 14px;border-radius:0 0 var(--radius) var(--radius);display:flex;justify-content:space-between;font-weight:600}

/* ========== TAGS ========== */
.tag{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag-b{background:var(--primary-dim);color:var(--primary)}
.tag-g{background:var(--green-dim);color:var(--green)}
.tag-r{background:var(--accent-dim);color:var(--accent)}
.tag-o{background:var(--orange-dim);color:var(--orange)}

/* ========== YEAR TABS ========== */
.cat-group{margin-bottom:28px}.cat-group-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}.cat-group-header h3{font-family:var(--serif);font-weight:500}
.clash-badge{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.clash-link{cursor:pointer}
.world-map-container{position:relative;width:100%;max-width:1000px;margin:0 auto;background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--glass-border);overflow:hidden;padding:20px}
.world-map-container svg{width:100%;height:auto}
.world-map-container path.country{fill:var(--bg2);stroke:var(--glass-border);stroke-width:.5;cursor:pointer;transition:fill .2s}
.world-map-container path.country:hover{fill:var(--text3);opacity:.8}
.world-map-container path.country.visited{fill:var(--primary);opacity:.85}
.world-map-container path.country.visited:hover{fill:var(--glow-1);opacity:1}
.world-map-container path.country.untracked{fill:var(--bg2);opacity:.3;cursor:default}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:16px}
.country-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--text2);border:1px solid transparent;transition:all .15s}
.country-item:hover{border-color:var(--glass-border);color:var(--text)}
.country-item.visited{background:rgba(108,140,255,.08);border-color:rgba(108,140,255,.2);color:var(--text)}
.country-item .ci-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.country-item.visited .ci-check{background:var(--primary);border-color:var(--primary)}

.tl-item{position:relative;margin-bottom:16px;padding-left:12px}
.tl-item::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--primary);background:var(--card)}
.tl-item.tl-flight::before{border-color:var(--primary);background:var(--primary-dim)}
.tl-item.tl-hotel::before{border-color:var(--green);background:var(--green-dim)}
.tl-item.tl-activity::before{border-color:var(--orange);background:var(--orange-dim)}
.tl-item.tl-transport::before{border-color:var(--purple);background:var(--purple-dim)}
.tl-date{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.tl-content{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px}
.tl-content h4{font-size:12px;font-weight:600;margin-bottom:2px}
.tl-content .tl-sub{color:var(--text2);font-size:11px}

/* ========== BUDGET CHART ========== */
.budget-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.budget-bar .bb-label{min-width:80px;color:var(--text2);font-weight:500;text-align:right}
.budget-bar .bb-track{flex:1;height:20px;background:var(--bg2);border-radius:4px;overflow:hidden;position:relative}
.budget-bar .bb-fill{height:100%;border-radius:4px;transition:width .3s}
.budget-bar .bb-val{min-width:80px;font-weight:600}

/* ========== SYNC INDICATOR ========== */
.sync-dot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text3);padding:3px 8px;border-radius:6px;background:var(--bg2)}
.sync-dot.connected{color:var(--green)}
.sync-dot .sd-icon{width:6px;height:6px;border-radius:50%;background:currentColor}
.sync-dot.syncing .sd-icon{animation:syncPulse 1s infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.3}}
.offline-banner{position:fixed;top:0;left:0;right:0;padding:8px;background:#ff6b6b;color:#fff;text-align:center;font-size:12px;font-weight:600;z-index:999;transform:translateY(-100%);transition:transform .3s}
.offline-banner.show{transform:translateY(0)}

/* ========== COUNTDOWN ========== */
.countdown{display:flex;gap:8px;align-items:baseline}
.cd-num{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--primary);line-height:1;letter-spacing:-.3px}
.cd-unit{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}

/* ========== LEAVE CALENDAR DOTS ========== */
.cal-day .d-leave{font-size:10.5px;color:var(--purple);font-weight:500;margin-bottom:1px}

/* ========== ATTACHMENT LINK ========== */
.attach-link{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--primary-dim);border-radius:6px;font-size:11px;color:var(--primary);cursor:pointer;margin-top:4px}
.attach-link:hover{background:var(--primary-glow)}

/* ========== KEYBOARD SHORTCUT HINT ========== */
.kbd{display:inline-flex;padding:1px 5px;border:1px solid var(--glass-border);border-radius:4px;font-size:10px;font-family:'JetBrains Mono','SF Mono',Monaco,monospace;color:var(--text3);background:transparent}

/* ========== PH LEGEND ========== */
.ph-legend{display:flex;gap:16px;margin-top:16px;padding:12px 16px;background:var(--card);border:1px solid var(--glass-border);border-radius:8px;font-size:11px;flex-wrap:wrap}
.ph-legend-item{display:flex;align-items:center;gap:6px}
.ph-dot{width:8px;height:8px;border-radius:50%}
.ph-dot.sg,.ph-dot.c0{background:var(--sg)}.ph-dot.my,.ph-dot.c1{background:var(--my)}.ph-dot.c2{background:#f59e0b}.ph-dot.c3{background:#22c55e}.ph-dot.c4,.ph-dot.c5{background:var(--text3)}.ph-dot.c9{background:#ec4899}

/* ========== LEAVE APPLIED TABLE ========== */
.la-table{width:100%;font-size:12px;border-collapse:collapse}
.leave-boxes .lb .ls{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.35}
.lv-note{font-size:12.5px;color:var(--text2);padding:10px 14px;border:1px solid var(--line);margin:-10px 0 16px;background:var(--card)}
.lv-note.warn{border-color:var(--orange);color:var(--orange);background:var(--orange-dim)}
.lv-note.bad{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.lv-note+.lv-note{margin-top:-8px}
.lv-sum{font-size:12px;color:var(--text2);padding:8px 12px;background:var(--input-bg);border:1px solid var(--line);margin-bottom:6px;line-height:1.5}
.lv-grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--text3);margin:14px 0 6px;font-weight:500}
.lv-chk{display:flex!important;align-items:center;gap:7px;font-size:12px!important;text-transform:none!important;letter-spacing:0!important;color:var(--text2)!important;margin-top:6px;cursor:pointer;font-weight:400!important}
.lv-chk input{width:16px;height:16px;accent-color:var(--primary);margin:0}
.lv-present{display:flex;align-items:center;gap:6px;color:var(--text);opacity:.85}
.lv-present span{font-size:11px;color:var(--text3)}
.la-st{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);border:1px solid var(--line);padding:1px 6px;margin-left:4px;white-space:nowrap}
.la-st.up{color:var(--green);border-color:var(--green)}
.la-half{font-size:10.5px;color:var(--text3)}
.lieu-sug{border-bottom:1px solid var(--line)}
button.lb-go{font:inherit;cursor:pointer;width:100%;transition:background .15s}
button.lb-go:hover{background:var(--card-hover)!important}
button.lb-go .ls u{text-decoration:none;color:var(--primary-deep)}
button.lb-go:hover .ls u{text-decoration:underline}
.lvd-intro{font-size:13px;color:var(--text2);margin:0 0 12px}
.lvd-list{border-top:1px solid var(--line)}
.lvd-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lvd-main{flex:1;min-width:0}
.lvd-head{font-size:13px;color:var(--text);margin-bottom:4px}
.lvd-sub{font-size:12px;color:var(--text2);margin-top:3px}
.lvd-muted{color:var(--text3)}
.lvd-trip{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:5px 0;font:600 13.5px var(--font);color:var(--text);cursor:pointer;text-align:left}
.lvd-trip:hover{color:var(--primary-deep)}
.lvd-dot{width:8px;height:8px;border-radius:50%;flex:none}
.lvd-go{margin-left:auto;color:var(--text3);font-weight:400}
.lieu-sug-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:12px;color:var(--text2);border-top:1px solid var(--line);flex-wrap:wrap}
.lieu-sug-row:first-child{border-top:0}
.lieu-sug-acts{display:flex;gap:6px;flex:none}
.la-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);padding:8px 12px;border-bottom:1px solid var(--border);font-weight:600}
.la-table td{padding:8px 12px;border-bottom:1px solid var(--glass-border)}
.la-table tr:hover td{background:var(--card)}
.la-add-row{display:flex;gap:8px;padding:12px;align-items:flex-end;flex-wrap:wrap}

/* ========== TIME PERIOD FILTER ========== */
.tp-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-sel{width:auto;min-width:90px;padding:4px 8px;font-size:11px;border-radius:6px;background:var(--input-bg);border:1px solid var(--border);color:var(--text);cursor:pointer}
.tp-date{width:auto;padding:5px 8px;font-size:11px;border-radius:6px;background:var(--input-bg);border:1px solid var(--border);color:var(--text)}

@media(max-width:960px){
  .cal-day{min-height:60px;padding:3px 2px;font-size:10px}
  .cal-day .d-num{font-size:11px}
  .cal-day .d-ph{font-size:7px}
  .cal-trip{font-size:10px;padding:1px 2px;letter-spacing:-.1px}
  .cal-head{padding:6px 4px;font-size:10.5px}
  .cal-head .ch-full{display:none}
  .cal-head .ch-short{display:inline}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .main{margin-left:0}
  .page-header{padding-left:56px}
  .page-content{padding:14px}
  .fg{grid-template-columns:1fr}
  .trip-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}.stat .s-val{font-size:20px}.stat{padding:10px 12px}
  .search-bar{max-width:100%}
  .fab{bottom:16px;right:16px;padding:0 14px 0 12px;height:42px;font-size:12px}
  .tp-filter{flex-wrap:wrap}
  .tp-sel{min-width:100px;font-size:11px;padding:5px 6px}
  .tp-date{font-size:10px;padding:4px 6px;max-width:120px}
  .page-header{flex-wrap:wrap;gap:8px}
  .leave-boxes{grid-template-columns:repeat(2,1fr)}
  .la-table{font-size:11px}
  .la-table th,.la-table td{padding:6px 8px}
  .entry-grid{grid-template-columns:1fr}
  .entry-top h4{font-size:13px}
  .entry-top{flex-wrap:wrap;gap:6px}
  .clash-badge{font-size:10px;padding:1px 4px}
  .sidebar-collapse-btn{display:none}
}
.guide-intro{font-size:12px;color:var(--text2);margin:0 0 10px}
.guide-sec{border-top:1px solid var(--border);padding:2px 0}
.guide-sec summary{cursor:pointer;padding:10px 0;font-size:13px;font-weight:600;color:var(--text1,inherit);list-style-position:inside}
.guide-body{font-size:12.5px;line-height:1.65;color:var(--text2);padding:0 0 12px}
.guide-body ol,.guide-body ul{margin:0;padding-left:20px}
.guide-body li{margin:0 0 6px}
.guide-body p{margin:0 0 8px}
.guide-note{font-size:11.5px;color:var(--text3);margin-top:8px!important}
/* Minimal lists: Dashboard + My Events */
.main{min-width:0}
.page-content,.dash>*,.sec,.toolbar{min-width:0;max-width:100%}
.page-header>div{min-width:0}

.dash{display:flex;flex-direction:column;gap:22px}
.sec{margin-bottom:18px}
.dash .sec{margin-bottom:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin:0 2px 8px}
.sec-h a{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--primary);text-decoration:none}
.sec-h .cnt{font-weight:500;color:var(--text3);opacity:.8}
.quiet{font-size:12px;color:var(--text3);margin:4px 2px}
.evr-list{display:flex;flex-direction:column;border:1px solid var(--glass-border);border-radius:12px;overflow:hidden;background:var(--bg2)}

.evr:hover{background:var(--card-hover)}
.evr.drop-over{background:var(--primary-dim,rgba(108,140,255,.15));box-shadow:inset 0 0 0 2px var(--primary)}

.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--primary))}
.hero:hover{background:var(--card-hover)}
.hero.drop-over{box-shadow:inset 0 0 0 2px var(--primary)}
.hero-k{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}

.hero-name{font-family:var(--serif);font-size:24px;line-height:1.2;letter-spacing:-.2px}
.hero-meta{font-size:13px;color:var(--text2);margin-top:4px}
.hero-cd{text-align:right;flex-shrink:0;line-height:1.1}
.hero-cd b{display:block;font-family:var(--serif);font-size:32px;font-weight:500;color:var(--primary)}
.hero-cd span{font-size:11px;color:var(--text3)}

.tb-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}

/* Calendar: month bars, list view, day details */
.cal-tools{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--glass-border);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--text2);font:inherit;font-size:12px;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.calm{border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;background:var(--border)}
.calm-head{display:grid;grid-template-columns:var(--cal-cols);gap:1px;background:var(--border)}
.calm-hc{position:relative;background:var(--bg2);padding:8px 4px;text-align:center;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;user-select:none}
.calm-hc.wk{color:var(--accent)}
.calm-hc .ch-short{display:none}
.calm-rh{position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:3}
.calm-rh::after{content:'';position:absolute;left:4px;top:25%;height:50%;width:2px;border-radius:1px;background:var(--glass-border);opacity:0;transition:opacity .15s}
.calm-hc:hover .calm-rh::after,.calm-rh:hover::after{opacity:1;background:var(--primary)}
.calm-week{display:grid;column-gap:1px;row-gap:2px;min-height:96px;border-top:1px solid var(--border);background:var(--border)}
.calm-bg{background:var(--bg);cursor:pointer;transition:background .15s;z-index:0}
.calm-bg:hover{background:var(--card-hover)}
.calm-bg.other{background:var(--bg2);opacity:.55}
.calm-bg.today{box-shadow:inset 0 0 0 2px var(--primary)}

<script>
// ===== PDF.js =====
// Local calendar date "YYYY-MM-DD" (toISOString() is UTC, a day behind before 8am in Singapore)
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function initPdfJs(){if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
initPdfJs();

// ===== CONSTANTS =====
const CUR=['SGD','MYR','USD','IDR','EUR','JPY','THB','PHP','AUD','GBP','CNY','MVR','EGP','TWD','KRW'];
const DRATES={SGD:1,MYR:0.284,USD:1.34,IDR:0.0000847,EUR:1.46,JPY:0.0089,THB:0.038,PHP:0.024,AUD:0.87,GBP:1.70,CNY:0.185,MVR:0.087,EGP:0.027,TWD:0.042,KRW:0.00098};
const EVENT_COLORS=['#6c8cff','#ff6b6b','#4ade80','#fb923c','#a78bfa','#f472b6','#22d3ee','#facc15','#34d399','#f87171'];
const ACT_COLORS=['#2ea8a0','#d49650','#c87070','#d47898','#5aad6a','#4da0d0','#b07cc8','#d4a050','#6aab8e','#5a9ec8'];
// Product name (shown in the sidebar, title, exports and calendar feed). Stored data keys keep their old names.
const APP_NAME='The Planner';
const APP_TAGLINE='Your days and journeys, planned.';
const CATEGORIES=[
  {id:'trip',label:'Trip',color:'#8a7fe8'},
  {id:'work',label:'Work',color:'#c99a5b'},
  {id:'training',label:'Training',color:'#c87878'},
  {id:'social',label:'Social',color:'#c983a6'},
  {id:'personal',label:'Personal',color:'#7fae8c'},
  {id:'activity',label:'Activity',color:'#6fa3c8'}
];
function catColor(c){const cat=CATEGORIES.find(x=>x.id===c);return cat?cat.color:'#8a7fe8';}
function catLabel(c){const cat=CATEGORIES.find(x=>x.id===c);return cat?cat.label:c||'Trip';}

// ===== COUNTRY SYNC =====
function syncEventCountries(){
  if(!S.visitedCountries)S.visitedCountries=[];
  const vc=new Set(S.visitedCountries);
  let added=0;
  for(const ev of S.events){
    if(!ev.countries)continue;
    for(const cid of ev.countries){
      if(!vc.has(cid)){vc.add(cid);added++;}
    }
  }
  if(added){S.visitedCountries=[...vc];}
  return added;
}
function eventsForCountry(cid){
  return(S.events||[]).filter(ev=>ev.countries&&ev.countries.includes(cid));
}

// ===== CLASH DETECTION =====
function eventToInterval(ev){
  if(!ev.startDate||!ev.endDate)return null;
  const sTime=ev.startTime||null, eTime=ev.endTime||null;
  const hasTime=!!(sTime&&eTime);
  const start=new Date(ev.startDate+'T'+(sTime||'00:00')+':00');
  const end=new Date(ev.endDate+'T'+(eTime||'23:59')+':00');
  return {start,end,hasTime};
}
function intervalsOverlap(a,b){
  return a.start<b.end&&b.start<a.end;
}
function findClashes(ev,excludeId){
  const intA=eventToInterval(ev);
  if(!intA)return[];
  const clashes=[];
  for(const other of S.events){
    if(other.id===excludeId)continue;
    const intB=eventToInterval(other);
    if(!intB)continue;
    if(!intervalsOverlap(intA,intB))continue;
    // Classify severity: time-sensitive = both have explicit times and those times overlap
    const bothTimed=intA.hasTime&&intB.hasTime;
    // For date-only overlaps on multi-day trips, only flag if same day (not just range overlap for long trips)
    if(!bothTimed){
      // If both are multi-day without times, only flag if the date ranges overlap AND
      // at least one is single-day or they share an exact start/end date
      const sameDayTouch=ev.startDate===other.startDate||ev.startDate===other.endDate||ev.endDate===other.startDate||ev.endDate===other.endDate;
      const eitherSingleDay=(ev.startDate===ev.endDate)||(other.startDate===other.endDate);
      if(!sameDayTouch&&!eitherSingleDay)continue;
    }
    clashes.push({event:other,severity:bothTimed?'time':'date'});
  }
  return clashes;
}
function clashBadgeHtml(ev,clickable){
  const cl=findClashes(ev,ev.id);
  if(!cl.length)return'';
  const timeCl=cl.filter(c=>c.severity==='time');
  if(clickable){
    if(timeCl.length)return`<span class="clash-badge clash-time clash-link" data-action="show-clash" data-id="${ev.id}" title="Time clash with ${timeCl.map(c=>c.event.name).join(', ')} — click to view">⚠ Clash</span>`;
    return`<span class="clash-badge clash-date clash-link" data-action="show-clash" data-id="${ev.id}" title="Date overlap with ${cl.map(c=>c.event.name).join(', ')} — click to view">⚠ Overlap</span>`;
  }
  if(timeCl.length)return`<span class="clash-badge clash-time" title="Time clash with ${timeCl.map(c=>c.event.name).join(', ')}">⚠ Clash</span>`;
  return`<span class="clash-badge clash-date" title="Date overlap with ${cl.map(c=>c.event.name).join(', ')}">⚠ Overlap</span>`;
}
function eventPaymentStatus(t){
  const items=[...(t.flights||[]),...(t.hotels||[]),...(t.activities||[]),...(t.transport||[])];
  if(!items.length)return null;
  const withPay=items.filter(i=>i.depositAmount||i.fullPaymentAmount||i.paymentDueDate||i.fullyPaid);
  if(!withPay.length)return null;
  const allPaid=withPay.every(i=>i.fullyPaid==='yes');
  const td=ymd(new Date());
  const overdue=withPay.filter(i=>i.paymentDueDate&&i.fullyPaid!=='yes'&&i.paymentDueDate<td);
  const upcoming=withPay.filter(i=>i.paymentDueDate&&i.fullyPaid!=='yes'&&i.paymentDueDate>=td);
  const unpaidDeposits=withPay.filter(i=>i.depositAmount&&i.depositPaid!=='yes');
  if(allPaid)return{status:'paid',label:'Fully Paid',color:'var(--green)'};
  if(overdue.length)return{status:'overdue',label:'Payment Overdue',color:'var(--accent)'};
  if(unpaidDeposits.length)return{status:'deposit-due',label:'Deposit Due',color:'var(--orange)'};
  if(upcoming.length)return{status:'payment-pending',label:'Payment Pending',color:'var(--orange)'};
  return{status:'partial',label:'Partially Paid',color:'var(--text2)'};
}
function clashWarningHtml(clashes){
  if(!clashes.length)return'';
  const timeCl=clashes.filter(c=>c.severity==='time');
  const dateCl=clashes.filter(c=>c.severity==='date');
  let html='<div class="clash-warning">';
  html+='<div class="clash-warning-icon">⚠️</div>';
  if(timeCl.length){
    html+=`<div class="clash-warning-text"><strong>Time clash detected</strong> — overlaps with:<br>${timeCl.map(c=>`<span class="clash-event-name">${esc(c.event.name)}</span> (${fmt(c.event.startDate)}${c.event.startTime?' '+c.event.startTime:''}–${fmt(c.event.endDate)}${c.event.endTime?' '+c.event.endTime:''})`).join('<br>')}</div>`;
  }
  if(dateCl.length){
    html+=`<div class="clash-warning-text">${timeCl.length?'Also has ':'Has '}<strong>date overlap</strong> with: ${dateCl.map(c=>`<span class="clash-event-name">${esc(c.event.name)}</span>`).join(', ')}</div>`;
  }
  html+='</div>';
  return html;
}

function clashCardHtml(t){
  const st=eventStatus(t);const cc=catColor(t.category||'trip');
  return`<div class="entry clash-ev-card" style="cursor:pointer;border-left:3px solid ${cc};margin:6px 0;padding:10px 12px" data-clash-nav="${t.id}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="font-weight:600;font-size:13px;color:var(--text)">${esc(t.name)}</div>
      <div style="display:flex;gap:4px;align-items:center"><span class="tag" style="font-size:10.5px;background:${cc}22;color:${cc}">${catLabel(t.category||'trip')}</span><span class="badge badge-${st}">${st}</span></div>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:4px">${fmtS(t.startDate)}${t.startTime?' '+t.startTime:''} — ${fmtS(t.endDate)}${t.endTime?' '+t.endTime:''}</div>
    <div style="font-size:11px;color:var(--text3);margin-top:2px">${t.locations.join(', ')||'No locations'}</div>
  </div>`;
}

function showClashModal(eventId){
  const o=document.getElementById('mbg');
  let body='';
  if(eventId){
    const ev=S.events.find(e=>e.id===eventId);
    if(!ev){xm();return;}
    const cl=findClashes(ev,ev.id);
    if(!cl.length){xm();return;}
    const timeCl=cl.filter(c=>c.severity==='time');
    const dateCl=cl.filter(c=>c.severity==='date');
    body+=clashCardHtml(ev);
    if(timeCl.length){
      body+=`<div style="font-size:11px;font-weight:600;color:#ef4444;margin:12px 0 4px;display:flex;align-items:center;gap:4px"><span>⚠</span> Time clashes with:</div>`;
      timeCl.forEach(c=>{body+=clashCardHtml(c.event);});
    }
    if(dateCl.length){
      body+=`<div style="font-size:11px;font-weight:600;color:#fb923c;margin:12px 0 4px;display:flex;align-items:center;gap:4px"><span>⚠</span> Date overlaps with:</div>`;
      dateCl.forEach(c=>{body+=clashCardHtml(c.event);});
    }
  }else{
    // All clashes grouped
    const seen=new Set();
    const groups=[];
    for(const ev of S.events){
      if(seen.has(ev.id))continue;
      const cl=findClashes(ev,ev.id);
      if(!cl.length)continue;
      const group={event:ev,clashes:cl};
      seen.add(ev.id);
      cl.forEach(c=>seen.add(c.event.id));
      groups.push(group);
    }
    if(!groups.length){body='<div style="text-align:center;color:var(--text3);padding:20px">No clashes found</div>';}
    else{
      groups.forEach((g,i)=>{
        const timeCl=g.clashes.filter(c=>c.severity==='time');
        const dateCl=g.clashes.filter(c=>c.severity==='date');
        const severity=timeCl.length?'time':'date';
        const sevColor=severity==='time'?'#ef4444':'#fb923c';
        const sevLabel=timeCl.length?'Time Clash':'Date Overlap';
        body+=`<div style="margin:${i?'16px':'0'} 0 0;padding:12px;border-radius:10px;background:${sevColor}08;border:1px solid ${sevColor}25">`;
        body+=`<div style="font-size:11px;font-weight:600;color:${sevColor};margin-bottom:8px;display:flex;align-items:center;gap:4px"><span>⚠</span> ${sevLabel}</div>`;
        body+=clashCardHtml(g.event);
        g.clashes.forEach(c=>{body+=clashCardHtml(c.event);});
        body+=`</div>`;
      });
    }
  }
  o.innerHTML=`<div class="modal"><div class="modal-head"><h3>${eventId?'Event Clashes':'All Clashes'}</h3><button class="modal-x" data-action="xm">×</button></div><div class="modal-body" style="max-height:70vh;overflow-y:auto">${body}</div><div class="modal-foot"><button class="btn btn-s" data-action="xm">Close</button></div></div>`;
  o.classList.add('open');
  o.onclick=e=>{if(e.target===o)xm();};
  // Make cards clickable — close modal and navigate
  o.querySelectorAll('[data-clash-nav]').forEach(card=>{
    card.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const eid=card.getAttribute('data-clash-nav');xm();nav('detail',{detailId:eid});},true);
  });
}

function tpRange(tp){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(!tp||tp==='all')return{from:null,to:null};
  if(tp==='year')return{from:y+'-01-01',to:y+'-12-31'};
  if(tp==='quarter'){const q=Math.floor(m/3)*3;const qs=new Date(y,q,1),qe=new Date(y,q+3,0);return{from:ymd(qs),to:ymd(qe)};}
  if(tp==='3m'){const d=new Date(now);d.setMonth(d.getMonth()-3);return{from:ymd(d),to:ymd(now)};}
  if(tp==='6m'){const d=new Date(now);d.setMonth(d.getMonth()-6);return{from:ymd(d),to:ymd(now)};}
  if(tp==='custom')return{from:S._tpFrom||null,to:S._tpTo||null};
  return{from:null,to:null};
}
function tpFilter(events){
  const r=tpRange(S._tp);
  if(!r.from&&!r.to)return events;
  return events.filter(t=>{
    if(r.from&&t.endDate<r.from)return false;
    if(r.to&&t.startDate>r.to)return false;
    return true;
  });
}

// Merge remote events into local — never deletes local events missing from remote
function mergeEvents(local,remote){
  const merged=[...local];
  const localIds=new Set(local.map(e=>e.id));
  for(const re of remote){
    const idx=merged.findIndex(e=>e.id===re.id);
    if(idx>=0){merged[idx]=re;} // update existing
    else{merged.push(re);} // add new from remote
  }
  return merged;
}
let _appErrorState=false; // set true if app hits runtime error
let _syncTimer=null;
function debouncedSync(){
  if(!cloudMode()||_appErrorState)return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(()=>{_syncTimer=null;cloudPush();},3000);
}

let _pollTimer=null;
function startSyncPolling(){
  if(_pollTimer)return;
  _pollTimer=setInterval(()=>{
    if(document.visibilityState==='visible'&&cloudMode()){
      cloudPull().then(pulled=>{if(pulled)render();});
    }

let _syncErrorState=null; // null = ok, '401' = token expired, 'error' = other error
async function gistAPI(path,opts={}){
  const c=getSyncConfig();if(!c.token)throw new Error('No token');
  const hdrs={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.v3+json',...(opts.headers||{})};
  if(opts.body)hdrs['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,{...opts,headers:hdrs});
  if(!r.ok){const t=await r.text().catch(()=>'');if(r.status===401){_syncErrorState='401';updateSyncStatus('Token expired');stopSyncPolling();render();}else{_syncErrorState='error';}throw new Error('GitHub API '+r.status+': '+(t||'unknown error'));}
  _syncErrorState=null;
  const txt=await r.text();
  if(!txt)return {};
  return JSON.parse(txt);
}

function syncData(){
  // Extract only the data fields worth syncing (not UI state like current view)
  const {events,leave,rates,ratesUpdated,theme,ly,calY,calM,lastModified,visitedCountries,appleCalUrl,appleCalUrlAt,prefs,calFeed,docs}=S;const trips=events;
  return {events,trips,leave,rates,ratesUpdated,theme,ly,calY,calM,lastModified,visitedCountries:visitedCountries||[],appleCalUrl:appleCalUrl||'',appleCalUrlAt:appleCalUrlAt||0,...(prefs?{prefs}:{}),...(calFeed?{calFeed}:{}),...(docs?{docs}:{})};
}

// Apple Calendar URL is merged by its own timestamp (not lastModified), so a device
// that never received the URL can't wipe it by pushing newer unrelated edits.
function mergeAppleCalUrl(r){
  if(!r)return false;
  const lt=S.appleCalUrlAt||0,rt=r.appleCalUrlAt||0,rUrl=r.appleCalUrl||'';
  if(rt>lt||(!lt&&!rt&&rUrl&&!S.appleCalUrl)){
    const changed=rUrl!==(S.appleCalUrl||'');
    S.appleCalUrl=rUrl;S.appleCalUrlAt=rt;return changed;
  }
  return false;
}

async function findExistingGist(){
  const gists=await gistAPI('/gists?per_page=100');
  return gists.find(g=>g.files&&g.files[GIST_FILE]);
}

async function pushToGist(retried){
  const c=getSyncConfig();if(!c.token)return;
  // Guard: don't push if app errored or events suspiciously empty
  if(_appErrorState){console.warn('Push blocked: app in error state');return;}
  if((S.events||[]).length===0){console.warn('Push blocked: empty events array');return;}
  document.querySelectorAll('.sync-dot').forEach(d=>d.classList.add('syncing'));
  // Before pushing, merge remote visitedCountries so we never overwrite with fewer
  try{if(c.gistId){const g=await gistAPI('/gists/'+c.gistId);if(g&&g.files&&g.files[GIST_FILE]){const r=JSON.parse(g.files[GIST_FILE].content);if(r.migratedToAccount){c.retired=true;c.migratedTo=r.migratedTo;setSyncConfig(c);updateSyncStatus('Your data has moved to an account — sign in under Settings → Your Account');document.querySelectorAll('.sync-dot').forEach(d=>d.classList.remove('syncing'));render();return;}if(r.visitedCountries&&r.visitedCountries.length){const local=new Set(S.visitedCountries||[]);r.visitedCountries.forEach(x=>local.add(x));S.visitedCountries=[...local];}mergeAppleCalUrl(r);}}}catch(e){/* non-fatal */}
  const payload={description:GIST_DESC,files:{[GIST_FILE]:{content:JSON.stringify(syncData(),null,2)}}};
  try{
    let resp;
    if(c.gistId){
      resp=await gistAPI('/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify(payload)});
    }else{
      // Try to find existing gist first before creating new
      const existing=await findExistingGist();
      if(existing){
        c.gistId=existing.id;setSyncConfig(c);
        resp=await gistAPI('/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify(payload)});
      }else{
        const g=await gistAPI('/gists',{method:'POST',body:JSON.stringify({...payload,public:false})});
        c.gistId=g.id;setSyncConfig(c);
        resp=g;
      }
    }
    if(resp&&resp.owner&&resp.owner.login&&c.gistOwner!==resp.owner.login){c.gistOwner=resp.owner.login;}
    c.lastPush=Date.now();setSyncConfig(c);
    updateSyncStatus('Synced just now');
  }catch(e){
    // 409 = conflict / stale gist ID — clear it and retry once
    if(!retried&&(e.message.includes('409')||e.message.includes('cannot be updated'))){
      console.warn('Gist conflict, clearing cached ID and retrying…');
      c.gistId=null;setSyncConfig(c);
      return pushToGist(true);
    }
    console.error('Push failed:',e);updateSyncStatus('Sync error: '+e.message);
  }finally{document.querySelectorAll('.sync-dot').forEach(d=>d.classList.remove('syncing'));}
}

async function pullFromGist(retried){
  const c=getSyncConfig();if(!c.token)return false;
  try{
    let gist;
    if(c.gistId){
      try{gist=await gistAPI('/gists/'+c.gistId);}
      catch(e2){
        if(!retried&&(e2.message.includes('404')||e2.message.includes('409'))){
          console.warn('Gist not found/conflict, re-searching…');
          c.gistId=null;setSyncConfig(c);return pullFromGist(true);
        }
        throw e2;
      }
    }
    else{const found=await findExistingGist();if(found){c.gistId=found.id;setSyncConfig(c);gist=await gistAPI('/gists/'+found.id);}else return false;}
    if(!gist||!gist.files||!gist.files[GIST_FILE])return false;
    if(gist.owner&&gist.owner.login&&c.gistOwner!==gist.owner.login){c.gistOwner=gist.owner.login;setSyncConfig(c);}
    // One-time privacy migration: if the sync gist is still public, recreate it as secret
    if(gist.public===true&&!window._gistMigrating){window._gistMigrating=true;ensureGistSecret(c.gistId).finally(()=>{window._gistMigrating=false;});}
    const remote=JSON.parse(gist.files[GIST_FILE].content);
    if(remote.migratedToAccount&&!c.retired){c.retired=true;c.migratedTo=remote.migratedTo;setSyncConfig(c);updateSyncStatus('Your data has moved to an account — sign in under Settings → Your Account');render();return false;}
    // Always merge visitedCountries via union regardless of lastModified
    let vcChanged=mergeAppleCalUrl(remote);
    if(remote.visitedCountries&&remote.visitedCountries.length){const local=new Set(S.visitedCountries||[]);const before=local.size;remote.visitedCountries.forEach(c=>local.add(c));if(local.size>before){S.visitedCountries=[...local];vcChanged=true;}}
    if(remote.lastModified&&(!S.lastModified||remote.lastModified>S.lastModified)){
      backupBeforeSync();
      const remoteEvts=(remote.events||remote.trips||[]).map(t=>t.category?t:{...t,category:'trip',requiresLeave:true});
      S.events=mergeEvents(S.events||[],remoteEvts);
      S.leave=remote.leave||S.leave;
      S.rates=remote.rates||S.rates;
      S.ratesUpdated=remote.ratesUpdated||S.ratesUpdated;
      S.theme=remote.theme||S.theme;if(remote.prefs)S.prefs=remote.prefs;
      S.lastModified=remote.lastModified;
      try{localStorage.setItem('htV5',JSON.stringify(S));}catch(e){}
      importAppleCalendar(gist.files[APPLE_ICS_FILE]?gist.files[APPLE_ICS_FILE].content:'');
      applyTheme();render();
      updateSyncStatus('Pulled latest data');
      return true;
    }
    const appleChanged=importAppleCalendar(gist.files[APPLE_ICS_FILE]?gist.files[APPLE_ICS_FILE].content:'');
    if(vcChanged||appleChanged){try{localStorage.setItem('htV5',JSON.stringify(S));}catch(e){}render();updateSyncStatus(appleChanged?'Imported from Apple Calendar':'Merged countries');return true;}

// Secret gists remain link-accessible, so device linking and the iCloud

// recreate the gist and delete the public one.
async function ensureGistSecret(gistId){
  try{
    const gist=await gistAPI('/gists/'+gistId);
    if(gist&&gist.public===true){
      console.log('Gist is public — recreating as secret…');
      // Copy ALL files (data JSON, calendar feed, imports), not just the data file
      const files={};
      for(const[name,f]of Object.entries(gist.files||{})){if(f&&f.content!==undefined)files[name]={content:f.content};}
      if(!files[GIST_FILE])return; // sanity: never migrate a gist without our data file
      const newGist=await gistAPI('/gists',{method:'POST',body:JSON.stringify({
        description:GIST_DESC,public:false,files
      })});
      // Delete old public gist only after the secret one exists
      try{await gistAPI('/gists/'+gistId,{method:'DELETE'});}catch(e2){}
      const c=getSyncConfig();c.gistId=newGist.id;setSyncConfig(c);
      console.log('Recreated as secret gist:',newGist.id);

    // This device's data came from a GitHub sync that was already moved into a different account: not this person's
    const mt=getSyncConfig().migratedTo;
    if(!owner&&mt&&mt!==user.id){wipeLocalData();S=defS();}
    const unclaimed=!localStorage.getItem(OWNER_KEY)&&hasLocalData();// from before accounts existed, or used signed-out
    const row=await acctFetch(user.id);
    if(!_stillMe(user.id))return;
    if(owner===user.id){_acctBusy=false;await acctPull(true);if(_stillMe(user.id)&&(S.lastModified||0)>(getSyncConfig().lastPush||0))acctPush();return;}
    if(unclaimed){
      // Bring in the newest copy from the old GitHub sync first, so nothing made on another device is missed
      if(getSyncConfig().token&&!getSyncConfig().retired){try{await pullFromGist();}catch(e){}}
      if(!_stillMe(user.id))return;
      const n=(S.events||[]).length,remoteN=row&&row.data?normEvents(row.data).length:0;
      const choice=await acctAsk(row&&row.data
        ?{title:'Add this device\'s data to your account?',body:`This device has <b>${n} event${n===1?'':'s'}</b> that aren't saved to any account. Your account already has <b>${remoteN}</b>.<br><br><b>Add them</b> to combine both (nothing is lost). <b>Don't add</b> keeps a backup on this device and shows only your account's data.`,yes:'Add them',no:"Don't add",warn:true}
        :{title:'Move your existing data into your account?',body:`This device has <b>${n} event${n===1?'':'s'}</b>${getSyncConfig().token?' (including everything from your GitHub sync)':''}. Move it into your new account so it's private to you and available on any device you sign in to.<br><br>A backup copy stays on this device${getSyncConfig().token?' and in your GitHub gist':''} until you're sure everything is there.`,yes:'Move my data',no:'Start empty',warn:true});
      if(choice){
        if(row&&row.data){S.events=mergeEvents(normEvents(row.data),S.events||[]);S.leave={...(row.data.leave||{}),...(S.leave||{})};if(!S.prefs&&row.data.prefs)S.prefs=row.data.prefs;if(row.data.docs){const ids=new Set((S.docs||[]).map(d=>d.id));S.docs=[...(S.docs||[]),...row.data.docs.filter(d=>!ids.has(d.id))];}}
        S.lastModified=Date.now();
        localStorage.setItem(OWNER_KEY,user.id);
        _acctBusy=false;await acctPush();
        if(getSyncConfig().token&&!getSyncConfig().retired){try{await retireGist();}catch(e){console.warn('Could not mark gist as moved:',e);}}
        toast(`${(S.events||[]).length} events saved to your account`);
      }else{
        backupBeforeSync();
        S=defS();
        if(row&&row.data){S.events=normEvents(row.data);S.leave=row.data.leave||{};S.rates=row.data.rates||S.rates;S.prefs=row.data.prefs||S.prefs;S.docs=row.data.docs||S.docs;S.lastModified=row.modified_ms||1;}
        localStorage.setItem(OWNER_KEY,user.id);try{localStorage.setItem('htV5',JSON.stringify(S));}catch(e){}
      }
    }else{
      localStorage.setItem(OWNER_KEY,user.id);
      if(row&&row.data){S=defS();S.events=normEvents(row.data);S.leave=row.data.leave||{};S.rates=row.data.rates||S.rates;S.ratesUpdated=row.data.ratesUpdated||'';S.theme=row.data.theme||S.theme;S.docs=row.data.docs||[];S.prefs=row.data.prefs||S.prefs;S.calFeed=row.data.calFeed||null;S.visitedCountries=row.data.visitedCountries||[];S.appleCalUrl=row.data.appleCalUrl||'';S.appleCalUrlAt=row.data.appleCalUrlAt||0;S.lastModified=row.modified_ms||1;try{localStorage.setItem('htV5',JSON.stringify(S));}catch(e){}}
    }
  }catch(e){console.error('Sign-in sync failed:',e);toast('Signed in, but syncing failed: '+(e.message||e));}
  finally{_acctBusy=false;applyTheme();render();feedSync();setTimeout(()=>{try{if(!document.getElementById('mbg').classList.contains('open'))maybeAskRegion();}catch(e){}},400);}
}
// Yes/No dialog that resolves true/false (Cancel or closing = false)
function acctAsk(o){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v);}};
    modal(esc(o.title),`<p style="font-size:13px;line-height:1.6;color:var(--text2)">${o.body}</p>${o.warn?'<p style="font-size:12px;line-height:1.5;color:var(--orange);margin-top:10px">Only do this if this data is <b>yours</b>. On someone else\'s device, choose the other option. Their data stays with them.</p>':''}`,()=>{fin(true);},{saveLabel:o.yes});
    const bg=document.getElementById('mbg');
    bg.querySelectorAll('[data-action="xm"]').forEach(b=>{if(b.classList.contains('btn'))b.textContent=o.no;b.addEventListener('click',()=>fin(false));});
    const obs=new MutationObserver(()=>{if(!bg.classList.contains('open')){obs.disconnect();setTimeout(()=>fin(false),0);}});obs.observe(bg,{attributes:true,attributeFilter:['class']});
  });
}

// The account Supabase keeps on this device, if this device's data is that account's (used while offline)
let _acctOffline=false;
function savedAcct(){
  try{
    const own=localStorage.getItem(OWNER_KEY);if(!own)return null;
    for(const k of Object.keys(localStorage))if(/^sb-.+-auth-token$/.test(k)){const v=JSON.parse(localStorage.getItem(k)||'null');const u=v&&(v.user||(v.currentSession&&v.currentSession.user));if(u&&u.id===own)return u;}
  }catch(e){}
  return null;
}
async function acctInit(){
  const sb=sbClient();if(!sb){_acctReady=true;return;}
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session&&session.user||null,was=_acct&&_acct.id;
    // Offline with the saved account: only a real sign-out ends it (a sign-in that can't refresh yet doesn't)
    if(_acctOffline){if(!u&&ev!=='SIGNED_OUT')return;_acctOffline=false;}
    _acct=u;
    // Supabase advises not awaiting its own calls inside this callback
    setTimeout(()=>{
      if(ev==='PASSWORD_RECOVERY')acctShowNewPassword();
      if(u&&u.id!==was)acctOnSignIn(u);
      else if(!u&&was){wipeLocalData();S=defS();applyTheme();render();toast('Signed out');}
      else render();
    },0);
  });
  // Offline: open as the saved account straight away (Supabase can wait a long time retrying the sign-in)
  const saved=savedAcct();
  if(saved&&!navigator.onLine){_acct=saved;_acctOffline=true;_acctReady=true;try{render();}catch(e){}}
  const{data,error}=await sb.auth.getSession();
  // Supabase leaves a bare '#' after the Google sign-in return; tidy the address
  const tidy=()=>{if(location.href.endsWith('#'))try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}};tidy();setTimeout(tidy,600);
  if(!data.session){
    // No connection to refresh an expired sign-in: carry on as the saved account until there is one
    // (only for a network failure: a revoked sign-in is removed by Supabase, so savedAcct() is then empty)
    const still=savedAcct(),netFail=!navigator.onLine||!!(error&&/fetch|network|retryable/i.test((error.name||'')+' '+(error.message||'')));
    if(still&&netFail){_acct=still;_acctOffline=true;}else{_acct=null;_acctOffline=false;}
  }else _acctOffline=false;
  _acctReady=true;
  try{render();}catch(e){}
}

function sortEntries(arr,type){
  const k=sortKey,d=sortDir==='asc'?1:-1;
  return [...arr].sort((a,b)=>{
    if(k==='date'){
      const da=type==='flights'?(a.departureTime||''):type==='hotels'?(a.checkIn||''):(a.date||'');
      const db=type==='flights'?(b.departureTime||''):type==='hotels'?(b.checkIn||''):(b.date||'');
      return (da.localeCompare(db))*d;
    }
    if(k==='cost')return ((parseFloat(a.cost)||0)-(parseFloat(b.cost)||0))*d;
    if(k==='name'){
      const na=type==='flights'?((a.airline||'')+' '+(a.flightNumber||'')):type==='hotels'?(a.name||''):(a.name||'');
      const nb=type==='flights'?((b.airline||'')+' '+(b.flightNumber||'')):type==='hotels'?(b.name||''):(b.name||'');
      return na.localeCompare(nb)*d;
    }
    return 0;
  });
}

// ===== LIVE CURRENCY RATES =====
async function fetchLiveRates(){
  try{
    const res=await fetch('https://open.er-api.com/v6/latest/SGD');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data.result==='success'&&data.rates){
      // API returns how many X per 1 SGD. We store how many SGD per 1 X.
      // So rate = 1 / (data.rates[X])
      for(const[c,v]of Object.entries(data.rates)){
        if(c==='SGD'||!v)continue;
        S.rates[c]=parseFloat((1/v).toPrecision(6));
      }
      S.ratesUpdated=new Date().toISOString().slice(0,16).replace('T',' ');
      if(data.time_last_update_unix)S.ratesAsOf=data.time_last_update_unix*1000;// when the provider published these rates
      // Every device refreshes rates itself: save locally without marking the data as edited
      try{localStorage.setItem('htV5',JSON.stringify(S));}catch(e){}
      console.log('Live rates updated:', S.ratesUpdated);
    }
  }catch(e){console.warn('Currency fetch failed, using cached rates:',e.message);}
}

// Global search: events by name, place, notes, and their bookings (flight numbers, references, hotels, activities)
function globalSearch(q){
  q=q.trim().toLowerCase();if(q.length<2)return [];
  const hit=v=>v&&String(v).toLowerCase().includes(q);
  const out=[];
  (S.events||[]).forEach(t=>{
    let why='';
    if(!hit(t.name)){
      const loc=(t.locations||[]).find(hit);
      const f=(t.flights||[]).find(x=>hit(x.flightNumber)||hit(x.pnr)||hit(x.airline)||hit(x.from)||hit(x.to));
      const h=(t.hotels||[]).find(x=>hit(x.name)||hit(x.bookingNumber));
      const a=(t.activities||[]).find(x=>hit(x.name)||hit(x.location)||hit(x.bookingDetails));
      const x=(t.transport||[]).find(y=>hit(y.name)||hit(y.bookingDetails));
      why=loc?loc:f?`Flight ${f.flightNumber||f.airline||''}${f.pnr&&hit(f.pnr)?' · '+f.pnr:''}`:h?`Hotel · ${h.name}`:a?`Activity · ${a.name}`:x?`Transport · ${x.name}`:hit(t.notes)?'In notes':null;
      if(why===null)return;
    }
    out.push({t,why});
  });
  const st={active:0,upcoming:1,completed:2};
  return out.sort((a,b)=>st[eventStatus(a.t)]-st[eventStatus(b.t)]||(eventStatus(a.t)==='completed'?b.t.startDate.localeCompare(a.t.startDate):a.t.startDate.localeCompare(b.t.startDate))).slice(0,8);
}
function renderSearchResults(){
  const inp=document.getElementById('gsearch'),box=document.getElementById('gs-results');if(!inp||!box)return;
  const q=inp.value,res=globalSearch(q);
  if(q.trim().length<2){box.classList.remove('on');box.innerHTML='';return;}
  box.innerHTML=res.length?res.map((r,i)=>`<div class="gs-item${i===0?' sel':''}" data-action="gs-open" data-id="${r.t.id}" role="option"><span class="gs-kick">${esc(r.t.source==='apple'?'Apple Calendar':catLabel(r.t.category||'trip'))} · ${esc(rangeText(r.t))}</span><span class="gs-name">${esc(r.t.name)}</span>${r.why?`<span class="gs-why">${esc(r.why)}</span>`:''}</div>`).join(''):`<div class="gs-empty">No matches for “${esc(q.trim())}”</div>`;
  box.classList.add('on');
}

  const leaveAhead=(()=>{let n=0;const end=String(curYear)+'-12-31';S.events.forEach(t=>{if(t.requiresLeave===false||!t.startDate||!t.endDate)return;
    let c=new Date((t.startDate>td?t.startDate:td)+'T00:00:00');const e=new Date((t.endDate<end?t.endDate:end)+'T00:00:00');
    while(c<=e){const ds=ymd(c);if(isWorkday(ds)&&!getAppliedForDate(ds))n++;c.setDate(c.getDate()+1);}});return n;})();
  const live=ft.filter(t=>eventStatus(t)!=='completed').sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const trips=live.filter(t=>t.source!=='apple');
  const hero=trips.find(t=>eventStatus(t)==='active')||trips[0]||null;
  // Needs attention: payments, leave shortfall, real time clashes (date overlaps are normal: a dinner during a trip)
  const att=[];
  live.forEach(t=>['flights','hotels','activities','transport'].forEach(k=>(t[k]||[]).forEach(i=>{
    if(!i.paymentDueDate||i.fullyPaid==='yes')return;
    const d=daysUntil(i.paymentDueDate);if(d>45)return;
    const nm=i.name||i.flightNumber||i.airline||({flights:'Flight',hotels:'Hotel',activities:'Activity',transport:'Transport'})[k];
    att.push({o:d,html:`<div class="att${d<0?' bad':''}" data-action="view" data-id="${t.id}"><span class="att-ic">💳</span><div><b>${d<0?'Payment overdue':d===0?'Payment due today':'Payment due '+esc(fmtS(i.paymentDueDate))}</b><span>${esc(nm)} · ${esc(t.name)}</span></div><span class="att-go">›</span></div>`});
  })));
  if(lyTotals.tot&&leaveAhead>lyTotals.bal){const sh=+(leaveAhead-lyTotals.bal).toFixed(1);att.push({o:999,html:`<div class="att bad" data-action="nav" data-to="leave"><span class="att-ic">🗓</span><div><b>${sh} more leave day${sh!==1?'s':''} needed this year</b><span>Upcoming trips need ${leaveAhead} not yet applied for; you have ${lyTotals.bal} left</span></div><span class="att-go">›</span></div>`});}
  const tc=live.filter(t=>findClashes(t,t.id).some(c=>c.severity==='time'));
  if(tc.length)att.push({o:998,html:`<div class="att bad" data-action="show-all-clashes"><span class="att-ic">⚠</span><div><b>${tc.length} time clash${tc.length>1?'es':''}</b><span>${esc(tc.slice(0,3).map(t=>t.name).join(', '))}${tc.length>3?'…':''}</span></div><span class="att-go">›</span></div>`});
  docWarnings().forEach(w=>att.push({o:w.o,html:`<div class="att${w.bad?' bad':''}" data-action="${w.tid?'view':'nav'}" ${w.tid?`data-id="${w.tid}"`:'data-to="settings"'}><span class="att-ic">🛂</span><div><b>${esc(w.text)}</b><span>${esc(w.sub)}</span></div><span class="att-go">›</span></div>`}));
  att.sort((a,b)=>a.o-b.o);
  const heroHtml=hero?(()=>{const t=hero,st=eventStatus(t),fl=(t.flights||[]).length,ho=(t.hotels||[]).length,ac=(t.activities||[]).length,cost=eCost(t),ps=eventPaymentStatus(t);
    const facts=[fl?`<i class="ic ic-fl"></i>${fl} flight${fl>1?'s':''}`:'',ho?`<i class="ic ic-ho"></i>${ho} hotel${ho>1?'s':''}`:'',ac?`<i class="ic ic-ac"></i>${ac} activit${ac>1?'ies':'y'}`:'',cost?fmtM(cost,baseCur()):'',ps?`<span style="color:${ps.color}">${ps.status==='paid'?'✓':'●'} ${esc(ps.label)}</span>`:''].filter(Boolean);
    const dl=daysUntil(t.startDate);
    const prog=st==='active'?Math.min(100,Math.round((Math.abs(dl)+1)/days(t.startDate,t.endDate)*100)):0;
    return `<div class="hero${st==='active'?' live':''}" data-action="view" data-id="${t.id}" data-drop-ev="${t.id}" style="--c:${eColor(t)};--prog:${prog}%">
      <div class="hero-k">${st==='active'?'Happening now':'Next up'}</div>
      <div class="hero-row"><div style="min-width:0"><div class="hero-name">${esc(t.name)}</div><div class="hero-meta">${esc(rangeText(t))} · ${days(t.startDate,t.endDate)} days${(t.locations||[]).length?' · '+esc(t.locations.slice(0,3).join(', ')):''}</div></div>
        <div class="hero-cd">${st==='active'?`<b>Day ${Math.abs(dl)+1}</b><span>of ${days(t.startDate,t.endDate)}</span>`:dl===0?'<b>Today</b>':`<b>${dl}</b><span>day${dl!==1?'s':''} to go</span>`}</div></div>
      ${facts.length?`<div class="hero-facts">${facts.map(f=>`<span>${f}</span>`).join('')}</div>`:''}
    </div>`;})()
    :`<div class="hero empty-hero"><div class="hero-name">No trips planned yet</div><div class="hero-meta">Add one, or drop a booking confirmation on the Scan button.</div><button class="btn btn-p" data-action="add-event" style="margin-top:12px">+ New Event</button></div>`;
  // Coming up: trips and events only; Apple Calendar appointments get their own compact list (next 7 days)
  const rest=trips.filter(t=>t!==hero).slice(0,6);
  const wk=ymd(new Date(Date.now()+7*864e5));
  const appts=live.filter(t=>t.source==='apple'&&t.startDate<=wk&&(t.endDate||t.startDate)>=td);
  const apptHtml=appts.length?`<div class="sec"><div class="sec-h">Appointments<span class="sec-n">next 7 days</span></div><div class="appt-list">${appts.slice(0,6).map(t=>`<div class="appt" data-action="view" data-id="${t.id}"><span class="appt-d">${t.startDate===td?'Today':esc(new Date(t.startDate+'T00:00:00').toLocaleDateString(dloc(),{weekday:'short',day:'numeric',month:'short'}))}${t.startTime?' · '+esc(t.startTime):''}</span><span class="appt-n">${esc(t.name)}</span></div>`).join('')}${appts.length>6?`<a href="#" class="appt-more" data-action="nav" data-to="calendar">${appts.length-6} more in the Calendar ›</a>`:''}</div></div>`:'';
  const yr=ft.filter(t=>t.source!=='apple'&&t.startDate&&t.startDate.startsWith(String(curYear)));
  const away=yr.reduce((s,t)=>s+days(t.startDate,t.endDate),0);
  const subtitle=[`${yr.length} event${yr.length!==1?'s':''} in ${curYear}`,away?`${away} days away`:'',lyTotals.tot?`${lyTotals.bal} leave day${lyTotals.bal!==1?'s':''} left`:''].filter(Boolean).join(' · ');
  return `
  <div class="page-header"><div><h2>${(()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening';})()}${acctFirstName()?', '+esc(acctFirstName()):''}</h2><div class="subtitle">${subtitle}</div></div><div style="display:flex;align-items:center;gap:8px">${syncIndicatorHtml()}<button class="btn btn-p" data-action="add-event">+ New Event</button></div></div>
  <div class="page-content dash">
    ${dashAccountCardHtml()}
    ${heroHtml}
    ${att.length?`<div class="sec"><div class="sec-h">Needs attention</div><div class="att-list">${att.map(a=>a.html).join('')}</div></div>`:''}
    <div class="sec"><div class="sec-h">Coming up<a href="#" data-action="nav" data-to="events">See all events ›</a></div>
      ${rest.length?`<div class="evr-list">${rest.map(t=>evRowHtml(t)).join('')}</div>`:'<p class="quiet">Nothing else planned yet.</p>'}
    </div>
    ${apptHtml}
  </div>`;
}

// ===== MY EVENTS =====
function vEvents(){
  const ui=listUI(),q=(S._searchQ||'').toLowerCase(),catF=S._catFilter||'all',showApple=ui.apple===true,view=ui.view==='cards'?'cards':'list';
  const yrs=[...new Set(S.events.map(t=>t.year||new Date(t.startDate).getFullYear()))].filter(Boolean).sort((a,b)=>b-a);
  let list=tpFilter(S.events).filter(t=>!S.tfY||(t.year||new Date(t.startDate).getFullYear())==S.tfY);
  if(catF!=='all')list=list.filter(t=>(t.category||'trip')===catF);
  if(!showApple)list=list.filter(t=>t.source!=='apple');
  if(q)list=list.filter(t=>t.name.toLowerCase().includes(q)||(t.locations||[]).some(l=>l.toLowerCase().includes(q))||(t.notes||'').toLowerCase().includes(q));
  const appleN=S.events.filter(t=>t.source==='apple').length;
  const usedCats=[...new Set(S.events.map(t=>t.category||'trip'))],cats=CATEGORIES.filter(c=>usedCats.includes(c.id));
  const render1=arr=>view==='cards'?`<div class="trip-grid">${arr.map(eventCardHtml).join('')}</div>`:`<div class="evr-list">${arr.map(t=>evRowHtml(t)).join('')}</div>`;
  let body;
  if(eventSortKey==='date'){
    // By date: now, then upcoming (soonest first), then past (most recent first, a few at a time)
    const now=list.filter(t=>eventStatus(t)==='active'),up=list.filter(t=>eventStatus(t)==='upcoming').sort((a,b)=>a.startDate.localeCompare(b.startDate)),past=list.filter(t=>eventStatus(t)==='completed').sort((a,b)=>(b.endDate||b.startDate).localeCompare(a.endDate||a.startDate));
    const pastN=ui.pastAll?past.length:Math.min(past.length,12);
    body=[now.length?`<div class="sec"><div class="sec-h">Now</div>${render1(now)}</div>`:'',
      up.length?`<div class="sec"><div class="sec-h">Upcoming <span class="cnt">${up.length}</span></div>${render1(up)}</div>`:'',
      past.length?`<div class="sec"><div class="sec-h">Past <span class="cnt">${past.length}</span></div>${render1(past.slice(0,pastN))}${past.length>pastN?`<button class="btn btn-ghost more-btn" data-action="ev-past-all">Show ${past.length-pastN} more past events</button>`:''}</div>`:''].join('');
  }else body=render1(sortEvents(list));
  return `
  <div class="page-header"><div><h2>My Events</h2><div class="subtitle">${list.length===S.events.length?list.length+' events':list.length+' of '+S.events.length+' events'}</div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${tpHtml()}<button class="btn btn-p" data-action="add-event">+ New Event</button></div></div>
  <div class="page-content">
    <div class="toolbar${ui.filtersOpen?' open':''}">
      <button class="btn btn-s tb-filters-btn" data-action="ev-filters">Filters${(catF!=='all'||S.tfY||!showApple||eventSortKey!=='date')?' ·':''}</button>
      <div class="search-bar tb-search ev-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search events…" value="${esc(S._searchQ||'')}" data-action="search-events"></div>
      <select class="fc tb-sel" data-action="ev-cat" aria-label="Type"><option value="all">All types</option>${cats.map(c=>`<option value="${c.id}"${catF===c.id?' selected':''}>${c.label}</option>`).join('')}</select>
      <select class="fc tb-sel" data-action="ev-year" aria-label="Year"><option value="">All years</option>${yrs.map(y=>`<option value="${y}"${S.tfY==y?' selected':''}>${y}</option>`).join('')}</select>
      ${sortCtrlHtml('event',eventSortKey,eventSortDir)}
      ${appleN?`<label class="tb-check" title="Appointments imported from Apple Calendar"><input type="checkbox" data-action="ev-apple"${showApple?' checked':''}> Apple Calendar (${appleN})</label>`:''}
      <div class="seg" role="group" aria-label="Layout"><button class="${view==='list'?'on':''}" data-action="ev-view" data-v="list">List</button><button class="${view==='cards'?'on':''}" data-action="ev-view" data-v="cards">Cards</button></div>
    </div>
    ${list.length?body:'<div class="empty"><p>No events found</p><p style="font-size:11px;color:var(--text3)">Try a different search or filter</p></div>'}
  </div>`;
}

function eventCardHtml(t){
  // Compact card: category kicker, title, short dates, only the facts that exist
  const isApple=t.source==='apple',st=eventStatus(t),n=days(t.startDate,t.endDate);
  const fl=(t.flights||[]).length,ho=(t.hotels||[]).length,cost=eCost(t);
  const timeClash=findClashes(t,t.id).filter(c=>c.severity==='time');
  const places=(t.locations||[]).filter(l=>l&&l.length<=30).slice(0,3);
  return`<div class="trip-card ec${isApple?' apple':''}${st==='completed'?' past':''}" data-action="view" data-id="${t.id}" ${isApple?`draggable="true" data-apple-drag="${t.id}" title="${esc(t.name)} · drag onto a trip to add it there"`:`data-drop-ev="${t.id}" title="${esc(t.name)}"`}>
    <div class="trip-accent" style="background:${eColor(t)}"></div>
    <div class="trip-body">
      <div class="ec-kick">${isApple?'Apple Calendar':esc(catLabel(t.category||'trip'))}${timeClash.length?` <span class="evr-warn clash-link" data-action="show-clash" data-id="${t.id}" title="Time clash with ${esc(timeClash.map(c=>c.event.name).join(', '))}">⚠</span>`:''}</div>
      <div class="trip-name">${esc(t.name)}</div>
      <div class="ec-dates">${esc(rangeText(t))}${n>1?' · '+n+' days':''}</div>
      ${places.length?`<div class="ec-places">${places.map(l=>`<span class="tag">${esc(l)}</span>`).join('')}</div>`:''}
      ${fl||ho||cost||isApple?`<div class="ec-foot">${fl?`<span><i class="ic ic-fl"></i>${fl}</span>`:''}${ho?`<span><i class="ic ic-ho"></i>${ho}</span>`:''}${cost?`<span class="ec-cost">${fmtM(cost,baseCur())}</span>`:''}${isApple?`<button class="evr-add ec-add" data-action="apple-attach" data-id="${t.id}" title="Add to a trip">+</button>`:''}</div>`:''}
    </div>
  </div>`;
}

      <div class="stat green"><div class="s-label">${eCostFull(t)-eCost(t)>0.005?'Your Cost':'Total Cost'}</div><div class="s-val">${fmtM(eCost(t),'')}</div><div class="s-sub">${baseCur()}${eCostFull(t)-eCost(t)>0.005?` · of ${fmtM(eCostFull(t),'')} total`:''}</div></div>

      <div class="stat orange"><div class="s-label">Bookings</div><div class="s-val">${(t.flights||[]).length+(t.hotels||[]).length+(t.activities||[]).length+(t.transport||[]).length}</div></div>

        ${f.seat?`<div class="eg"><span class="ek">Seat</span><span class="ev">${esc(f.seat)}</span></div>`:''}

const ckToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const ckShift=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function ckCount(t){const l=t.checklist||[];return l.length?'('+l.filter(x=>x.done).length+'/'+l.length+')':'';}
// Ideas for the trip, each with a sensible due date counted back from departure
function ckSuggestions(t){
  const has=new Set((t.checklist||[]).map(x=>x.text.trim().toLowerCase()));
  const home=typeof COUNTRY_ISO2!=='undefined'&&Object.keys(COUNTRY_DATA).find(id=>(COUNTRY_ISO2[id]||'').toUpperCase()===(P().country||''));
  const cs=(t.countries||[]).filter(Boolean),abroad=!cs.length||cs.some(c=>c!==home);
  const list=[
    abroad&&['Check passport is valid 6+ months',-60],
    abroad&&['Check visa / entry requirements',-45],
    ['Buy travel insurance',-30],
    abroad&&['Tell my bank I\'m travelling',-7],
    abroad&&['Get an eSIM or roaming plan',-5],
    (t.flights||[]).length&&['Online check-in',-1],
    ['Book airport transfer',-7],
    abroad&&['Exchange some cash',-3],
    ['Pack chargers & travel adapter',-1],
    ['Download offline maps',-1],
  ].filter(Boolean);
  return list.filter(([x])=>!has.has(x.toLowerCase())).slice(0,6);
}

    if(t.requiresLeave===false)return;
    if(!t.startDate||!t.endDate)return;
    let cur=new Date(t.startDate+'T00:00:00');const end=new Date(t.endDate+'T00:00:00');
    while(cur<=end){
      const ds=ymd(cur);const dow=cur.getDay();
      if(ds.startsWith(yStr)&&!isWeekendDow(dow)&&!isWorkPH(ds))count++;
      cur.setDate(cur.getDate()+1);
    }
  });
  return count;
}
// Count applied leave days for a year
function calcAppliedDays(year){
  const l=S.leave[year];if(!l||!l.applied)return 0;
  let count=0;
  l.applied.forEach(a=>{
    if(!a.from||!a.to)return;
    let cur=new Date(a.from+'T00:00:00');const end=new Date(a.to+'T00:00:00');
    while(cur<=end){
      if(isWorkday(ymd(cur)))count+=a.half?0.5:1;

// Check if a specific date has applied leave
function getAppliedForDate(dateStr,year){
  const l=S.leave[year||parseInt(dateStr.slice(0,4))];if(!l||!l.applied)return false;
  return l.applied.some(a=>a.from<=dateStr&&a.to>=dateStr);
}
// Migrate flat leave data → jobs array
function migrateLeaveJobs(l){
  if(l.jobs)return l;
  const job={employer:l.employer||'',startDate:'',endDate:'',al:l.al||0,bp:l.bp||0,ot:l.ot||0,ph:l.ph||0,taken:l.taken||0};
  return{...l,jobs:[job],applied:l.applied||[]};
